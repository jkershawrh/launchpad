name: Launchpad Backend Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source revision to build
        required: true
        type: string
      publish:
        description: Publish, sign, and attest the image after all gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  IMAGE_REPOSITORY: quay.io/rh-ee-jkershaw/launchpad-backend

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Fail closed on revision drift
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain)"

      - name: Set up emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build the exact linux/amd64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: backend/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.expected_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Inventory all candidate vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-report.json

      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: vulnerability-report-fixable.json

      - name: Retain vulnerability evidence even when the gate blocks
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-vulnerability-scan-${{ inputs.expected_sha }}
          path: |
            vulnerability-report.json
            vulnerability-report-fixable.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Retain pre-publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-release-${{ inputs.expected_sha }}
          path: |
            vulnerability-report.json
            vulnerability-report-fixable.json
            sbom.spdx.json

      - name: Log in to Quay
        if: ${{ inputs.publish }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: quay.io
          username: ${{ secrets.LAUNCHPAD_QUAY_USERNAME }}
          password: ${{ secrets.LAUNCHPAD_QUAY_TOKEN }}

      - name: Publish immutable candidate and record digest
        if: ${{ inputs.publish }}
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REPOSITORY}:git-${{ inputs.expected_sha }}"
          docker push "$image"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          test -n "$digest_ref"
          digest="${digest_ref##*@}"
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest_ref" > image-digest.txt

      - name: Install Cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sign the published digest with GitHub OIDC
        if: ${{ inputs.publish }}
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
        run: cosign sign --yes "$DIGEST_REF"

      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}

      - name: Retain the published digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-release-digest-${{ inputs.expected_sha }}
          path: image-digest.txt
