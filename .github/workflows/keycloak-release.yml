name: Launchpad Keycloak Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source revision to build
        required: true
        type: string
      publish:
        description: Publish, sign, and attest the image after all gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/launchpad-keycloak

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Fail closed on revision drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain)"
          [[ "${{ inputs.expected_sha }}" =~ ^[0-9a-f]{40}$ ]]

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run authenticator and landing-page contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"
          python -m pytest \
            backend/tests/test_keycloak_authenticator_contract.py \
            backend/tests/test_public_gateway_availability_contract.py \
            -q --tb=short
          mvn -B -f keycloak-authenticator/pom.xml package -DskipTests

      - name: Set up emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build the exact linux/amd64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: keycloak-authenticator
          file: keycloak-authenticator/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.expected_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Inventory all candidate vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-report.json

      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: vulnerability-report-fixable.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:git-${{ inputs.expected_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Retain pre-publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keycloak-release-evidence-${{ inputs.expected_sha }}
          path: |
            vulnerability-report.json
            vulnerability-report-fixable.json
            sbom.spdx.json

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable candidate and record digest
        if: ${{ inputs.publish }}
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REPOSITORY}:git-${{ inputs.expected_sha }}"
          docker push "$image"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          test -n "$digest_ref"
          digest="${digest_ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg source_revision "${{ inputs.expected_sha }}" \
            --arg image "$digest_ref" \
            '{schema_version:"launchpad.redhat.com/keycloak-release/v1",source_revision:$source_revision,image:$image,platform:"linux/amd64",published:true}' \
            > keycloak-release.json

      - name: Install Cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sign the published digest with GitHub OIDC
        if: ${{ inputs.publish }}
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
        run: cosign sign --yes "$DIGEST_REF"

      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}

      - name: Retain the immutable release receipt
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keycloak-release-${{ inputs.expected_sha }}
          path: keycloak-release.json
