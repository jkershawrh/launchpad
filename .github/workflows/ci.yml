name: Launchpad CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks evaluates its maintained default rules plus this repository's
      # narrow allowlist in .gitleaks.toml. On pull requests and pushes the
      # action scans the event's commit range, catching a secret even if a
      # later commit deletes it.
      - name: Scan commit range with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Manifest contract tests render the same OpenShift/Kustomize overlays
      # used by the release process. Pin the client so CI does not depend on
      # whichever tools happen to be present in the hosted-runner image.
      - name: Install pinned OpenShift client
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.21.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install ".[dev]"

      - name: Validate secret-scan configuration
        run: python -m pytest scripts/tests/test_gitleaks_config.py -q

      - name: Lint
        run: |
          cd backend
          # The inherited repository has a large modernization backlog. Keep
          # fatal Python errors blocked globally while applying the full rule
          # set to the release-candidate supply-chain code introduced here.
          ruff check app/ tests/ --select E9,F63,F7,F82
          ruff check app/services/catalog_supply_chain.py tests/test_catalog_supply_chain.py tests/test_artifact_registry_policy.py
          cd ..
          ruff check scripts/validate_artifact_registry.py scripts/validate_security_threat_model.py scripts/validate_audit_integrity_retention.py scripts/validate_delivery_governance.py scripts/write_ci_test_receipt.py scripts/tests/test_validate_security_threat_model.py scripts/tests/test_validate_audit_integrity_retention.py scripts/tests/test_validate_delivery_governance.py scripts/tests/test_write_ci_test_receipt.py

      - name: Validate product roadmap dashboard
        run: |
          python -m pytest scripts/tests/test_generate_product_roadmap_dashboard.py -q
          python -m pytest scripts/tests/test_validate_delivery_governance.py -q
          python -m pytest scripts/tests/test_validate_security_threat_model.py -q
          python -m pytest scripts/tests/test_validate_audit_integrity_retention.py -q
          python -m pytest scripts/tests/test_write_ci_test_receipt.py -q
          python scripts/validate_delivery_governance.py \
            --output "${{ runner.temp }}/delivery-governance.json"
          python scripts/validate_security_threat_model.py \
            --output "${{ runner.temp }}/security-threat-model.json"
          python scripts/validate_audit_integrity_retention.py \
            --output "${{ runner.temp }}/audit-integrity-retention.json"
          python scripts/generate_product_roadmap_dashboard.py --check

      - name: Validate YAML source inventory freshness
        run: |
          python -m pytest scripts/tests/test_inventory_yaml_sources.py -q
          python scripts/inventory_yaml_sources.py --check

      - name: Unit tests
        id: unit_tests
        env:
          PYTHONPATH: backend
        run: >
          python -m pytest backend/tests/ -q
          --ignore=backend/tests/test_local_provisioning.py
          --ignore=backend/tests/test_sandbox.py
          --ignore=backend/tests/test_demo_migration.py
          -k "not (test_system_status or test_container_list or test_container_logs or test_container_restart or test_diagnostics_returns_health or test_api_system_status)"
          --tb=short
          --junitxml="${{ runner.temp }}/backend-unit-tests.xml"

      - name: Save test receipt
        if: always()
        env:
          UNIT_TEST_STEP_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          python scripts/write_ci_test_receipt.py \
            --junit "${{ runner.temp }}/backend-unit-tests.xml" \
            --output "${{ runner.temp }}/launchpad-receipts/ci-latest.json" \
            --step-outcome "$UNIT_TEST_STEP_OUTCOME" \
            --commit "$GITHUB_SHA" \
            --trigger "$GITHUB_EVENT_NAME" \
            --branch "$GITHUB_REF_NAME"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-receipt
          path: ${{ runner.temp }}/launchpad-receipts/ci-latest.json

      - name: Upload delivery governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-governance-receipt
          path: ${{ runner.temp }}/delivery-governance.json

      - name: Upload security threat-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-threat-model-receipt
          path: ${{ runner.temp }}/security-threat-model.json

      - name: Upload audit integrity and retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-integrity-retention-receipt
          path: ${{ runner.temp }}/audit-integrity-retention.json

  catalog-onboarding:
    name: Catalog Onboarding Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install catalog and Antora validators
        run: |
          pip install pyyaml requests
          npm ci

      - name: Validate pinned onboarding sources and generated catalog
        env:
          RECEIPT_DIR: ${{ runner.temp }}/launchpad-receipts
        run: |
          mkdir -p "$RECEIPT_DIR"
          for intake in catalog-onboarding/*.yaml; do
            catalog_id="${intake##*/}"
            catalog_id="${catalog_id%.yaml}"
            managed="$(python -c 'import sys,yaml; data=yaml.safe_load(open(sys.argv[1])); print(str(bool((data.get("metadata") or {}).get("onboarding_managed"))).lower())' "catalog/$catalog_id/catalog-item.yaml")"
            if [ "$managed" != "true" ]; then
              echo "Skipping strict source-drift validation for legacy catalog: $catalog_id"
              continue
            fi
            python scripts/catalog_onboarding.py validate \
              "$intake" \
              --catalog "catalog/$catalog_id/catalog-item.yaml" \
              --fetch \
              --build-showroom \
              --antora-bin node_modules/.bin/antora \
              --report "$RECEIPT_DIR/catalog-onboarding-$catalog_id.json"
          done

      - name: Validate reusable catalog certification contracts
        env:
          RECEIPT_DIR: ${{ runner.temp }}/launchpad-receipts
        run: |
          mkdir -p "$RECEIPT_DIR"
          for contract in certification/catalog/*.yaml; do
            catalog_id="${contract##*/}"
            catalog_id="${catalog_id%.yaml}"
            python scripts/catalog_certification.py validate \
              "$contract" \
              --intake "catalog-onboarding/$catalog_id.yaml" \
              > "$RECEIPT_DIR/catalog-certification-$catalog_id.json"
          done

      - name: Enforce immutable pilot catalog artifacts
        env:
          RECEIPT_DIR: ${{ runner.temp }}/launchpad-receipts
        run: |
          python scripts/validate_catalog_artifacts.py \
            --output "$RECEIPT_DIR/catalog-artifact-policy.json"

      - name: Validate authoritative registry contract
        env:
          RECEIPT_DIR: ${{ runner.temp }}/launchpad-receipts
        run: |
          python scripts/validate_artifact_registry.py \
            --output "$RECEIPT_DIR/artifact-registry-policy.json"

      - name: Upload onboarding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-onboarding-receipts
          path: |
            ${{ runner.temp }}/launchpad-receipts/catalog-onboarding-*.json
            ${{ runner.temp }}/launchpad-receipts/catalog-certification-*.json
            ${{ runner.temp }}/launchpad-receipts/catalog-artifact-policy.json
            ${{ runner.temp }}/launchpad-receipts/artifact-registry-policy.json

  frontend-check:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin, demos/frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install + type-check
        run: |
          cd ${{ matrix.app }}
          npm ci
          npx tsc --noEmit

  helm-validate:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Template all 10 demos
        run: |
          for demo in overdrive try-it swarm agent operations governance recovery workload training replay; do
            helm template test-$demo tenant/bootstrap/ \
              --set tenant.name=ci-test \
              --set demo.namespace=ci-$demo \
              --set demo.pages=$demo \
              --set demo.gateway.litellmApiEndpoint=https://test.example.com \
              --set demo.gateway.litellmVirtualKey=sk-test \
              > /dev/null
            echo "OK: $demo"
          done

  image-build:
    name: Build Images (no push)
    runs-on: ubuntu-latest
    needs: [test, frontend-check, helm-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Build demo frontend
        run: docker build -t launchpad-demo-frontend:ci -f demos/frontend/Containerfile demos/frontend/

      - name: Build gateway
        run: docker build -t launchpad-gateway:ci -f demos/gateway/Containerfile demos/gateway/

      - name: Build backend
        run: docker build -t launchpad-backend:ci -f backend/Containerfile .

      - name: Build requester portal
        run: docker build -t launchpad-portal:ci -f frontend/Containerfile frontend/

      - name: Build admin portal
        run: docker build -t launchpad-admin:ci -f admin/Containerfile admin/
