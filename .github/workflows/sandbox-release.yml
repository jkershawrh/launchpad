name: Sandbox image release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demos/containers/sandbox/**
      - .github/workflows/sandbox-release.yml

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: demos/containers/sandbox
          file: demos/containers/sandbox/Containerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/launchpad-sandbox:${{ github.sha }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/launchpad-sandbox
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
