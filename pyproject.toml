[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partner-ai-launchpad"
version = "0.1.0"
description = "Reusable Red Hat/Intel partner demo and lab platform"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "local: tests that require running demo containers (podman-compose)",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.setuptools.packages.find]
where = ["backend"]
