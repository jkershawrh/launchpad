# Gitleaks config — blocks secrets from being committed
# Install: brew install gitleaks
# Run manually: gitleaks detect --source . --verbose
# Pre-commit hook runs automatically on every commit

title = "StarGate Secret Detection"

[extend]
useDefault = true

[allowlist]
  paths = [
    '''node_modules''',
    '''__pycache__''',
    '''\.git''',
    '''frontend/dist''',
    # This vendored Showroom header embeds a PNG as a data URI. Random bytes
    # in that image can resemble an AWS access-key prefix, but it is not a
    # credential. Keep the exception scoped to the single asset-bearing file.
    '''content-agentops-observability/supplemental-ui/partials/header-content\.hbs''',
  ]
  regexTarget = "line"
  regexes = [
    '''REDACTED''',
    '''replace-with''',
    '''changeme''',
    '''EXAMPLE''',
    '''dummy''',
    '''placeholder''',
    '''sk-automation-workspace-setup''',
    '''lookup\(.*password''',
    # OAuth-proxy identity headers in unit-test fixtures. These values are
    # synthetic user identifiers, not authentication credentials.
    '''x-auth-request-(user|email)["']?\s*:\s*["'][a-z0-9-]+''',
    # Kubernetes Secret object references identify an object; they do not
    # contain the Secret value.
    '''secretName:\s*[a-z0-9-]+''',
    # Public/internal Keycloak endpoint constants contain hostnames only.
    '''KEYCLOAK_(HOST|INT_ORIGIN)\s*=\s*["'](https?://)?[a-z0-9.:-]+''',
    # Stable evidence correlation identifiers used for repeatability reports.
    '''arena-(cpu-serving-25|cpu-five)-20260904-final''',
  ]
