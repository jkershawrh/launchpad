api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification
metadata:
  catalog_item_id: openshift-operators-workshop
  display_name: "OpenShift 201: Build an Operator-Managed Pipeline"
spec:
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies: [internal, public_code]
  scale_profiles:
    - {seats: 1, required_consecutive_runs: 1, probe_concurrency: 1, maximum_ready_seconds: 900, maximum_cleanup_seconds: 600}
    - {seats: 5, required_consecutive_runs: 1, probe_concurrency: 5, maximum_ready_seconds: 1500, maximum_cleanup_seconds: 900}
  showroom:
    pages:
      - {id: welcome, path: /www/modules/index.html, marker: "Build an Operator-Managed Pipeline"}
      - {id: discover, path: /www/modules/02-operator-discovery.html, marker: "Discover the Operator API"}
      - {id: author, path: /www/modules/03-deploy-and-observe.html, marker: "Author the desired state"}
      - {id: run, path: /www/modules/04-run-and-observe.html, marker: "Run and observe reconciliation"}
      - {id: cleanup, path: /www/modules/05-prove-and-cleanup.html, marker: "Prove cleanup and ownership"}
  seat_probe:
    argv: [bash, scripts/certify-operator-workshop-seat.sh, "{namespace}", "{cluster_ref}"]
    timeout_seconds: 600
    result_format: json
    json_assertions:
      - {path: result, equals: GREEN-live-internal-seat}
      - {path: cluster_ref, equals: flightpath}
      - {path: operator.api_available, equals: true}
      - {path: operator.run_succeeded, equals: true}
      - {path: operator.result_marker, equals: true}
      - {path: operator.resources_removed, equals: true}
      - {path: terminal_scope, contains: own_edit=yes}
      - {path: terminal_scope, contains: cross_namespace=DENIED}
      - {path: terminal_scope, contains: node_list=DENIED}
      - {path: contains_sensitive_values, equals: false}
  cleanup:
    resources: [namespaces, applications.argoproj.io, rolebindings.rbac.authorization.k8s.io, persistentvolumeclaims, persistentvolumes, routes.route.openshift.io, secrets]
  rubric:
    required_score: 100
    categories:
      - {id: contract_integrity, weight: 10, requires: [contract_valid, evidence_hashed]}
      - {id: placement_capacity, weight: 15, requires: [capacity_passed, single_cluster_assignment]}
      - {id: provisioning_readiness, weight: 20, requires: [all_seats_ready, ready_within_limit]}
      - {id: participant_function, weight: 25, requires: [showroom_pages_passed, seat_probes_passed]}
      - {id: authorization, weight: 15, requires: [namespace_isolation_passed, sensitive_values_absent]}
      - {id: cleanup, weight: 15, requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]}
