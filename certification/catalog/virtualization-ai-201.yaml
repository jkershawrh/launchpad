api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification
metadata: {catalog_item_id: virtualization-ai-201, display_name: "Virtualization + AI 201: Author and Qualify the Contract"}
spec:
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies: [internal]
  scale_profiles:
    - {seats: 1, required_consecutive_runs: 1, probe_concurrency: 1, maximum_ready_seconds: 1200, maximum_cleanup_seconds: 600}
  showroom:
    pages:
      - {id: welcome, path: /www/virtualization-ai-201/main/index.html, marker: "Build and Qualify a VM-to-AI Contract"}
      - {id: prove, path: /www/virtualization-ai-201/main/05-prove.html, marker: "Prove the healthy path"}
      - {id: break, path: /www/virtualization-ai-201/main/06-break.html, marker: "Break it safely"}
      - {id: cleanup, path: /www/virtualization-ai-201/main/07-evidence-reclaim.html, marker: "Export evidence and clean learner artifacts"}
  seat_probe:
    argv: [bash, scripts/certify-virtualization-ai-seat.sh, virtualization-ai-201, "{namespace}", "{cluster_ref}"]
    timeout_seconds: 900
    result_format: json
    json_assertions:
      - {path: result, equals: GREEN-live-internal-seat}
      - {path: cluster_ref, equals: flightpath}
      - {path: provenance.source_revision, equals: 3c94600ca8808a55693e94d5a1f169efbadbedd1}
      - {path: runtime_images.presentation, equals: "ghcr.io/jkershawrh/virtualization-ai-201-presentation@sha256:2749e4ad44f3902f7507adaaaa8fadd509d1e625b33619530852bd9a01255069"}
      - {path: runtime_images.adapter, equals: "ghcr.io/jkershawrh/virtualization-ai-201-adapter@sha256:99f1ac6f65386013cb20d81e3dbc6099ffbb63cebfdc6fb1f1cdd50d96153a39"}
      - {path: readiness.vms_running, equals: 1}
      - {path: readiness.vmis_ready, equals: 1}
      - {path: readiness.presentation_http_status, equals: 200}
      - {path: readiness.adapter_health, equals: true}
      - {path: journey.outcome, equals: qualified}
      - {path: journey.source_state, equals: LIVE}
      - {path: journey.request_origin, equals: contract-author-vm}
      - {path: journey.model_participated, equals: true}
      - {path: journey.model, equals: granite-3.2-8b-tools}
      - {path: journey.hardware, equals: Intel Xeon}
      - {path: journey.human_authority_preserved, equals: true}
      - {path: operator_journey.console_url_present, equals: true}
      - {path: terminal_scope, contains: own_edit=yes}
      - {path: terminal_scope, contains: cross_namespace=DENIED}
      - {path: terminal_scope, contains: node_list=DENIED}
      - {path: contains_sensitive_values, equals: false}
  cleanup:
    resources: [namespaces, applications.argoproj.io, rolebindings.rbac.authorization.k8s.io, persistentvolumeclaims, persistentvolumes, routes.route.openshift.io, secrets]
  rubric:
    required_score: 100
    categories:
      - {id: contract_integrity, weight: 10, requires: [contract_valid, evidence_hashed]}
      - {id: placement_capacity, weight: 15, requires: [capacity_passed, single_cluster_assignment]}
      - {id: provisioning_readiness, weight: 20, requires: [all_seats_ready, ready_within_limit]}
      - {id: participant_function, weight: 25, requires: [showroom_pages_passed, seat_probes_passed]}
      - {id: authorization, weight: 15, requires: [namespace_isolation_passed, sensitive_values_absent]}
      - {id: cleanup, weight: 15, requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]}
