api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification

metadata:
  catalog_item_id: agentic-ai-601
  display_name: "Agentic AI 601 — Earn the Right to Act"

spec:
  state: destination-qualification
  execution_enabled: true
  prerequisite_catalog_items:
    - operate-agentic-blueprint
    - scale-agentic-blueprint
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies:
    - internal

  scale_profiles:
    - seats: 1
      required_consecutive_runs: 1
      probe_concurrency: 1
      maximum_ready_seconds: 900
      maximum_cleanup_seconds: 600

  execution_blockers:
    - Agentic AI 401 and 501 have exact one-seat destination evidence but remain draft pending their independent activation reviews.
    - The current 601 runtime is synthetic rehearsal and must not be represented as production execution authority.
    - Class-specific thresholds and human authority review remain unapproved.

  showroom:
    pages:
      - id: welcome
        path: /www/agentic-ai-601/index.html
        marker: "Agentic AI 601"
      - id: preflight
        path: /www/agentic-ai-601/00-preflight.html
        marker: "Preflight"
      - id: signal
        path: /www/agentic-ai-601/01-signal.html
        marker: "Signal"
      - id: decision
        path: /www/agentic-ai-601/02-decision.html
        marker: "Decision"
      - id: authority
        path: /www/agentic-ai-601/03-authority.html
        marker: "Authority"
      - id: bounded-action
        path: /www/agentic-ai-601/04-bounded-action.html
        marker: "Bounded action"
      - id: validate-rollback
        path: /www/agentic-ai-601/05-validate-rollback.html
        marker: "Validate and rollback"
      - id: learn-evaluate
        path: /www/agentic-ai-601/06-learn-evaluate.html
        marker: "Learn and evaluate"
      - id: close-handoff
        path: /www/agentic-ai-601/07-close-handoff.html
        marker: "Close and handoff"

  seat_probe:
    argv:
      - bash
      - scripts/certify-agentic-ai-601-seat.sh
      - "{namespace}"
      - "{cluster_ref}"
    timeout_seconds: 900
    result_format: json
    json_assertions:
      - path: result
        equals: GREEN-destination-rehearsal-seat
      - path: cluster_ref
        equals: flightpath
      - path: source_state
        equals: rehearsal
      - path: execution_authority_enabled
        equals: false
      - path: inference.required
        equals: false
      - path: inference.participated
        equals: false
      - path: rehearsal.target_state_mutated
        equals: false
      - path: provenance.source_revision
        equals: de4bc2ea057fce33967b2eb52790d57b77ff0832
      - path: runtime_images.presentation
        equals: "ghcr.io/jkershawrh/agentic-ai-601-presentation@sha256:9395648031e9e7d9b33985b550cb06133f1e11464f086a4dea34bbfd63ecadf1"
      - path: runtime_images.qualifier
        equals: "ghcr.io/jkershawrh/agentic-ai-601-qualifier@sha256:b95d3779c254a352028cdfb13aecffb229113ef78d2dba332aef19596ca0d732"
      - path: governed_loop.signal_observed
        equals: true
      - path: governed_loop.unapproved_action_denied
        equals: true
      - path: governed_loop.single_use_approval_enforced
        equals: true
      - path: governed_loop.idempotent_replay
        equals: true
      - path: governed_loop.rollback_and_demotion
        equals: true
      - path: governed_loop.emergency_stop_precedes_action
        equals: true
      - path: governed_loop.evidence_chain_valid
        equals: true
      - path: governed_loop.automated_promotion
        equals: false
      - path: governed_loop.human_review_required
        equals: true
      - path: terminal_scope
        contains: own_edit=yes
      - path: terminal_scope
        contains: cross_namespace=DENIED
      - path: terminal_scope
        contains: node_list=DENIED
      - path: contains_sensitive_values
        equals: false

  cleanup:
    resources:
      - namespaces
      - applications.argoproj.io
      - rolebindings.rbac.authorization.k8s.io
      - persistentvolumeclaims
      - persistentvolumes
      - routes.route.openshift.io
      - secrets

  rubric:
    required_score: 100
    categories:
      - id: contract_and_provenance
        weight: 15
        requires: [contract_valid, evidence_hashed]
      - id: provisioning_and_capacity
        weight: 20
        requires: [capacity_passed, single_cluster_assignment, all_seats_ready, ready_within_limit]
      - id: governed_rehearsal
        weight: 25
        requires: [showroom_pages_passed, seat_probes_passed]
      - id: isolation_and_authority
        weight: 20
        requires: [namespace_isolation_passed, sensitive_values_absent]
      - id: lifecycle
        weight: 20
        requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]
