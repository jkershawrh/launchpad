api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification

metadata:
  catalog_item_id: intel-xeon6-agent-201
  display_name: "Intel Xeon 6 201: Building an AI Agent"

spec:
  target_cluster: brutus
  kubeconfig_server: https://api.brutus.fm2aihpcsed.com:6443
  allowed_exposure_policies:
    - internal
    - public_code

  scale_profiles:
    - seats: 1
      required_consecutive_runs: 1
      probe_concurrency: 1
      maximum_ready_seconds: 900
      maximum_cleanup_seconds: 600
    - seats: 5
      required_consecutive_runs: 1
      probe_concurrency: 5
      maximum_ready_seconds: 1500
      maximum_cleanup_seconds: 900
    - seats: 25
      required_consecutive_runs: 3
      probe_concurrency: 10
      maximum_ready_seconds: 2700
      maximum_cleanup_seconds: 1200
    - seats: 30
      required_consecutive_runs: 3
      probe_concurrency: 10
      maximum_ready_seconds: 3300
      maximum_cleanup_seconds: 1500

  showroom:
    pages:
      - id: welcome
        path: /www/modules/index.html
        marker: "Building an AI Agent"
      - id: deploy-tools
        path: /www/modules/02-deploy-tools.html
        marker: "Deploy the MCP Tools"
      - id: wire-agent
        path: /www/modules/03-wire-agent.html
        marker: "Wire the Agent"
      - id: test-and-tune
        path: /www/modules/04-test-and-tune.html
        marker: "Make It Yours"

  seat_probe:
    argv:
      - bash
      - scripts/certify-agent-201-catalog-seat.sh
      - "{namespace}"
      - "{cluster_ref}"
    timeout_seconds: 900
    result_format: json
    json_assertions:
      - path: result
        equals: GREEN-live-internal-seat
      - path: cluster_ref
        equals: brutus
      - path: setup_passed
        equals: true
      - path: agent_journey.functional_agent
        equals: true
      - path: terminal_scope
        contains: own_edit=yes
      - path: terminal_scope
        contains: cross_namespace=DENIED
      - path: terminal_scope
        contains: node_list=DENIED
      - path: contains_sensitive_values
        equals: false

  cleanup:
    resources:
      - namespaces
      - applications.argoproj.io
      - rolebindings.rbac.authorization.k8s.io
      - persistentvolumeclaims
      - persistentvolumes
      - routes.route.openshift.io
      - secrets

  rubric:
    required_score: 100
    categories:
      - id: contract_integrity
        weight: 10
        requires:
          - contract_valid
          - evidence_hashed
      - id: placement_capacity
        weight: 15
        requires:
          - capacity_passed
          - single_cluster_assignment
      - id: provisioning_readiness
        weight: 20
        requires:
          - all_seats_ready
          - ready_within_limit
      - id: participant_function
        weight: 25
        requires:
          - showroom_pages_passed
          - seat_probes_passed
      - id: authorization
        weight: 15
        requires:
          - namespace_isolation_passed
          - sensitive_values_absent
      - id: cleanup
        weight: 15
        requires:
          - cleanup_completed
          - zero_residue_cleanup
          - model_keys_revoked
