api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification

metadata:
  catalog_item_id: intel-xeon6-agent-201
  display_name: "Intel Xeon 6 201: Building an AI Agent"

spec:
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies:
    - internal
    - public_code

  scale_profiles:
    - seats: 1
      required_consecutive_runs: 1
      probe_concurrency: 1
      maximum_ready_seconds: 900
      maximum_cleanup_seconds: 600

  showroom:
    pages:
      - id: welcome
        path: /www/modules/index.html
        marker: "Building an AI Agent"
      - id: deploy-tools
        path: /www/modules/02-deploy-tools.html
        marker: "Deploy the MCP Tools"
      - id: wire-agent
        path: /www/modules/03-wire-agent.html
        marker: "Wire the Agent"
      - id: test-and-tune
        path: /www/modules/04-test-and-tune.html
        marker: "Make It Yours"
      - id: prove-and-clean
        path: /www/modules/05-prove-and-clean.html
        marker: "Prove and Clean Up"

  seat_probe:
    argv:
      - bash
      - scripts/certify-agent-201-catalog-seat.sh
      - "{namespace}"
      - "{cluster_ref}"
    timeout_seconds: 900
    result_format: json
    json_assertions:
      - path: result
        equals: GREEN-live-internal-seat
      - path: cluster_ref
        equals: flightpath
      - path: setup_passed
        equals: true
      - path: agent_journey.functional_agent
        equals: true
      - path: intel_xeon_inference.configured_model
        equals: granite-3.2-8b-tools
      - path: intel_xeon_inference.model_participated
        equals: true
      - path: intel_xeon_inference.matches_configured_model
        equals: true
      - path: proof_export.tool_count
        equals: 3
      - path: proof_export.contains_sensitive_values
        equals: false
      - path: provenance.showroom_revision
        equals: 50d4c05fe7e10522e66519f7f533de0f239a1c4c
      - path: provenance.workload_revision
        equals: f484cb66c3dcddff323df8814f637dc92c73c179
      - path: runtime_images.solution_tools
        equals: "quay.io/redhat-gpte/triforce-solution-tools@sha256:856874dc984eeb05ec0aeadb6f49265a58687eed17e5a92bc769875d3df44850"
      - path: runtime_images.solution_agent
        equals: "ghcr.io/jkershawrh/triforce-solution-agent@sha256:fbe9c2dacb203346e89257aaf097a35bd0e741fe8ddbbc8fea72f4e547961e67"
      - path: runtime_images.solution_ui
        equals: "quay.io/redhat-gpte/triforce-solution-ui@sha256:9388d91c19e845b8dcee12ef9037e4b93afadea4df5e7912dbe0a6151b8605fb"
      - path: terminal_scope
        contains: own_edit=yes
      - path: terminal_scope
        contains: cross_namespace=DENIED
      - path: terminal_scope
        contains: node_list=DENIED
      - path: contains_sensitive_values
        equals: false

  cleanup:
    resources:
      - namespaces
      - applications.argoproj.io
      - rolebindings.rbac.authorization.k8s.io
      - persistentvolumeclaims
      - persistentvolumes
      - routes.route.openshift.io
      - secrets

  rubric:
    required_score: 100
    categories:
      - id: contract_integrity
        weight: 10
        requires:
          - contract_valid
          - evidence_hashed
      - id: placement_capacity
        weight: 15
        requires:
          - capacity_passed
          - single_cluster_assignment
      - id: provisioning_readiness
        weight: 20
        requires:
          - all_seats_ready
          - ready_within_limit
      - id: participant_function
        weight: 25
        requires:
          - showroom_pages_passed
          - seat_probes_passed
      - id: authorization
        weight: 15
        requires:
          - namespace_isolation_passed
          - sensitive_values_absent
      - id: cleanup
        weight: 15
        requires:
          - cleanup_completed
          - zero_residue_cleanup
          - model_keys_revoked
