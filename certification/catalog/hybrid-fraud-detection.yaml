api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification

metadata:
  catalog_item_id: hybrid-fraud-detection
  display_name: "Build Hybrid Fraud Detection on Intel Xeon"

spec:
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies: [internal]

  scale_profiles:
    - seats: 1
      required_consecutive_runs: 1
      probe_concurrency: 1
      maximum_ready_seconds: 900
      maximum_cleanup_seconds: 600
    - seats: 5
      required_consecutive_runs: 1
      probe_concurrency: 5
      maximum_ready_seconds: 1500
      maximum_cleanup_seconds: 900
  showroom:
    pages:
      - {id: welcome, path: /www/hybrid-fraud-detection/main/index.html, marker: "Hybrid Fraud Detection on Intel Xeon"}
      - {id: architecture, path: /www/hybrid-fraud-detection/main/01-hybrid-scoring.html, marker: "Understand the Hybrid Architecture"}
      - {id: conditional-inference, path: /www/hybrid-fraud-detection/main/03-conditional-inference.html, marker: "Route Ambiguous Cases"}
      - {id: governance, path: /www/hybrid-fraud-detection/main/05-challenge-and-govern.html, marker: "Challenge and Govern"}

  seat_probe:
    argv: [bash, scripts/certify-hybrid-fraud-seat.sh, "{namespace}", "{cluster_ref}"]
    timeout_seconds: 600
    result_format: json
    json_assertions:
      - {path: result, equals: GREEN-live-internal-seat}
      - {path: cluster_ref, equals: flightpath}
      - {path: readiness.health, equals: true}
      - {path: readiness.model_ready, equals: true}
      - {path: readiness.workspace_http_status, equals: 200}
      - {path: hybrid_journey.live_model, equals: true}
      - {path: hybrid_journey.bounded_input, equals: true}
      - {path: terminal_scope, contains: own_edit=yes}
      - {path: terminal_scope, contains: cross_namespace=DENIED}
      - {path: terminal_scope, contains: node_list=DENIED}
      - {path: contains_sensitive_values, equals: false}

  cleanup:
    resources:
      - namespaces
      - applications.argoproj.io
      - rolebindings.rbac.authorization.k8s.io
      - persistentvolumeclaims
      - persistentvolumes
      - routes.route.openshift.io
      - secrets

  rubric:
    required_score: 100
    categories:
      - {id: contract_integrity, weight: 10, requires: [contract_valid, evidence_hashed]}
      - {id: placement_capacity, weight: 15, requires: [capacity_passed, single_cluster_assignment]}
      - {id: provisioning_readiness, weight: 20, requires: [all_seats_ready, ready_within_limit]}
      - {id: participant_function, weight: 25, requires: [showroom_pages_passed, seat_probes_passed]}
      - {id: authorization, weight: 15, requires: [namespace_isolation_passed, sensitive_values_absent]}
      - {id: cleanup, weight: 15, requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]}
