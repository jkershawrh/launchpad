api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification
metadata:
  catalog_item_id: sovereign-ai-301
  display_name: "Sovereign AI 301 — Confidential Inference and Intel TDX Foundations"
spec:
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies: [internal]
  scale_profiles:
    - {seats: 1, required_consecutive_runs: 1, probe_concurrency: 1, maximum_ready_seconds: 900, maximum_cleanup_seconds: 600}
  showroom:
    pages:
      - {id: welcome, path: /www/sovereign-ai-301/main/index.html, marker: "Northstar Claims: build the confidential-inference trust chain"}
      - {id: challenge, path: /www/sovereign-ai-301/main/02-challenge.html, marker: "Challenge and evidence"}
      - {id: appraisal, path: /www/sovereign-ai-301/main/03-appraise.html, marker: "Appraise measured identity"}
      - {id: refusal, path: /www/sovereign-ai-301/main/05-failures.html, marker: "Refuse unsafe states"}
  seat_probe:
    argv: [bash, scripts/certify-sovereign-ai-301-seat.sh, "{namespace}", "{cluster_ref}"]
    timeout_seconds: 600
    result_format: json
    json_assertions:
      - {path: result, equals: GREEN-live-internal-seat}
      - {path: cluster_ref, equals: flightpath}
      - {path: readiness.qualifier_health, equals: true}
      - {path: readiness.presentation_http_status, equals: 200}
      - {path: journey.mode, equals: REHEARSAL}
      - {path: journey.live_tdx_observed, equals: false}
      - {path: journey.allow_path, equals: ALLOW_SYNTHETIC_RELEASE}
      - {path: journey.deny_path, equals: DENY_MEASUREMENT}
      - {path: journey.synthetic_receipt_only, equals: true}
      - {path: journey.key_material_released, equals: false}
      - {path: journey.model_invoked, equals: false}
      - {path: journey.confidential_runtime_enabled, equals: false}
      - {path: journey.hardware_quote_verified, equals: false}
      - {path: journey.trustee_verified, equals: false}
      - {path: journey.inference_authorized, equals: false}
      - {path: journey.human_authority_retained, equals: true}
      - {path: terminal_scope, contains: own_edit=yes}
      - {path: terminal_scope, contains: cross_namespace=DENIED}
      - {path: terminal_scope, contains: node_list=DENIED}
      - {path: contains_sensitive_values, equals: false}
  cleanup:
    resources: [namespaces, applications.argoproj.io, rolebindings.rbac.authorization.k8s.io, persistentvolumeclaims, persistentvolumes, routes.route.openshift.io, secrets]
  rubric:
    required_score: 100
    categories:
      - {id: contract_integrity, weight: 10, requires: [contract_valid, evidence_hashed]}
      - {id: placement_capacity, weight: 15, requires: [capacity_passed, single_cluster_assignment]}
      - {id: provisioning_readiness, weight: 20, requires: [all_seats_ready, ready_within_limit]}
      - {id: participant_function, weight: 25, requires: [showroom_pages_passed, seat_probes_passed]}
      - {id: authorization, weight: 15, requires: [namespace_isolation_passed, sensitive_values_absent]}
      - {id: cleanup, weight: 15, requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]}
