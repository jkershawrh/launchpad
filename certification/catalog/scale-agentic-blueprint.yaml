api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification

metadata:
  catalog_item_id: scale-agentic-blueprint
  display_name: "Scale and Certify Agentic Systems"

spec:
  state: destination-qualification
  execution_enabled: true
  prerequisite_catalog_item: operate-agentic-blueprint
  governing_contract: contracts/catalog-scale-delivery-certification-v1.yaml
  learner_workload_charter: certification/workload/scale-agentic-blueprint.yaml
  target_cluster: flightpath
  kubeconfig_server: https://api.flightpath.fm2aihpcsed.com:6443
  allowed_exposure_policies:
    - internal

  scale_profiles:
    - seats: 1
      required_consecutive_runs: 1
      probe_concurrency: 1
      maximum_ready_seconds: 900
      maximum_cleanup_seconds: 600

  execution_blockers:
    - The destination run proves rehearsal-mode deployment only and must not be represented as live inference certification.
    - Approved OpenTelemetry and Intel Xeon telemetry are not connected.
    - Live dependency fault injection and recovery assertions remain unverified on Flightpath.

  showroom:
    pages:
      - id: welcome
        path: /www/agentic-scale-501/index.html
        marker: "Agentic AI 501"
      - id: baseline
        path: /www/agentic-scale-501/02-baseline.html
        marker: "Baseline: establish the reference state"
      - id: controlled-pressure
        path: /www/agentic-scale-501/04-controlled-pressure.html
        marker: "Controlled pressure: cross one named boundary"
      - id: score-review
        path: /www/agentic-scale-501/06-score-review.html
        marker: "Score and review: fail closed"
      - id: close-handoff
        path: /www/agentic-scale-501/07-close-handoff.html
        marker: "Close and handoff: certify the envelope"

  seat_probe:
    argv:
      - bash
      - scripts/certify-scale-agentic-blueprint-seat.sh
      - "{namespace}"
      - "{cluster_ref}"
    timeout_seconds: 900
    result_format: json
    json_assertions:
      - path: result
        equals: GREEN-destination-rehearsal-seat
      - path: cluster_ref
        equals: flightpath
      - path: evidence_source
        equals: rehearsal
      - path: live_claim
        equals: false
      - path: provenance.source_revision
        equals: 173f019da79d0d55431457ff24ed3e7253d98b23
      - path: runtime_images.presentation
        equals: "ghcr.io/jkershawrh/agentic-scale-501-presentation@sha256:c69aa83eafde91e67544d79f804ab3849a0402522277cbb21a72bc649866a1cb"
      - path: runtime_images.qualifier
        equals: "ghcr.io/jkershawrh/agentic-scale-501-qualifier@sha256:e33dd9066e36d01e0b90143d7752004c15128b21f42b5f4c1aac465b9a5be7a0"
      - path: inference.synthetic
        equals: true
      - path: inference.model_participated
        equals: false
      - path: qualification.attempted_journeys
        equals: 3
      - path: qualification.completed_journeys
        equals: 3
      - path: qualification.correlation_complete
        equals: 3
      - path: qualification.automated_promotion
        equals: false
      - path: qualification.human_review_required
        equals: true
      - path: terminal_scope
        contains: own_edit=yes
      - path: terminal_scope
        contains: cross_namespace=DENIED
      - path: terminal_scope
        contains: node_list=DENIED
      - path: operator_journey.terminal_scope_verified
        equals: true
      - path: operator_journey.console_url_present
        equals: true
      - path: operator_journey.qualification_service_verified
        equals: true
      - path: presentation_restarts
        equals: 0
      - path: contains_sensitive_values
        equals: false

  cleanup:
    resources:
      - namespaces
      - applications.argoproj.io
      - rolebindings.rbac.authorization.k8s.io
      - persistentvolumeclaims
      - persistentvolumes
      - routes.route.openshift.io
      - secrets

  rubric:
    required_score: 100
    categories:
      - id: contract_and_provenance
        weight: 15
        requires: [contract_valid, evidence_hashed]
      - id: provisioning_and_capacity
        weight: 25
        requires: [capacity_passed, single_cluster_assignment, all_seats_ready, ready_within_limit]
      - id: participant_rehearsal
        weight: 25
        requires: [showroom_pages_passed, seat_probes_passed]
      - id: isolation_and_access
        weight: 15
        requires: [namespace_isolation_passed, sensitive_values_absent]
      - id: lifecycle
        weight: 20
        requires: [cleanup_completed, zero_residue_cleanup, model_keys_revoked]
