api_version: launchpad.redhat.com/v1alpha1
kind: CatalogCertification

metadata:
  catalog_item_id: scale-agentic-blueprint
  display_name: "Scale and Certify Agentic Systems"

spec:
  state: charter
  execution_enabled: false
  prerequisite_catalog_item: operate-agentic-blueprint
  governing_contract: contracts/catalog-scale-delivery-certification-v1.yaml
  learner_workload_charter: certification/workload/scale-agentic-blueprint.yaml
  target_cluster: null
  allowed_exposure_policies:
    - internal

  scale_profiles:
    - seats: 1
      required_consecutive_runs: 3
    - seats: 5
      required_consecutive_runs: 3
    - seats: 25
      required_consecutive_runs: 3

  execution_blockers:
    - The 401 prerequisite is not yet certified.
    - No immutable 501 content or workload artifact exists.
    - The workload planner and evaluation set exist, but no reviewed live execution adapter is implemented.
    - Approved OpenTelemetry and Intel Xeon telemetry are not connected.
    - Fault injection boundaries and automated recovery assertions are not implemented.

  rubric:
    required_score: 100
    categories:
      - id: contract_and_provenance
        weight: 15
        requires: [contract_valid, immutable_artifacts, evidence_hashed]
      - id: provisioning_and_capacity
        weight: 25
        requires: [all_seats_ready, ready_within_limit, capacity_admitted]
      - id: participant_probe
        weight: 20
        requires: [representative_probe_passed_per_seat, routes_ready, model_access_ready]
      - id: isolation_and_access
        weight: 15
        requires: [namespace_isolation_passed, cross_namespace_denied, secrets_absent]
      - id: delivery_observability
        weight: 10
        requires: [seat_correlation_complete, provisioning_metrics_complete, reclaim_metrics_complete]
      - id: lifecycle
        weight: 15
        requires: [cleanup_within_limit, zero_residue_cleanup, model_keys_revoked]
