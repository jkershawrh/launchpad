schema_version: launchpad.redhat.com/v1alpha1
kind: ConvergenceMatrix
metadata:
  name: launchpad-product-convergence
  version: 1.0.0
proof_methods: [tdd, edd, cdd, bdd, cbt]
required_proof_dimensions: [usability, security, capacity, performance, operability, data_governance, fault_recovery, cleanup]
release_required_dimensions: [product_value, commercial_readiness, service_ownership, organizational_readiness, legal_compliance]
conditional_release_dimensions:
  oss_distribution: [public_private_boundary, legal_license, community_governance, enterprise_compatibility]
promotion_gates:
- stage: green-local
  required_evidence: Unit, component, schema, policy, rendered-manifest, and usable-journey fixture results.
- stage: green-integration
  required_evidence: Producer-consumer contracts and complete isolated participant, instructor, requester, and operator journeys.
- stage: green-canary
  required_evidence: One real seat per catalog completes discover, order, claim, learn, execute, resume, restart, and reclaim.
- stage: green-staging
  required_evidence: Production-shaped 1, 5, and 25 or 30 seat usable journeys plus load, spike, stress, soak, security, recovery-under-load, upgrade, restore, and rollback.
- stage: green-production-limited
  required_evidence: Approved audience, usability acceptance, public access, support ownership, secondary-owner coverage, SLOs and error budgets, data and AI governance, limited GTM packaging, and prior-plane fallback.
- stage: green-production
  required_evidence: Three consecutive full-journey certifications, zero critical or high findings, migration, failover, rollback, successful non-author continuity drill, SRE acceptance, governance acceptance, commercial readiness, customer-success ownership, and user and owner acceptance.
scenario_defaults: &scenario_defaults
  state: red
  methods: {tdd: red, edd: red, cdd: red, bdd: red, cbt: red}
  proof_dimensions: [functional, usability, security, capacity, performance, operability, data_governance, fault_recovery, cleanup, observability]
  evidence: []
scenarios:
- <<: *scenario_defaults
  id: intake-to-certified-draft
  owner: automated-lab-intake
  participating_streams: [automated-lab-intake, artifact-supply-chain, lab-content-ai]
  contracts: [catalog-package-v1, artifact-policy-v1]
  outcome: An immutable quickstart revision becomes a reviewed certified draft without a bespoke platform edit.
- <<: *scenario_defaults
  id: signed-artifact-cold-pull
  owner: artifact-supply-chain
  participating_streams: [artifact-supply-chain, capacity-admission, control-plane-portability]
  contracts: [artifact-policy-v1, cluster-profile-v1]
  outcome: Every required digest is trusted and cold-pulls after cache loss on each eligible worker pool.
- <<: *scenario_defaults
  id: event-demand-calculation
  owner: event-orchestration
  participating_streams: [event-orchestration, capacity-admission]
  contracts: [event-manifest-v1, cluster-profile-v1]
  outcome: Cohorts, labs per participant, retention, and waves produce the correct seat-environment demand.
- <<: *scenario_defaults
  id: deterministic-capacity-admission
  owner: capacity-admission
  participating_streams: [capacity-admission, event-orchestration, artifact-supply-chain]
  contracts: [event-manifest-v1, cluster-profile-v1, artifact-policy-v1]
  outcome: Insufficient cluster, model, route, storage, or artifact capacity rejects the order before seat creation.
- <<: *scenario_defaults
  id: governed-ai-gateway-and-provider-failover
  owner: ai-control-plane-gateway
  participating_streams: [ai-control-plane-gateway, capacity-admission, security-identity, observability-finops, lab-content-ai]
  contracts: [ai-control-plane-gateway-v1, cluster-profile-v1, admin-observability-v1, data-ai-governance-v1]
  outcome: Labs consume one attributed gateway contract while deterministic policy governs eligibility, quota, routing, fallback, provider loss, credential rotation, and cross-tenant denial across replaceable serving providers.
- <<: *scenario_defaults
  id: participant-public-claim-and-resume
  owner: participant-experience
  participating_streams: [participant-experience, security-identity, event-orchestration]
  contracts: [public-access-v2, event-manifest-v1]
  outcome: A participant claims, opens, resumes, adds, and logs out without losing unrelated entitlements.
- <<: *scenario_defaults
  id: namespace-and-seat-isolation
  owner: security-identity
  participating_streams: [security-identity, participant-experience]
  contracts: [public-access-v2]
  outcome: A participant can edit only assigned namespaces and cannot cross seat, tenant, or control-plane boundaries.
- <<: *scenario_defaults
  id: control-plane-clean-install-and-restore
  owner: control-plane-portability
  participating_streams: [control-plane-portability, artifact-supply-chain, security-identity, ha-dr-fleet]
  contracts: [control-plane-recovery-v1, artifact-policy-v1, public-access-v2, cluster-profile-v1]
  outcome: An empty target restores authoritative state and reconnects execution clusters without manual reconstruction.
- <<: *scenario_defaults
  id: fenced-failover-and-failback
  owner: ha-dr-fleet
  participating_streams: [ha-dr-fleet, control-plane-portability, capacity-admission]
  contracts: [control-plane-recovery-v1, cluster-profile-v1]
  outcome: Timed failover and failback meet RPO and RTO without split brain or retargeted cleanup.
- <<: *scenario_defaults
  id: complete-operational-telemetry
  owner: observability-finops
  participating_streams: [observability-finops, event-orchestration, capacity-admission, governed-integrations]
  contracts: [admin-observability-v1, lifecycle-evidence-v1, event-manifest-v1]
  outcome: Seat, workshop, cluster, model, support, and cost views reconcile to durable source events.
- <<: *scenario_defaults
  id: evidence-consumer-outage
  owner: governed-integrations
  participating_streams: [governed-integrations, observability-finops]
  contracts: [lifecycle-evidence-v1, admin-observability-v1]
  outcome: StarGate or another consumer can fail and recover without blocking or losing accepted lifecycle evidence.
- <<: *scenario_defaults
  id: governed-recommendation-boundary
  owner: governed-integrations
  participating_streams: [governed-integrations, security-identity, capacity-admission]
  contracts: [lifecycle-evidence-v1, admin-observability-v1, cluster-profile-v1]
  outcome: DeepField signals and GeoLux or GCL recommendations cannot bypass Launchpad policy or approval authority.
- <<: *scenario_defaults
  id: production-load-spike-and-soak
  owner: convergence-release
  participating_streams: [convergence-release, event-orchestration, capacity-admission, participant-experience, observability-finops, lab-content-ai]
  contracts: [production-readiness-v1, event-manifest-v1, cluster-profile-v1, sre-operating-model-v1]
  outcome: Baseline, load, spike, stress, endurance, and soak profiles meet versioned user-journey, model, capacity, latency, error, and cleanup thresholds.
- <<: *scenario_defaults
  id: recovery-under-active-load
  owner: ha-dr-fleet
  participating_streams: [ha-dr-fleet, control-plane-portability, capacity-admission, observability-finops, convergence-release]
  contracts: [production-readiness-v1, control-plane-recovery-v1, cluster-profile-v1, sre-operating-model-v1]
  outcome: Worker, replica, network, dependency, and control-plane failures recover within SLO while active sessions retain target identity and accepted lifecycle work.
- <<: *scenario_defaults
  id: in-flight-upgrade-migration-and-rollback
  owner: control-plane-portability
  participating_streams: [control-plane-portability, security-identity, ha-dr-fleet, participant-experience, convergence-release]
  contracts: [production-readiness-v1, control-plane-recovery-v1, public-access-v2, data-ai-governance-v1]
  outcome: Rolling release and schema migration preserve active journeys and data integrity, with backward compatibility and tested rollback.
- <<: *scenario_defaults
  id: synthetic-to-incident-resolution
  owner: observability-finops
  participating_streams: [observability-finops, participant-experience, ha-dr-fleet, governed-integrations]
  contracts: [sre-operating-model-v1, admin-observability-v1, lifecycle-evidence-v1]
  outcome: A participant-facing synthetic failure produces the correct SLI impact, alert, owner, runbook, communication, recovery, and incident evidence.
- <<: *scenario_defaults
  id: privacy-retention-and-deletion
  owner: security-identity
  participating_streams: [security-identity, observability-finops, product-gtm-customer-success]
  contracts: [data-ai-governance-v1, public-access-v2, admin-observability-v1, gtm-value-attribution-v1]
  outcome: Purpose, consent, access, retention, deletion, and pseudonymization controls are proven without losing required operational evidence.
- <<: *scenario_defaults
  id: model-quality-safety-and-drift
  owner: security-identity
  participating_streams: [security-identity, lab-content-ai, governed-integrations, observability-finops]
  contracts: [data-ai-governance-v1, lifecycle-evidence-v1, admin-observability-v1]
  outcome: Approved model and prompt releases pass quality, safety, prompt-injection, tool-abuse, drift, deprecation, and rollback gates.
- <<: *scenario_defaults
  id: consented-gtm-value-attribution
  owner: product-gtm-customer-success
  participating_streams: [product-gtm-customer-success, event-orchestration, observability-finops, security-identity, lab-content-ai]
  contracts: [gtm-value-attribution-v1, data-ai-governance-v1, event-manifest-v1, lifecycle-evidence-v1]
  release_dimensions: [product_value, commercial_readiness, service_ownership, legal_compliance]
  outcome: Privacy-safe activity, completion, repeat engagement, solution demand, follow-up, and accepted opportunity influence reconcile without inferring unsupported revenue.
- <<: *scenario_defaults
  id: non-author-platform-continuity
  owner: organizational-readiness
  participating_streams: [organizational-readiness, control-plane-portability, ha-dr-fleet, observability-finops, security-identity]
  contracts: [organizational-readiness-v1, production-readiness-v1, sre-operating-model-v1, control-plane-recovery-v1]
  release_dimensions: [service_ownership, organizational_readiness]
  outcome: A qualified person other than the primary author independently bootstraps, operates, diagnoses, upgrades, restores, and reclaims the platform within service objectives.
- <<: *scenario_defaults
  id: governed-knowledge-assistant
  owner: organizational-readiness
  participating_streams: [organizational-readiness, security-identity, governed-integrations, observability-finops]
  contracts: [organizational-readiness-v1, data-ai-governance-v1, sre-operating-model-v1]
  release_dimensions: [service_ownership, organizational_readiness, legal_compliance]
  outcome: The knowledge assistant answers evaluated onboarding and support questions with current citations and role-based access, abstains when unsupported, and never becomes mutation authority.
- <<: *scenario_defaults
  id: oss-clean-checkout-build-and-review
  owner: artifact-supply-chain
  participating_streams: [artifact-supply-chain, security-identity, automated-lab-intake, lab-content-ai, organizational-readiness]
  contracts: [oss-distribution-v1, artifact-policy-v1, data-ai-governance-v1, production-readiness-v1]
  conditional_profile: oss_distribution
  conditional_dimensions: [public_private_boundary, legal_license, community_governance, enterprise_compatibility]
  outcome: A clean public checkout contains no secret, confidential, restricted-brand, or incompatible-license content and reproducibly builds, tests, documents, and runs a neutral reference environment.
- <<: *scenario_defaults
  id: oss-enterprise-compatibility
  owner: artifact-supply-chain
  participating_streams: [artifact-supply-chain, convergence-release, security-identity, product-gtm-customer-success]
  contracts: [oss-distribution-v1, production-readiness-v1, data-ai-governance-v1]
  conditional_profile: oss_distribution
  conditional_dimensions: [public_private_boundary, legal_license, community_governance, enterprise_compatibility]
  outcome: OSS and enterprise distributions share versioned APIs and extension points, pass compatibility and upgrade tests, and retain distinct support, branding, and configuration boundaries.
- <<: *scenario_defaults
  id: immutable-candidate-identity
  owner: convergence-release
  participating_streams: [convergence-release, automated-lab-intake, artifact-supply-chain, event-orchestration, capacity-admission, participant-experience, security-identity, ha-dr-fleet, control-plane-portability, observability-finops, governed-integrations, lab-content-ai]
  contracts: [convergence-candidate-v1, catalog-package-v1, artifact-policy-v1, production-readiness-v1]
  state: green-local
  methods: {tdd: green-local, edd: green-local, cdd: green-local, bdd: green-local, cbt: green-local}
  evidence: [evidence/runs/convergence/green-local-20260922.json]
  outcome: One immutable platform revision is bound to exact catalog source revisions, shared contracts, hashed evidence, named blockers, and approval-gated sequential promotion.
- <<: *scenario_defaults
  id: end-to-end-staged-release
  owner: convergence-release
  participating_streams: [automated-lab-intake, artifact-supply-chain, event-orchestration, capacity-admission, ai-control-plane-gateway, participant-experience, security-identity, ha-dr-fleet, control-plane-portability, observability-finops, governed-integrations, lab-content-ai, product-gtm-customer-success, organizational-readiness, convergence-release]
  contracts: [catalog-package-v1, artifact-policy-v1, event-manifest-v1, cluster-profile-v1, ai-control-plane-gateway-v1, public-access-v2, admin-observability-v1, lifecycle-evidence-v1, control-plane-recovery-v1, production-readiness-v1, convergence-candidate-v1, sre-operating-model-v1, data-ai-governance-v1, gtm-value-attribution-v1, organizational-readiness-v1]
  release_dimensions: [product_value, commercial_readiness, service_ownership, organizational_readiness, legal_compliance]
  outcome: One unchanged candidate advances only through earned gates and completes usability, scale, performance, operations, governance, commercial, failure, rollback, and zero-residue reclaim proof.
