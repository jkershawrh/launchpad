api_version: launchpad.redhat.com/v1alpha1
onboarding_contract: catalog-onboarding/hybrid-fraud-detection.yaml
catalog:
  catalog_item_id: hybrid-fraud-detection
  display_name: Hybrid Fraud Detection on Intel Xeon
  description: Repository-discovered onboarding draft for Hybrid Fraud Detection on
    Intel Xeon.
  category: guided_build
  version: 0.1.0
  status: draft
sources:
  showroom:
    repo_url: https://github.com/jkershawrh/hybrid-fraud-detection.git
    revision: 00f07a8265579efd77964b390d65368999a1523a
    playbook: site.yml
    start_path: showroom
  workload:
    repo_url: https://github.com/jkershawrh/hybrid-fraud-detection.git
    revision: 00f07a8265579efd77964b390d65368999a1523a
    deploy_path: chart
runtime:
  deployment_type: helm
  workload:
    helm_values:
      app:
        image: ghcr.io/jkershawrh/hybrid-fraud-detection@sha256:80ddeab0ffab077c64f3dbce7e90482fc02f3d32ea45cb755279f7dcdb5b10c0
      model:
        endpointFromSecret: true
    runtime_secret_name: fraud-model-runtime
    runtime_secret_value_path: model.existingSecret
    runtime_secret_sources:
      endpoint:
        source: model_endpoint
        model: granite-3.2-8b-tools
      name:
        source: requested_model
      api-key:
        source: maas_api_key
  required_capabilities:
  - openshift
  - showroom
  required_models:
  - granite-3.2-8b-tools
  seat_resources:
    cpu_millicores: 0
    memory_mib: 0
    pods: 0
    storage_gib: 0
  tabs:
  - id: terminal
    title: Terminal
  allowed_exposure_policies:
  - internal
certification:
  stage: repository-discovery
  max_workshop_seats: 1
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Replace zero resource placeholders with measured per-seat resource measurements.
  - Review required capabilities, models, participant tabs, routes, identity, and
    runtime Secret sources.
  - Complete source, one-seat, five-seat, and twenty-five-seat certification gates
    before activation.
  - Review every unparsed manifest; templating or invalid YAML prevents complete static
    discovery.
  - Quickstart quality profile has unresolved required checks; review quality.gate.blocking_findings.
  - 'Resolve Quickstart requirement with approved target evidence: model-endpoint-unresolved'
  - 'Resolve Quickstart requirement with approved target evidence: manifest-unparsed'
  - Prove that the target model gateway enforces the generated per-seat key; the
    direct internal Granite route used by the chart canary did not prove this.
  - Preserve the Launchpad-managed namespace label needed by Arena model ingress
    policy and prove seat-scoped access during a full lifecycle run.
quality:
  schema_version: launchpad.redhat.com/catalog-intake-quality/v1
  business_solution:
    status: review-required
    readme_present: true
    title: Build a hybrid fraud-scoring demo with explainable AI
    action_oriented_title: true
    required_sections_present: true
    missing_sections: []
    business_language_present: true
    human_review_required: true
  artifacts:
    validation_matrix:
      path: tests/validation_matrix.yaml
      status: present-valid
      entry_count: 7
    claim_registry:
      path: tests/claim_registry.yaml
      status: present-valid
      entry_count: 1
    benchmark_rubric:
      path: tests/benchmark_rubric.yaml
      status: present-valid
      entry_count: 5
    publication_test:
      path: tests/publication/test_readme.py
      status: present
    makefile:
      path: Makefile
      status: present
    ci_workflows:
      path: .github/workflows
      status: present
  showroom:
    page_count: 3
    hands_on_module_count: 1
    execute_block_count: 7
    see_section_count: 1
    verification_section_count: 1
    key_takeaway_count: 1
    thin_modules: []
  capacity_proposal:
    status: review-required
    inference_mode: remote-endpoint
    framework_signals:
    - gradio
    - openai
    - react
    declared_models: []
    explicit_resource_envelopes: 0
    measurement_required_before_placement: true
  requirement_review:
    status: blocked
    resolution_authority: human-and-cluster-evidence
    findings:
    - code: model-endpoint-unresolved
      evidence_count: 0
    - code: manifest-unparsed
      evidence_count: 4
    target_support_inferred: false
  security_summary:
    status: review-required
    mutable_image_count: 0
    cluster_scoped_resource_count: 0
    privileged_finding_count: 0
    secret_manifest_count: 0
    unparsed_manifest_count: 4
    secret_values_included: false
  portfolio_overlap:
    status: not-run
    reason: A pinned versioned portfolio inventory was not supplied.
    mutable_live_org_scan_allowed: false
  gate:
    status: blocked
    blocking_findings:
    - 'Unresolved Quickstart requirement: model-endpoint-unresolved'
    - 'Unresolved Quickstart requirement: manifest-unparsed'
  authority:
    mode: analysis-only
    may_modify_source: false
    may_publish_catalog: false
    may_provision: false
    may_certify: false
discovery:
  source: quickstart-repository
  inventory:
    cluster_scoped_resources: []
    cleanup_candidates:
