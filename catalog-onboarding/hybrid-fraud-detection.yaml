      api_version: v1
      kind: Pod
      name: '{{ .Release.Name }}-test-scorer'
      path: chart/templates/test-scorer.yaml
    containerfiles:
    - src/Containerfile
    external_render_dependencies: []
    images:
    - path: chart/templates/test-scorer.yaml
      reference: registry.access.redhat.com/ubi9/ubi-minimal@sha256:34880b64c07f28f64d95737f82f891516de9a3b43583f39970f7bf8e4cfa48b7
      source: manifest
    - path: src/Containerfile
      reference: registry.access.redhat.com/ubi9/python-311@sha256:a0bdb55576fc5b8d6704279307817828ef027e1065533ceba133fe9516003a6c
      source: containerfile
    manifest_resources:
