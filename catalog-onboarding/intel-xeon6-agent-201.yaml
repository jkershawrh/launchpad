api_version: launchpad.redhat.com/v1alpha1
onboarding_contract: catalog-onboarding/intel-xeon6-agent-201.yaml

catalog:
  catalog_item_id: intel-xeon6-agent-201
  display_name: "Intel AI 201: Build an AI Agent on Intel Xeon 6"
  description: >-
    Build and tune a namespace-isolated AI solution advisor with LangGraph,
    MCP tools, and shared Intel Xeon inference.
  category: guided_build
  version: "1.0.9-flightpath.1"
  status: active
  supported_branding:
    - redhat-intel-default
    - intel-internal

learning:
  learning_level: "201"
  learning_stage: Build
  experience_type: solution_build
  prerequisites:
    - intel-llm-cpu-serving
  recommended_next_items:
    - multi-agent-quickstart
    - network-operations-agent
  journey_role: core
  specialty_family: null
  branches_from: null
  returns_to: null
  shared_blueprint: red-hat-intel-agentic-v1
  solution_family: agentic_ai

sources:
  showroom:
    repo_url: "https://github.com/jkershawrh/intel-xeon6-ai-agent-201.git"
    revision: "b8475464e5f1447da67ccfc0673b9a8a3e4757d7"
    playbook: site.yml
    start_path: .
  workload:
    repo_url: "https://github.com/rhpds/triforce.git"
    revision: "c8dcf5bcef1f926aa5867bcc1b86b69ec33b988d"
    deploy_path: .

runtime:
  namespace_slug: intel-xeon6-agent-201
  workshop_cluster_ref: flightpath
  deployment_type: manifests
  deployment_scope: seat
  showroom_terminal_storage: false
  provisioner_refs:
    - openshift-provisioner
    - showroom
  validation_refs:
    - pod-ready
    - route-accessible
    - inference-health
  observability_profile: intel-agent-201
  default_hardware_profile: xeon-basic
  default_quota_profile: standard
  default_ttl: "4h"
  inference_endpoint: direct_vllm_candidate
  required_capabilities:
    - openshift
    - showroom
    - model_endpoint
  required_models:
    - granite-3.2-8b-tools
  allowed_exposure_policies:
    - internal
    - public_code
  workload:
    routes:
      workspace: app
  seat_resources:
    cpu_millicores: 415
    memory_mib: 912
    pods: 3
    storage_gib: 0
  workshop_provision_concurrency: 5
  workshop_node_spread: true
  workshop_node_min_ready_seconds: 900
  tabs:
    - id: terminal
      title: Terminal
      source: showroom.terminal
    - id: workspace
      title: Solution Architect
      source: workload.route.workspace
    - id: openshift-console
      title: OpenShift Console
      source: cluster.console_url

certification:
  stage: 1-seat-certified
  certified_seats: 1
  max_workshop_seats: 1
  proof_contract: certification/catalog/intel-xeon6-agent-201.yaml
  promotion_sequence:
    - 1
  activation_blockers: []
  production_blockers:
    - >-
      Mirror all participant workload images to a durable external registry
      before the production control plane is moved away from Arena.
