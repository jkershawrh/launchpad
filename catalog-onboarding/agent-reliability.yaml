runtime:
  deployment_type: helm
  namespace_slug: agent-reliability
  deployment_scope: seat
  inference_endpoint: litellm
  required_capabilities:
  - openshift
  - showroom
  - model_endpoint
  - openshift-ai
  - openshift-pipelines
  - openshift-gitops
  required_models:
  - granite-3.2-8b-tools
  seat_resources:
    cpu_millicores: 150
    memory_mib: 192
    pods: 3
    storage_gib: 0
  tabs:
