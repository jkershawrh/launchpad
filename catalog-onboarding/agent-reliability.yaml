catalog:
  catalog_item_id: agent-reliability
  display_name: 'Intel AI 301: Engineer Reliable Agentic Workflows'
  description: A 75-minute Red Hat and Intel guided build that teaches platform
    teams to contain prompt injection, deny unauthorized MCP tools, prove
    evidence-backed recommendations, and degrade safely when inference is unavailable.
  category: guided_build
  version: 0.1.0
  status: draft
learning:
  learning_level: "301"
  learning_stage: Engineer
  experience_type: reliability_engineering
  prerequisites:
  - intel-xeon6-agent-201
  recommended_next_items:
  - agentops-observability
sources:
