    title: Terminal
    source: showroom.terminal
  - id: workspace
    title: Reliability Advisor
    source: workload.route.workspace
  workload:
    gitops_ready: true
    release_name: agent-reliability
    runtime_secret_name: model-connection
    runtime_secret_value_path: model.existingSecret
    runtime_secret_sources:
      endpoint:
        source: model_endpoint
        model: granite-3.2-8b-tools
      model:
        source: requested_model
      api-key:
        source: maas_api_key
    helm_values:
      image:
        repository: quay.io/rh-ee-jkershaw/agent-reliability-quickstart
        digest: sha256:604331d4a050f47457e27c2191106aa3fa075d408514143cd9eac6da18dfc3fb
      route:
        enabled: true
        name: ar
      profile:
        labFailureInjection: true
    routes:
      workspace: ar
  allowed_exposure_policies:
  - internal
certification:
  stage: one-seat-candidate
  max_workshop_seats: 1
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Re-run the complete one-seat browser, inference, guardrail outage, and reclaim
    journey against source revision 9f1cb2e270d8a6d9e98e2c866f265868b5a4daef
    and image digest sha256:604331d4a050f47457e27c2191106aa3fa075d408514143cd9eac6da18dfc3fb.
  - Treat the documented prior 1/5/25-seat certification as historical evidence;
    do not transfer its green status to this corrected source and image.
  - Produce scan, SBOM, signature, and provenance evidence for the candidate image.
  - Prove that the selected Launchpad MaaS gateway enforces the generated per-seat
    key and that the model Secret is never exposed through Git values or participant access.
  - Prove strict fail-closed behavior while the RHOAI NeMo Guardrails service is
    unavailable, then prove recovery after restoration.
  - Prove idempotent reclaim, MaaS-key revocation, GitOps cleanup, namespace deletion,
    and zero residual resources for the exact candidate revision.
  - Re-certify five and twenty-five seats before increasing max_workshop_seats.
  - Resolve every repository discovery warning before activation.
  - Review every unparsed manifest; templating or invalid YAML prevents complete static
    discovery.
  - Quickstart quality profile has unresolved required checks; review quality.gate.blocking_findings.
  - 'Resolve Quickstart requirement with approved target evidence: model-endpoint-unresolved'
  - 'Resolve Quickstart requirement with approved target evidence: manifest-unparsed'
