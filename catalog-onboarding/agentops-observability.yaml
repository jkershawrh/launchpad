api_version: launchpad.redhat.com/v1alpha1
onboarding_contract: catalog-onboarding/agentops-observability.yaml

catalog:
  catalog_item_id: agentops-observability
  display_name: "Intel AI 401: AgentOps and Production Observability with Red Hat AI"
  description: >-
    Investigate a production-style multi-agent mortgage application through
    OpenShift metrics and logs, Grafana dashboards, MLflow tracing and
    evaluation, and Red Hat OpenShift AI pipelines on Intel infrastructure.
  category: guided_build
  version: "0.1.4"
  status: deprecated
  supported_branding:
    - redhat-intel-default
    - intel-internal

learning:
  learning_level: "401"
  learning_stage: Operate
  experience_type: production_operations
  prerequisites:
    - multi-agent-quickstart
  recommended_next_items: []
  journey_role: reference
  specialty_family: null
  branches_from: null
  returns_to: null
  shared_blueprint: null
  solution_family: operations_reliability
  certification_transfer: none
  replacement_catalog_item_id: operate-agentic-blueprint

sources:
  showroom:
    repo_url: "https://github.com/rhpds/launchpad.git"
    revision: "59563b0a77252e8b91077c30c23ab524a8402bce"
    playbook: site-agentops-observability.yml
    start_path: content-agentops-observability
  workload:
    repo_url: "https://github.com/rhpds/launchpad.git"
    revision: "8596c9e979c76562b5e1239eec2c96e15305568b"
    deploy_path: deploy/workloads/agentops-seat

references:
  upstream_showroom:
    repo_url: "https://github.com/rhpds/agentops-intel-showroom.git"
    revision: "f1881c61de55ebf5640c27e76469f4efe458edaf"
    path: content
  automation:
    repo_url: "https://github.com/rhpds/agentops-in-prod-automation.git"
    revision: "6ea100531ac869fa66abe69ae223d6b56dbce9a2"
    path: bootstrap
  application:
    repo_url: "https://github.com/rh-ai-quickstart/multi-agent-loan-origination.git"
    revision: "1e50e51c334c1b6ed854d81a3f28fd324792f481"
    path: deploy/helm/mortgage-ai

runtime:
  namespace_slug: agentops
  deployment_type: helm
  deployment_scope: seat
  showroom_terminal_storage: false
  provisioner_refs:
    - helm-workload
    - showroom
  validation_refs:
    - pod-ready
    - route-accessible
    - inference-health
    - agentops-journey
  observability_profile: agentops-full-stack
  default_hardware_profile: xeon-basic
  default_quota_profile: large
  default_ttl: "4h"
  inference_endpoint: litellm
  required_capabilities:
    - openshift
    - showroom
    - model_endpoint
    - embedding_endpoint
    - agentops_observability_stack
    - rhoai
    - mlflow
    - user_workload_monitoring
    - openshift_logging
    - data_science_pipelines
  required_models:
    - granite-3.2-8b-tools
  seat_resources:
    # CPU and memory retain the rounded envelope measured from Arena build 84.
    # The combined API/UI deployment reduces the measured 13-pod steady seat
    # topology to 12 while preserving separate services and participant routes.
    cpu_millicores: 2500
    memory_mib: 7168
    pods: 12
    storage_gib: 30
  transient_seat_resources:
    # RHOAI rollout and bootstrap Jobs can add four short-lived pods per seat.
    # Capacity reserves this burst only for the bounded provisioning wave.
    cpu_millicores: 0
    memory_mib: 0
    pods: 4
  # Spread seats across qualified stable workers when more than one is
  # available. The project node selector also constrains pods created later
  # by the OpenShift AI pipeline operator. Arena currently has one qualified
  # worker, so the five-seat gate used bounded two-seat provisioning waves.
  workshop_node_spread: true
  workshop_node_min_ready_seconds: 900
  workshop_node_headroom_pods: 10
  # Only workers that have passed this workload's live stability gate may
  # receive AgentOps seats. Arena currently labels gnr2; rhgnr1 remains
  # quarantined after repeated container-runtime outages.
  workshop_node_required_labels:
    launchpad.redhat.com/agentops-certified: "true"
  workshop_provision_concurrency: 2
  tabs:
    - id: openshift-console
      title: OpenShift Console
      source: cluster.console_url
    - id: terminal
      title: Terminal
      source: showroom.terminal
    - id: mlflow
      title: MLflow Console
      source: cluster.mlflow_url
    - id: mortgage-ai
      title: Mortgage AI App
      source: workload.route.ui
    - id: grafana
      title: Grafana
      source: workload.route.grafana
    - id: rhoai
      title: RHOAI Console
      source: cluster.rhoai_url
    - id: mlflow-docs
      title: MLflow Docs
      source: https://mlflow.org/docs/latest/genai/tracing/
    - id: rhoai-docs
      title: RHOAI Docs
      source: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/
  workload:
    source_kind: launchpad-seat-chart
    gitops_ready: true
    release_name: agentops
    identity_value_path: identity
    runtime_secret_name: agentops-runtime
    runtime_secret_value_path: runtime.existingSecret
    runtime_secret_sources:
      POSTGRES_DB: {value: mortgage-ai}
      POSTGRES_USER: {value: agentops}
      POSTGRES_PASSWORD: {source: generated_password, length: 32}
      LENDING_DB_PASSWORD: {source: generated_password, length: 32}
      COMPLIANCE_DB_PASSWORD: {source: generated_password, length: 32}
      MLPIPELINE_PASSWORD: {source: generated_password, length: 32}
      MIGRATION_DATABASE_URL:
        template: >-
          postgresql+asyncpg://{POSTGRES_USER}:{POSTGRES_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
      DATABASE_URL:
        template: >-
          postgresql+asyncpg://lending_app:{LENDING_DB_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
      COMPLIANCE_DATABASE_URL:
        template: >-
          postgresql+asyncpg://compliance_app:{COMPLIANCE_DB_PASSWORD}@mortgage-ai-db:5432/mortgage-ai
      DEBUG: {value: "false"}
      ALLOWED_HOSTS: {value: '["*"]'}
      COMPANY_NAME: {value: "Fed Aura Capital"}
      AGENT_NAME: {value: "Intel Xeon AgentOps"}
      AUTH_DISABLED: {value: "true"}
      S3_ACCESS_KEY: {source: generated_password, length: 24}
      S3_SECRET_KEY: {source: generated_password, length: 32}
      S3_ENDPOINT: {value: "http://minio-service:9000"}
      S3_BUCKET: {value: documents}
      S3_REGION: {value: us-east-1}
      UPLOAD_MAX_SIZE_MB: {value: "50"}
      LLM_API_KEY: {source: maas_api_key}
      LLM_BASE_URL: {source: maas_endpoint}
      LLM_MODEL: {source: requested_model}
      LLM_MODEL_FAST: {source: requested_model}
      LLM_MODEL_CAPABLE: {source: requested_model}
      EMBEDDING_MODEL: {value: nomic-embed-text-v1.5}
      EMBEDDING_PROVIDER: {value: openai_compatible}
      EMBEDDING_BASE_URL:
        source: model_endpoint
        model: nomic-embed-text-v1.5
      MLFLOW_TRACKING_URI:
        value: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow"
      MLFLOW_EXPERIMENT_NAME: {value: mortgage-ai}
      MLFLOW_WORKSPACE: {source: namespace}
      MLFLOW_TRACKING_AUTH: {value: kubernetes}
      MLFLOW_TRACKING_INSECURE_TLS: {value: "true"}
    helm_values:
      storageClass: launchpad-nfs-ephemeral
    ignore_differences:
      - group: ""
        kind: ConfigMap
        name: agentops-pipeline-service-ca
        jsonPointers:
          - /data
    routes:
      ui: app
      grafana: obs
    readiness:
      - group: datasciencepipelinesapplications.opendatahub.io
        version: v1
        plural: datasciencepipelinesapplications
        name: dspa
        condition_type: Ready
        expected_status: "True"
        timeout_seconds: 300

certification:
  stage: deprecated-reference
  max_workshop_seats: 5
  promotion_sequence:
    - 1
    - 5
  activation_blockers:
    - >-
      Do not order or recertify this deprecated reference. Use
      operate-agentic-blueprint for the maintained AI 401 operations journey.
      The retained one- and five-seat AgentOps receipts are historical evidence
      only and do not transfer certification to the replacement.
