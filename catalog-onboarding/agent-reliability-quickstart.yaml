api_version: launchpad.redhat.com/v1alpha1
onboarding_contract: catalog-onboarding/agent-reliability-quickstart.yaml
catalog:
  catalog_item_id: agent-reliability-quickstart
  display_name: 'When Agents Fail: Reliable Agentic AI on OpenShift'
  description: A 75-minute Red Hat and Intel guided build that teaches platform teams
    to contain prompt injection, deny unauthorized MCP tools, and degrade safely when
    CPU inference is unavailable.
  category: guided_build
  version: 0.1.0
  status: draft
sources:
  showroom:
    repo_url: https://github.com/jkershawrh/agent-reliability-quickstart.git
    revision: bab445e412c425ccec810b605944812fa5cd9e5a
    playbook: site.yml
    start_path: .
  workload:
    repo_url: https://github.com/jkershawrh/agent-reliability-quickstart.git
    revision: bab445e412c425ccec810b605944812fa5cd9e5a
    deploy_path: chart
runtime:
  deployment_type: helm
  required_capabilities:
  - openshift
  - showroom
  - model_endpoint
  - openshift-ai
  - openshift-pipelines
  - openshift-gitops
  required_models:
  - granite-3.2-8b-tools
  seat_resources:
    cpu_millicores: 150
    memory_mib: 192
    pods: 3
    storage_gib: 0
  tabs:
  - id: terminal
    title: Terminal
    source: showroom.terminal
  - id: workspace
    title: Reliability Advisor
    source: workload.route.workspace
  workload:
    gitops_ready: true
    runtime_secret_name: model-connection
    runtime_secret_sources:
      endpoint:
        source: model_endpoint
        model: granite-3.2-8b-tools
      model:
        source: requested_model
      api-key:
        source: maas_api_key
    runtime_secret_value_path: model.existingSecret
    helm_values:
      image:
        repository: quay.io/rh-ee-jkershaw/agent-reliability-quickstart
        digest: sha256:7aff969774fa4b3efac77de4525a046a9c36ce8609de77af20f1077ad17a79d1
      route:
        enabled: true
        name: ar
      profile:
        labFailureInjection: true
    routes:
      workspace: ar
  allowed_exposure_policies:
  - internal
certification:
  stage: twenty-five-seat-certified
  max_workshop_seats: 25
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Complete an integrated Flightpath seat qualification proving RHOAI-managed NeMo decisions,
    local fail-closed fallback, recovery, and reclaim with the pinned release.
quality:
  schema_version: launchpad.redhat.com/catalog-intake-quality/v1
  business_solution:
    status: review-required
    readme_present: true
    title: Build a Reliable Agentic AI Workflow on OpenShift
    action_oriented_title: true
    required_sections_present: false
    missing_sections:
    - architecture
    business_language_present: false
    human_review_required: true
  artifacts:
    validation_matrix:
      path: tests/validation_matrix.yaml
      status: invalid
      entry_count: 0
    claim_registry:
      path: tests/claim_registry.yaml
      status: present-valid
      entry_count: 4
    benchmark_rubric:
      path: tests/benchmark_rubric.yaml
      status: present-valid
      entry_count: 3
    publication_test:
      path: tests/publication/test_readme.py
      status: present
    makefile:
      path: Makefile
      status: present
    ci_workflows:
      path: .github/workflows
      status: present
  showroom:
    page_count: 7
    hands_on_module_count: 6
    execute_block_count: 0
    see_section_count: 0
    verification_section_count: 0
    key_takeaway_count: 0
    thin_modules:
    - modules/ROOT/pages/01-healthy-agent.adoc
    - modules/ROOT/pages/02-safety-architecture.adoc
    - modules/ROOT/pages/03-prompt-injection.adoc
    - modules/ROOT/pages/04-tool-authorization.adoc
    - modules/ROOT/pages/05-inference-disruption.adoc
    - modules/ROOT/pages/06-prove-recover.adoc
  capacity_proposal:
    status: review-required
    inference_mode: remote-endpoint
    framework_signals:
    - openai
    - vllm
    declared_models: []
    explicit_resource_envelopes: 2
    measurement_required_before_placement: true
  requirement_review:
    status: blocked
    resolution_authority: human-and-cluster-evidence
    findings:
    - code: model-endpoint-unresolved
      evidence_count: 0
    target_support_inferred: false
  security_summary:
    status: review-required
    mutable_image_count: 3
    cluster_scoped_resource_count: 0
    privileged_finding_count: 0
    secret_manifest_count: 0
    unparsed_manifest_count: 0
    secret_values_included: false
  portfolio_overlap:
    status: not-run
    reason: A pinned versioned portfolio inventory was not supplied.
    mutable_live_org_scan_allowed: false
  gate:
    status: blocked
    blocking_findings:
    - 'README is missing required sections: architecture'
    - tests/validation_matrix.yaml is missing or invalid
    - One or more Showroom modules lack the What you will learn section
    - One or more Showroom modules lack the See section
    - One or more Showroom modules lack the Verify section
    - One or more Showroom modules lack the Key takeaway section
    - One or more Showroom modules lack an executable command block
    - One or more Showroom modules are below the content-depth threshold
    - 'Unresolved Quickstart requirement: model-endpoint-unresolved'
  authority:
    mode: analysis-only
    may_modify_source: false
    may_publish_catalog: false
    may_provision: false
    may_certify: false
