api_version: launchpad.redhat.com/agentic-scale-evaluation-set/v1
evaluation_set_id: agentic-scale-balanced-v1
revision: "1.0.0"
blueprint_id: red-hat-intel-agentic-v1
description: Synthetic service incidents for deterministic scale and quality comparison.
domains: [availability, performance, deployment, security, data]
cases:
  - {id: S01, domain: availability, complexity: simple, prompt: "Report whether checkout-api is currently healthy.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [service_health], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S02, domain: performance, complexity: simple, prompt: "Report the current p95 latency for catalog-api.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [latency_metric], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S03, domain: deployment, complexity: simple, prompt: "Identify the active deployment revision for payments-api.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [deployment_revision], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S04, domain: security, complexity: simple, prompt: "Report whether the latest authentication check passed.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [authentication_status], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S05, domain: data, complexity: simple, prompt: "Report the current event-consumer lag.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [consumer_lag], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S06, domain: availability, complexity: simple, prompt: "List unavailable replicas for inventory-api.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [replica_status], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S07, domain: performance, complexity: simple, prompt: "Report the current request error rate for search-api.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [error_rate], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S08, domain: deployment, complexity: simple, prompt: "Report when orders-api last rolled out.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [rollout_timestamp], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S09, domain: security, complexity: simple, prompt: "List denied requests observed for gateway-api.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [denial_count], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
  - {id: S10, domain: data, complexity: simple, prompt: "Report whether the latest data freshness check passed.", expected_workflow: lightweight, required_agents: [executor], required_evidence: [freshness_status], expected_policy_result: allow_recommendation, expected_disposition: supported, human_review_required: true}
