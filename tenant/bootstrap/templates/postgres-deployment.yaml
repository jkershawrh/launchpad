{{- if .Values.demo.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ include "launchpad-demo.namespace" . }}
  labels:
    {{- include "launchpad-demo.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.demo.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ include "launchpad-demo.namespace" . }}
  labels:
    app: postgres
    {{- include "launchpad-demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        {{- include "launchpad-demo.labels" . | nindent 8 }}
    spec:
      containers:
      - name: postgres
        image: {{ .Values.demo.postgres.image }}
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          value: gateway
        - name: POSTGRESQL_PASSWORD
          value: gateway
        - name: POSTGRESQL_DATABASE
          value: gateway
        - name: PGDATA
          value: /var/lib/pgsql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
        resources:
          {{- toYaml .Values.demo.postgres.resources | nindent 10 }}
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "gateway"]
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: [ALL]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "launchpad-demo.namespace" . }}
  labels:
    app: postgres
    {{- include "launchpad-demo.labels" . | nindent 4 }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
{{- end }}
