apiVersion: v1
kind: Secret
metadata:
  name: gateway-config
  namespace: {{ include "launchpad-demo.namespace" . }}
  labels:
    {{- include "launchpad-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_API_BASE: {{ .Values.demo.gateway.litellmApiEndpoint | quote }}
  LITELLM_API_KEY: {{ .Values.demo.gateway.litellmVirtualKey | quote }}
  DEFAULT_MODEL: {{ .Values.demo.gateway.model | quote }}
  DATABASE_URL: "postgresql://gateway:gateway@postgres:5432/gateway"
