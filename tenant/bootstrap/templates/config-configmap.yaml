apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: {{ include "launchpad-demo.namespace" . }}
  labels:
    {{- include "launchpad-demo.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "pages": {{ .Values.demo.pages | splitList "," | toJson }},
      "gateway_url": "",
      "demo_name": {{ .Values.demo.name | quote }},
      "branding": {{ .Values.demo.branding | quote }}
    }
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;

        server {
            listen 8080;
            root /opt/app-root/src;
            index index.html;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;

            location / {
                try_files $uri $uri/ /index.html;
            }

            location /config.json {
                alias /etc/demo-config/config.json;
            }

            location /v1/ {
                proxy_pass http://gateway:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 300s;
                proxy_connect_timeout 5s;
            }

            location /api/ {
                proxy_pass http://gateway:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 300s;
            }

            location /health {
                proxy_pass http://gateway:8080;
            }
        }
    }
