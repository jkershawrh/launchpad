apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: demo
  namespace: {{ include "launchpad-demo.namespace" . }}
  labels:
    app: demo-frontend
    {{- include "launchpad-demo.labels" . | nindent 4 }}
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: demo-frontend
    weight: 100
  port:
    targetPort: http
