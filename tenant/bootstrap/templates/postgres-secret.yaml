{{- if .Values.demo.postgres.enabled }}
{{- $pgPassword := .Values.demo.postgres.password | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ include "launchpad-demo.namespace" . }}
  labels:
    app: postgres
    {{- include "launchpad-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRESQL_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://gateway:%s@postgres:5432/gateway" $pgPassword | quote }}
{{- end }}
