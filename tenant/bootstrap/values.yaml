tenant:
  name: ""
  user:
    name: ""
    password: ""

sessionId: ""
workshopId: ""
managedBy: "argocd"

demo:
  namespace: ""
  name: "Intel x Red Hat AI Platform"
  catalogItem: ""
  pages: "all"
  branding: "default"
  purpose: "self-service"
  persistence: "ephemeral"

  frontend:
    image: quay.io/rhpds/launchpad-demo-frontend:latest
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  gateway:
    image: quay.io/rhpds/launchpad-gateway:latest
    replicas: 1
    litellmApiEndpoint: ""
    litellmVirtualKey: ""
    model: "granite-3-2-8b-instruct"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  postgres:
    enabled: true
    image: registry.redhat.io/rhel9/postgresql-15:latest
    storage: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
