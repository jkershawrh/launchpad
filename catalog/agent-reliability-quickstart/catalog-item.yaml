catalog_item_id: agent-reliability-quickstart
display_name: 'When Agents Fail: Reliable Agentic AI on OpenShift'
description: A 75-minute Red Hat and Intel guided build that teaches platform teams
  to contain prompt injection, deny unauthorized MCP tools, and degrade safely when
  CPU inference is unavailable.
category: guided_build
version: 0.1.0
status: draft
required_capabilities:
- openshift
- showroom
- model_endpoint
- openshift-ai
- openshift-pipelines
- openshift-gitops
default_hardware_profile: xeon-basic
default_quota_profile: large
default_ttl: 4h
provisioner_refs:
- helm-workload
- showroom
validation_refs:
- pod-ready
- route-accessible
- inference-health
- agentops-journey
observability_profile: agentops-full-stack
supported_branding:
- redhat-intel-default
- intel-internal
metadata:
  showroom: true
  operator_workshop: true
  content_only: false
  onboarding_managed: true
  onboarding_contract: catalog-onboarding/agent-reliability-quickstart.yaml
  certification_stage: repository-discovery
  max_workshop_seats: 1
  promotion_sequence:
  - 1
  - 5
  - 25
  activation_blockers:
  - Replace zero resource placeholders with measured per-seat resource measurements.
  - Review required capabilities, models, participant tabs, routes, identity, and
    runtime Secret sources.
  - Complete source, one-seat, five-seat, and twenty-five-seat certification gates
    before activation.
  - Resolve every repository discovery warning before activation.
  - Review every mutable container image and replace it with an approved immutable
    digest.
  - Quickstart quality profile has unresolved required checks; review quality.gate.blocking_findings.
  - 'Resolve Quickstart requirement with approved target evidence: model-endpoint-unresolved'
  allowed_exposure_policies:
