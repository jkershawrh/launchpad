  required_proof:
    - End-to-end correlation from request through human review.
    - Measured p50 and p95 journey and inference latency under declared load.
    - Intel CPU allocation, saturation, token usage, and throughput from approved telemetry.
    - Backpressure, retry-budget, fail-closed, and recovery evidence.
    - Quality and policy-compliance comparison before and during scale.
    - One-seat certification with zero-residue reclaim for initial catalog activation.
  activation_blockers:
    - Complete trusted render and destination artifact qualification on Flightpath.
    - Replace rehearsal evidence with approved live execution and Intel Xeon telemetry before activation.
    - Complete one-seat certification with zero-residue reclaim before activation; five- and twenty-five-seat scale certification is deferred.
    - Complete three consecutive twenty-five-seat runs before any twenty-five-seat promotion.
    - Complete human authority review before promotion.
  production_blockers:
    - Use organization-owned digest-pinned images and content revisions.
    - Complete security, capacity, resilience, and operational-owner review.
  allowed_exposure_policies:
