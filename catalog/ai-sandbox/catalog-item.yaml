catalog_item_id: ai-sandbox
display_name: "OpenShift Developer Sandbox"
description: "A namespace-scoped OpenShift environment with the Red Hat web console, web terminal, browser IDE, and access to the Oberon model fleet."
category: open_sandbox
version: "1.0.0"
status: active
required_capabilities:
  - openshift
  - model_endpoint
default_hardware_profile: xeon-basic
default_quota_profile: standard
default_ttl: "8h"
provisioner_refs:
  - sandbox-provisioner
validation_refs:
  - pod-ready
supported_branding:
  - intel-internal
metadata:
  sandbox_type: openshift_dev
  stack_level: ai_dev
  access_methods:
    - openshift_console
    - web_terminal
    - vscode
  optional_capabilities:
    - openshift-ai
    - openshift-serverless
    - openshift-service-mesh
    - cluster-observability
    - openshift-gitops
    - intel-device-plugins
  required_models:
    - smollm2-360m
    - smollm3-3b
  inference_endpoint: litellm
