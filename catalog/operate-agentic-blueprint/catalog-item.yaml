  Operate the same Red Hat and Intel multi-agent blueprint built at level 301:
  correlate requests with agents, MCP evidence, deterministic policy, Intel
  Xeon inference, and human review; exercise safe denial and recovery; and
  prove a controlled configuration change on OpenShift.
