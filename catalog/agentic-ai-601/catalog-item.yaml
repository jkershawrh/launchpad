    - One-seat destination certification with zero-residue reclaim for initial catalog activation.
  activation_blockers:
    - Complete Agentic AI 401 activation review.
    - Complete Agentic AI 501 live destination certification and activation review.
    - Review the one-seat destination rehearsal evidence before catalog activation.
    - Replace synthetic rehearsal evidence with approved live evidence before any live authority claim.
    - Five- and twenty-five-seat scale certification is deferred.
    - Complete human authority review before promotion.
  production_blockers:
    - Production action adapters are intentionally not implemented.
    - Class-specific thresholds require independent human approval.
    - Organization-owned images and operational ownership are required for production.
