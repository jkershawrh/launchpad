identity:
  sessionId: ""
  workshopId: ""
  seatId: ""
  tenantId: ""
  clusterId: ""

runtime:
  existingSecret: ""

imagePullSecrets: []

image:
  repository: quay.io/rh-ee-jkershaw/launchpad-multi-agent-quickstart
  digest: ""
  pullPolicy: IfNotPresent

# Optional 401 operations presentation. It is deliberately disabled for the
# established 301 lab and must be enabled by a catalog item with an immutable
# digest. The mounted NGINX configuration keeps the browser on one origin and
# forwards /api to the seat-local orchestrator.
presentation:
  enabled: false
  image:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  apiUpstream: http://multi-agent:8000
  # Cluster-specific application domain used to construct the deterministic
  # per-seat Showroom Route. Required whenever the presentation is enabled.
  ingressDomain: ""
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 512Mi}

resources:
  orchestrator:
    requests: {cpu: 150m, memory: 192Mi}
    limits: {cpu: "1", memory: 512Mi}
  agent:
    requests: {cpu: 150m, memory: 160Mi}
    limits: {cpu: "1", memory: 384Mi}
  support:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}
  ui:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
