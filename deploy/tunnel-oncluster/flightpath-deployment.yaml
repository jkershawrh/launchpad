apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad-public-tunnel
  namespace: launchpad-flightpath-candidate
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
    app.kubernetes.io/part-of: partner-ai-launchpad
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: launchpad-flightpath-candidate
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
    app.kubernetes.io/part-of: partner-ai-launchpad
    app.kubernetes.io/managed-by: kustomize
    launchpad.redhat.com/environment: flightpath-candidate
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-tunnel
        app.kubernetes.io/part-of: partner-ai-launchpad
        app.kubernetes.io/managed-by: kustomize
        launchpad.redhat.com/environment: flightpath-candidate
    spec:
      serviceAccountName: launchpad-public-tunnel
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudflare-tunnel
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: router-script
          configMap: {name: tunnel-router}
        - name: cloudflared-home
          emptyDir: {}
      containers:
        - name: router
          image: ghcr.io/rhpds/launchpad-backend@sha256:a01b936642b04c998ec0549d34b89e62dfde80d34e14babbbf1beb145dea4e76
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          # The shared public origin carries the participant, Keycloak, and
          # OpenShift Console sessions.  WebSocket upgrades therefore need
          # more headroom than the HTTP parser default after a participant has
          # exercised the full lab journey.
          args: [router:app, --host, 0.0.0.0, --port, "8080", --app-dir, /opt/tunnel, --h11-max-incomplete-event-size, "262144"]
          env:
            - name: ACCESS_BROKER_KEY
              valueFrom:
                secretKeyRef: {name: launchpad-public-access, key: ACCESS_BROKER_KEY}
            - {name: BACKEND_URL, value: http://backend.launchpad-flightpath-candidate.svc:8000/api/v1}
            - {name: GATEWAY_ORIGIN, value: http://public-access-gateway.launchpad-flightpath-candidate.svc:8443}
            - {name: CONSOLE_ORIGIN, value: https://router-internal-default.openshift-ingress.svc:443}
            - {name: KEYCLOAK_ORIGIN, value: http://keycloak.launchpad-stage.svc:8080}
            - {name: KEYCLOAK_INT_ORIGIN, value: http://keycloak.launchpad-stage.svc:8080}
            - {name: OPENSHIFT_CONSOLE_HOST, value: console-openshift-console.apps.flightpath.fm2aihpcsed.com}
            - {name: OPENSHIFT_CONSOLE_UPSTREAM_HOST, value: labs.smg-helix.ai}
            - {name: OPENSHIFT_CONSOLE_CALLBACK_URL, value: https://labs.smg-helix.ai/auth/callback}
            - {name: OPENSHIFT_OAUTH_HOST, value: oauth-openshift.apps.flightpath.fm2aihpcsed.com}
            - {name: KEYCLOAK_PUBLIC_HOST, value: labs.smg-helix.ai}
            - {name: OPENSHIFT_INGRESS_DOMAIN, value: apps.flightpath.fm2aihpcsed.com}
            - {name: TUNNEL_UPSTREAM_READ_TIMEOUT, value: "330"}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - name: router-script
              mountPath: /opt/tunnel/router.py
              subPath: router.py
              readOnly: true
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:b7a6db450ae2e2f773d4fbe9ffb48e7b5fc451e17329daab1b4dda5a2487e2cc
          imagePullPolicy: IfNotPresent
          args: [tunnel, --no-autoupdate, --loglevel, info, --metrics, 0.0.0.0:2000, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: tunnel-token, key: token}
            - {name: HOME, value: /tmp}
          ports:
            - {name: metrics, containerPort: 2000}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: cloudflared-home, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflare-tunnel
  namespace: launchpad-flightpath-candidate
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel
