apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad-public-tunnel
  namespace: partner-ai-launchpad
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
    app.kubernetes.io/part-of: partner-ai-launchpad
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: partner-ai-launchpad
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/purpose: permanent-public-access-pilot
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Required anti-affinity plus two eligible workers needs one old pod to
      # leave before its replacement can occupy that worker. The PDB below
      # still guarantees that one connector remains available throughout.
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-tunnel
        app.kubernetes.io/part-of: partner-ai-launchpad
        launchpad.redhat.com/purpose: permanent-public-access-pilot
    spec:
      serviceAccountName: launchpad-public-tunnel
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          # A named-tunnel replica cannot protect against a worker failure when
          # both connectors share that worker. Arena has multiple schedulable
          # workers, so enforce one connector per node.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudflare-tunnel
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: router-script
          configMap: {name: tunnel-router}
        - name: cloudflared-home
          emptyDir: {}
      containers:
        - name: router
          image: image-registry.openshift-image-registry.svc:5000/partner-ai-launchpad/launchpad-backend@sha256:a71bcaea9cbec67e3bffdfe1de8c2236df57c5af4cf3bae242f4652beadb9f38
          # The pilot registry may be temporarily unreachable from a worker;
          # retain the pinned digest in the node cache across tunnel rollouts.
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [router:app, --host, 0.0.0.0, --port, "8080", --app-dir, /opt/tunnel]
          env:
            - name: ACCESS_BROKER_KEY
              valueFrom:
                secretKeyRef: {name: launchpad-public-access, key: ACCESS_BROKER_KEY}
            - name: BACKEND_URL
              value: http://backend.partner-ai-launchpad.svc:8000/api/v1
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - name: router-script
              mountPath: /opt/tunnel/router.py
              subPath: router.py
              readOnly: true
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:b7a6db450ae2e2f773d4fbe9ffb48e7b5fc451e17329daab1b4dda5a2487e2cc
          imagePullPolicy: Always
          args: [tunnel, --no-autoupdate, --loglevel, info, --metrics, 0.0.0.0:2000, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: tunnel-token, key: token}
            - name: HOME
              value: /tmp
          ports:
            - {name: metrics, containerPort: 2000}
          # /ready returns 200 only after this replica has an active Cloudflare
          # edge connection. Router health alone is insufficient for readiness.
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: cloudflared-home
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflare-tunnel
  namespace: partner-ai-launchpad
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel
