apiVersion: batch/v1
kind: Job
metadata:
  name: cache-granite-2b-cpu
  namespace: launchpad-model-candidate
  annotations:
    launchpad.redhat.com/release-eligible: "false"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: granite-2b-cpu-cache
        app.kubernetes.io/managed-by: launchpad
    spec:
      restartPolicy: Never
      securityContext:
        hostUsers: false
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-cache
          image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:cf6577f6d526561651df5390aad916c53820a18a1659e3fb39c1c5a62aef0e3c
          imagePullPolicy: IfNotPresent
          command:
            - python
          args:
            - -c
            - |
              from pathlib import Path
              from huggingface_hub import snapshot_download

              revision = "de37a2ed8ca9d5998813abd8e379b6a5d1aee87c"
              target = snapshot_download(
                  repo_id="ibm-granite/granite-3.2-2b-instruct",
                  revision=revision,
                  cache_dir="/models/hub",
              )
              required = ("config.json", "model.safetensors.index.json")
              missing = [name for name in required if not (Path(target) / name).is_file()]
              if missing:
                  raise SystemExit(f"model snapshot incomplete: {missing}")
              (Path("/models") / "granite-2b-cpu.ready").write_text(
                  revision + "\n", encoding="utf-8"
              )
              print(f"cached_revision={revision}")
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /models/hub
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: flightpath-model-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-granite-2b-cpu
  namespace: launchpad-model-candidate
  annotations:
    launchpad.redhat.com/release-eligible: "false"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-granite-2b-cpu
  template:
    metadata:
      labels:
        app: vllm-granite-2b-cpu
        app.kubernetes.io/name: vllm-granite-2b-cpu
        app.kubernetes.io/component: model-server
        app.kubernetes.io/managed-by: launchpad
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        hostUsers: false
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-server
          image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:cf6577f6d526561651df5390aad916c53820a18a1659e3fb39c1c5a62aef0e3c
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
          args:
            - /models/hub/models--ibm-granite--granite-3.2-2b-instruct/snapshots/de37a2ed8ca9d5998813abd8e379b6a5d1aee87c
            - --port=8080
            - --served-model-name=granite-2b-cpu
            - --enable-auto-tool-choice
            - --tool-call-parser=granite
            - --chat-template=/app/data/template/tool_chat_template_granite.jinja
            - --block-size=128
            - --dtype=bfloat16
            - --max-model-len=4096
            - --max-num-batched-tokens=4096
            - --max-num-seqs=32
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf_home
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"
            - name: VLLM_RPC_TIMEOUT
              value: "300000"
            - name: LD_PRELOAD
              value: /usr/lib64/libomp.so
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "32"
              memory: 24Gi
            limits:
              cpu: "32"
              memory: 24Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: chat-template
              mountPath: /app/data/template/tool_chat_template_granite.jinja
              subPath: tool_chat_template_granite.jinja
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: flightpath-model-cache
            readOnly: true
        - name: chat-template
          configMap:
            name: granite-3-2-tool-chat-template
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-granite-2b-cpu
  namespace: launchpad-model-candidate
spec:
  type: ClusterIP
  selector:
    app: vllm-granite-2b-cpu
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-launchpad-to-granite-2b
  namespace: launchpad-model-candidate
spec:
  podSelector:
    matchLabels:
      app: vllm-granite-2b-cpu
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: launchpad-flightpath-candidate
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: launchpad
      ports:
        - protocol: TCP
          port: 8080
