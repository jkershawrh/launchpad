apiVersion: v1
kind: ConfigMap
metadata:
  name: granite-3-2-tool-chat-template
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/managed-by: launchpad
    app.kubernetes.io/part-of: partner-ai-launchpad
data:
  tool_chat_template_granite.jinja: |
    {%- if tools %}
        {{- '<|start_of_role|>available_tools<|end_of_role|>\n' }}
        {%- for tool in tools %}
        {{- tool | tojson(indent=4) }}
        {%- if not loop.last %}
            {{- '\n\n' }}
        {%- endif %}
        {%- endfor %}
        {{- '<|end_of_text|>\n' }}
    {%- endif %}
    {%- for message in messages %}
        {%- if message['role'] == 'system' %}
        {{- '<|start_of_role|>system<|end_of_role|>' + message['content'] + '<|end_of_text|>\n' }}
        {%- elif message['role'] == 'user' %}
        {{- '<|start_of_role|>user<|end_of_role|>' + message['content'] + '<|end_of_text|>\n' }}
        {%- elif message['role'] == 'assistant_tool_call' or (message['role'] == 'assistant' and message.tool_calls is defined) %}
        {{- '<|start_of_role|>assistant<|end_of_role|><|tool_call|>' + message.tool_calls|map(attribute='function')|list|tojson(indent=4) + '<|end_of_text|>\n' }}
        {%- elif message['role'] == 'assistant' %}
        {{- '<|start_of_role|>assistant<|end_of_role|>' + message['content'] + '<|end_of_text|>\n' }}
        {%- elif message['role'] == 'tool_response' or message['role'] == 'tool' %}
        {{- '<|start_of_role|>tool_response<|end_of_role|>' + message['content'] + '<|end_of_text|>\n' }}
        {%- endif %}
        {%- if loop.last and add_generation_prompt %}
        {{- '<|start_of_role|>assistant<|end_of_role|>' }}
        {%- endif %}
    {%- endfor %}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-granite-3-2-8b-tools
  namespace: fleet-llm-d
  labels:
    app: vllm-granite-3-2-8b-tools
    app.kubernetes.io/name: vllm-granite-3-2-8b-tools
    app.kubernetes.io/component: model-server
    app.kubernetes.io/managed-by: launchpad
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-granite-3-2-8b-tools
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-granite-3-2-8b-tools
        app.kubernetes.io/name: vllm-granite-3-2-8b-tools
        app.kubernetes.io/component: model-server
        app.kubernetes.io/managed-by: launchpad
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker-cpu-tuned: ""
      terminationGracePeriodSeconds: 120
      containers:
        - name: model-server
          image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:cf6577f6d526561651df5390aad916c53820a18a1659e3fb39c1c5a62aef0e3c
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
          args:
            - /models/hub/models--ibm-granite--granite-3.2-8b-instruct/snapshots/610d8c6ee9c84ce51f6dfd7bc5c0215d95d49695
            - --port=8080
            - --served-model-name=granite-3.2-8b-tools
            - --enable-auto-tool-choice
            - --tool-call-parser=granite
            - --chat-template=/app/data/template/tool_chat_template_granite.jinja
            - --block-size=128
            - --dtype=bfloat16
            - --max-model-len=4096
            - --max-num-batched-tokens=4096
            - --max-num-seqs=64
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf_home
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "16"
            - name: VLLM_RPC_TIMEOUT
              value: "300000"
            - name: LD_PRELOAD
              value: /usr/lib64/libomp.so
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "80"
              memory: 64Gi
            limits:
              cpu: "80"
              memory: 64Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: chat-template
              mountPath: /app/data/template/tool_chat_template_granite.jinja
              subPath: tool_chat_template_granite.jinja
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: oberon-model-cache
            readOnly: true
        - name: chat-template
          configMap:
            name: granite-3-2-tool-chat-template
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-granite-3-2-8b-tools
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/name: vllm-granite-3-2-8b-tools
    app.kubernetes.io/managed-by: launchpad
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  type: ClusterIP
  selector:
    app: vllm-granite-3-2-8b-tools
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-launchpad-to-granite-tools
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/managed-by: launchpad
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  podSelector:
    matchLabels:
      app: vllm-granite-3-2-8b-tools
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: partner-ai-launchpad
          podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: launchpad
      ports:
        - protocol: TCP
          port: 8080
