apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-ai-strategy
  labels:
    app.kubernetes.io/name: sales-ai-strategy
    app.kubernetes.io/part-of: partner-ai-launchpad
    app.kubernetes.io/component: sales-entry
    launchpad.redhat.com/surface: sales-entry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sales-ai-strategy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sales-ai-strategy
        app.kubernetes.io/part-of: partner-ai-launchpad
        app.kubernetes.io/component: sales-entry
        launchpad.redhat.com/surface: sales-entry
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: launchpad-registry-pull}]
      containers:
        - name: presentation
          image: ghcr.io/jkershawrh/red-hat-intel-ai-strategy-web@sha256:158695afa247c8c0df58c94ed7bc82ed40cbb6c9bf138e048cb676f23b961218
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 10, periodSeconds: 30}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 300m, memory: 512Mi}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: sales-ai-strategy
  labels:
    app.kubernetes.io/name: sales-ai-strategy
    app.kubernetes.io/part-of: partner-ai-launchpad
    app.kubernetes.io/component: sales-entry
    launchpad.redhat.com/surface: sales-entry
spec:
  selector: {app.kubernetes.io/name: sales-ai-strategy}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sales-ai-strategy
  labels:
    app.kubernetes.io/name: sales-ai-strategy
    app.kubernetes.io/part-of: partner-ai-launchpad
    app.kubernetes.io/component: sales-entry
    launchpad.redhat.com/surface: sales-entry
spec:
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
  to: {kind: Service, name: sales-ai-strategy, weight: 100}
  port: {targetPort: http}
---
