apiVersion: v1
kind: ConfigMap
metadata:
  name: launchpad-config
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
data:
  # Fail closed until an overlay supplies a certified public domain, ingress,
  # TLS certificate, Keycloak broker and OpenShift OIDC integration.
  PUBLIC_ACCESS_ENABLED: "false"
  PUBLIC_LABS_DOMAIN: ""
  # A shared public origin can host multiple orders only when every order is
  # addressed by its persisted /labs/<order-ref> path. Keep this disabled in
  # the base so hostname-only installations retain their existing contract.
  PUBLIC_LABS_SHARED_PATH_MODE: "false"
  SHOWROOM_ARGOCD_NAMESPACE: argocd
  SHOWROOM_ARGOCD_PROJECT: default
  SHOWROOM_CHART_VERSION: "2.2.*"
  SHOWROOM_CONTENT_REPO_URL: https://github.com/jkershawrh/launchpad.git
  SHOWROOM_CONTENT_REF: main
  SHOWROOM_ROUTE_TIMEOUT: "600"
  SHOWROOM_DELETE_TIMEOUT: "30"
  MAX_ACTIVE_SESSIONS_PER_WORKSHOP: "25"
  WORKSHOP_PROVISION_CONCURRENCY: "5"
  WORKSHOP_STABILITY_TIMEOUT: "300"
  WORKSHOP_STABILITY_INTERVAL: "5"
  WORKSHOP_STABILITY_PASSES: "3"
  WORKSHOP_CANCEL_WAIT_TIMEOUT: "900"
  WORKSHOP_RECLAIM_CONCURRENCY: "10"
  # Durable lifecycle execution is shipped dark. Enable only after applying
  # migration 005 and certifying worker takeover against the target cluster.
  LIFECYCLE_HA_ENABLED: "false"
  LAUNCHPAD_CONTROL_PLANE_ROLE: "active"
  LIFECYCLE_JOB_LEASE_SECONDS: "120"
  LIFECYCLE_HEARTBEAT_INTERVAL_SECONDS: "15"
  LIFECYCLE_POLL_INTERVAL_SECONDS: "2"
  # Pilot workshop orders are durable and may queue together, but their
  # provisioning jobs start one at a time across all lifecycle worker replicas.
  # Reclaim, TTL, reconciliation, and individual-session jobs remain eligible.
  SERIALIZE_WORKSHOP_PROVISIONING: "true"
  # Optional deep link for historical cluster, network and LLM telemetry.
  # Launchpad remains the source of truth for order and seat lifecycle state.
  GRAFANA_LAUNCHPAD_DASHBOARD_URL: ""
  ORPHAN_CLEANUP_GRACE_SECONDS: "1800"
  # Orphan deletion remains disabled until an overlay gives this control
  # plane a unique ownership identity.
  LAUNCHPAD_CONTROL_PLANE_ID: ""
  LAUNCHPAD_MODE: "openshift"
  CORS_ORIGINS: "https://launchpad.apps.example.com,https://launchpad-admin.apps.example.com"
