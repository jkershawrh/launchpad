apiVersion: v1
kind: ConfigMap
metadata:
  name: launchpad-config
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
data:
  # Fail closed until an overlay supplies a certified public domain, ingress,
  # TLS certificate, Keycloak broker and OpenShift OIDC integration.
  PUBLIC_ACCESS_ENABLED: "false"
  PUBLIC_LABS_DOMAIN: ""
  SHOWROOM_ARGOCD_NAMESPACE: argocd
  SHOWROOM_ARGOCD_PROJECT: default
  SHOWROOM_CHART_VERSION: "2.2.*"
  SHOWROOM_CONTENT_REPO_URL: https://github.com/jkershawrh/launchpad.git
  SHOWROOM_CONTENT_REF: main
  SHOWROOM_ROUTE_TIMEOUT: "600"
  SHOWROOM_DELETE_TIMEOUT: "30"
  MAX_ACTIVE_SESSIONS_PER_WORKSHOP: "25"
  WORKSHOP_PROVISION_CONCURRENCY: "5"
  WORKSHOP_STABILITY_TIMEOUT: "300"
  WORKSHOP_STABILITY_INTERVAL: "5"
  WORKSHOP_STABILITY_PASSES: "3"
  WORKSHOP_CANCEL_WAIT_TIMEOUT: "900"
  WORKSHOP_RECLAIM_CONCURRENCY: "10"
  ORPHAN_CLEANUP_GRACE_SECONDS: "1800"
  LAUNCHPAD_MODE: "openshift"
  CORS_ORIGINS: "https://launchpad.apps.example.com,https://launchpad-admin.apps.example.com"
