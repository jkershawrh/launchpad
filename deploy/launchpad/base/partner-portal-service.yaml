apiVersion: v1
kind: Service
metadata:
  name: partner-portal
  labels:
    app.kubernetes.io/name: partner-portal
    app.kubernetes.io/part-of: partner-ai-launchpad
    app.kubernetes.io/component: frontend
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: portal-tls
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: oauth-proxy
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    app.kubernetes.io/name: partner-portal
