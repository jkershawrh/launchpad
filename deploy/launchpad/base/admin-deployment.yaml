apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: partner-ai-launchpad
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: partner-ai-launchpad
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: admin
          image: admin:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
