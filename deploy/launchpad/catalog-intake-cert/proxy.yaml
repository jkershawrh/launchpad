apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-intake-egress-proxy
  namespace: launchpad-catalog-intake-cert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-intake-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-intake-egress-proxy
        app.kubernetes.io/component: restricted-egress
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: CATALOG_INTAKE_WORKER_IMAGE
          imagePullPolicy: IfNotPresent
          command: [python3.11, -m, app.catalog_intake_egress_proxy]
          ports:
            - name: proxy
              containerPort: 8080
          env:
            - name: CATALOG_INTAKE_ALLOWED_HOSTS
              value: github.com,api.github.com
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-intake-egress-proxy
  namespace: launchpad-catalog-intake-cert
spec:
  selector:
    app.kubernetes.io/name: catalog-intake-egress-proxy
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
