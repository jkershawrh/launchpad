apiVersion: v1
kind: ConfigMap
metadata:
  name: launchpad-config
data:
  LAUNCHPAD_MODE: "openshift"
  CATALOG_DIR: "/opt/catalog"
  CLUSTER_TARGETS_FILE: "/etc/launchpad/clusters.yaml"
  LAUNCHPAD_CONTROL_CLUSTER_REF: "flightpath"
  LAUNCHPAD_CONTROL_PLANE_ID: "flightpath-candidate"
  LAUNCHPAD_CONTROL_PLANE_ROLE: "active"
  LIFECYCLE_HA_ENABLED: "true"
  WORKSHOP_AUTO_RECOVERY: "false"
  SMART_PLACEMENT_ENABLED: "false"
  PUBLIC_ACCESS_ENABLED: "false"
  PUBLIC_LABS_DOMAIN: ""
  PUBLIC_LABS_SHARED_PATH_MODE: "false"
  ORPHAN_CLEANUP_ENABLED: "false"
  SERIALIZE_WORKSHOP_PROVISIONING: "true"
  KAFKA_BOOTSTRAP_SERVERS: ""
  SHOWROOM_ARGOCD_NAMESPACE: "openshift-gitops"
  SHOWROOM_ARGOCD_PROJECT: "default"
  REMOTE_CONTROL_PLANE_SERVICE_ACCOUNT_NAMESPACE: "openshift-gitops"
  REMOTE_ARGOCD_SERVICE_ACCOUNT: "openshift-gitops-argocd-application-controller"
  MODEL_CA_BUNDLE_NAMESPACE: "launchpad-flightpath-candidate"
