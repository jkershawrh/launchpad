apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-flightpath-candidate-provisioner
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/environment: flightpath-candidate
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, create, update, patch, delete, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: ["", image.openshift.io]
    resources: [imagestreams/layers]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, patch, delete, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, create, update, patch, delete, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [edit, launchpad-flightpath-argocd-seat-manager]
    verbs: [bind]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, create, update, patch, delete, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-flightpath-argocd-seat-manager
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/environment: flightpath-candidate
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, secrets, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: launchpad-flightpath-candidate-provisioner
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/environment: flightpath-candidate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: launchpad-flightpath-candidate-provisioner
subjects:
  - kind: ServiceAccount
    name: launchpad-backend
    namespace: launchpad-flightpath-candidate
---
# The candidate backend needs cluster-scoped namespace lifecycle privileges,
# but it must never be able to use them against unrelated workloads. Keep this
# admission boundary independent from application authorization so a stolen
# service-account token still fails closed outside Launchpad-owned namespaces.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: launchpad-flightpath-candidate-namespace-boundary
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/environment: flightpath-candidate
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: ["*"]
        scope: "*"
  validations:
    - expression: >-
        request.userInfo.username !=
        'system:serviceaccount:launchpad-flightpath-candidate:launchpad-backend'
        || (request.resource.resource == 'namespaces'
          ? (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name).startsWith('launchpad-')
          : request.namespace.startsWith('launchpad-')
            || (request.resource.group == 'argoproj.io'
              && request.resource.resource == 'applications'
              && request.namespace == 'openshift-gitops'
              && (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name)
                .matches('^(showroom|workload)-launchpad-.*$')))
      message: Flightpath candidate writes are restricted to Launchpad-owned namespaces.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: launchpad-flightpath-candidate-namespace-boundary
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
    launchpad.redhat.com/environment: flightpath-candidate
spec:
  policyName: launchpad-flightpath-candidate-namespace-boundary
  validationActions: [Deny]
