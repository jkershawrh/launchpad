apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrate-flightpath-candidate-34f8435
  labels:
    app.kubernetes.io/name: database-migrate
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migrate
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: partner-ai-launchpad
    spec:
      restartPolicy: OnFailure
      serviceAccountName: launchpad-backend
      imagePullSecrets:
        - name: launchpad-registry-pull
      containers:
        - name: migrate
          image: quay.io/rh-ee-jkershaw/launchpad-backend@sha256:b65773f81f400cbf71f1c6e104a246e2d798bdfe3e333bf2879393beef8c4ac1
          imagePullPolicy: IfNotPresent
          command: [python, -c]
          args:
            - >-
              import os, psycopg2;
              from app.storage.database import _initialize_database;
              _initialize_database(psycopg2, os.environ['DATABASE_URL'])
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: launchpad-db-secret
                  key: DATABASE_URL
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
