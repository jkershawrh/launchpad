apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      imagePullSecrets:
        - name: launchpad-registry-pull
      containers:
        - name: backend
          env:
            - name: SSL_CERT_FILE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: launchpad-litellm
                  key: LITELLM_API_KEY
          volumeMounts:
            - name: cluster-targets
              mountPath: /etc/launchpad
              readOnly: true
            - name: cluster-ca-bundle
              mountPath: /etc/launchpad-ca
              readOnly: true
            - name: candidate-serve-llms-catalog
              mountPath: /opt/catalog/intel-llm-cpu-serving/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: candidate-agent-201-catalog
              mountPath: /opt/catalog/intel-xeon6-agent-201/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: candidate-multi-agent-catalog
              mountPath: /opt/catalog/multi-agent-quickstart/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: candidate-hybrid-fraud-catalog
              mountPath: /opt/catalog/hybrid-fraud-detection/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: candidate-network-operations-catalog
              mountPath: /opt/catalog/network-operations-agent
              readOnly: true
            - name: canonical-ai-sandbox-catalog
              mountPath: /opt/catalog/ai-sandbox/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: canonical-cpu-inference-serving-catalog
              mountPath: /opt/catalog/cpu-inference-serving/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: canonical-rag-on-xeon-catalog
              mountPath: /opt/catalog/rag-on-xeon/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: canonical-intel-llm-tool-calling-catalog
              mountPath: /opt/catalog/intel-llm-tool-calling/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: canonical-openshift-operators-workshop-catalog
              mountPath: /opt/catalog/openshift-operators-workshop/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: canonical-smoke-test-catalog
              mountPath: /opt/catalog/smoke-test/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
      volumes:
        - name: cluster-targets
          configMap:
            name: launchpad-cluster-targets
        - name: cluster-ca-bundle
          configMap:
            name: launchpad-cluster-ca-bundle
            optional: false
        - name: candidate-serve-llms-catalog
          configMap:
            name: flightpath-candidate-serve-llms-catalog
        - name: candidate-agent-201-catalog
          configMap:
            name: flightpath-candidate-agent-201-catalog
        - name: candidate-multi-agent-catalog
          configMap:
            name: flightpath-candidate-multi-agent-catalog
        - name: candidate-hybrid-fraud-catalog
          configMap:
            name: flightpath-candidate-hybrid-fraud-catalog
        - name: candidate-network-operations-catalog
          configMap:
            name: flightpath-candidate-network-operations-catalog
        - name: canonical-ai-sandbox-catalog
          configMap:
            name: canonical-ai-sandbox-catalog
        - name: canonical-cpu-inference-serving-catalog
          configMap:
            name: canonical-cpu-inference-serving-catalog
        - name: canonical-rag-on-xeon-catalog
          configMap:
            name: canonical-rag-on-xeon-catalog
        - name: canonical-intel-llm-tool-calling-catalog
          configMap:
            name: canonical-intel-llm-tool-calling-catalog
        - name: canonical-openshift-operators-workshop-catalog
          configMap:
            name: canonical-openshift-operators-workshop-catalog
        - name: canonical-smoke-test-catalog
          configMap:
            name: canonical-smoke-test-catalog
---
