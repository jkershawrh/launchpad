apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      imagePullSecrets:
        - name: launchpad-registry-pull
      containers:
        - name: backend
          env:
            - name: SSL_CERT_FILE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/launchpad-ca/ca-bundle.crt
          volumeMounts:
            - name: cluster-targets
              mountPath: /etc/launchpad
              readOnly: true
            - name: cluster-ca-bundle
              mountPath: /etc/launchpad-ca
              readOnly: true
            - name: candidate-serve-llms-catalog
              mountPath: /opt/catalog/intel-llm-cpu-serving/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: candidate-agent-201-catalog
              mountPath: /opt/catalog/intel-xeon6-agent-201/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: candidate-multi-agent-catalog
              mountPath: /opt/catalog/multi-agent-quickstart/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
            - name: candidate-hybrid-fraud-catalog
              mountPath: /opt/catalog/hybrid-fraud-detection/catalog-item.yaml
              subPath: catalog-item.yaml
              readOnly: true
      volumes:
        - name: cluster-targets
          configMap:
            name: launchpad-cluster-targets
        - name: cluster-ca-bundle
          configMap:
            name: launchpad-cluster-ca-bundle
            optional: false
        - name: candidate-serve-llms-catalog
          configMap:
            name: flightpath-candidate-serve-llms-catalog
        - name: candidate-agent-201-catalog
          configMap:
            name: flightpath-candidate-agent-201-catalog
        - name: candidate-multi-agent-catalog
          configMap:
            name: flightpath-candidate-multi-agent-catalog
        - name: candidate-hybrid-fraud-catalog
          configMap:
            name: flightpath-candidate-hybrid-fraud-catalog
---
