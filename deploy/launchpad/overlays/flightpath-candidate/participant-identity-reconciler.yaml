apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad-participant-identity-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-flightpath-participant-identity-reconciler
rules:
  - apiGroups: [oauth.openshift.io]
    resources: [oauthaccesstokens]
    verbs: [get, list, delete]
  - apiGroups: [user.openshift.io]
    resources: [users]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: launchpad-flightpath-participant-identity-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: launchpad-flightpath-participant-identity-reconciler
subjects:
  - kind: ServiceAccount
    name: launchpad-participant-identity-reconciler
    namespace: launchpad-flightpath-candidate
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: launchpad-flightpath-participant-identity-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [oauth.openshift.io]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [oauthaccesstokens]
        scope: Cluster
      - apiGroups: [user.openshift.io]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [users]
        scope: Cluster
  validations:
    - expression: >-
        request.userInfo.username !=
        'system:serviceaccount:launchpad-flightpath-candidate:launchpad-participant-identity-reconciler'
        || (request.resource.group == 'oauth.openshift.io'
          ? oldObject.userName.startsWith('lp-')
          : oldObject.metadata.name.startsWith('lp-'))
      message: The Launchpad identity reconciler may remove only lp- participant identities.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: launchpad-flightpath-participant-identity-boundary
spec:
  policyName: launchpad-flightpath-participant-identity-boundary
  validationActions: [Deny]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: participant-identity-reconciler
spec:
  schedule: "*/5 * * * *"
  # First activation is deliberately suspended. Certification creates one
  # explicit Job from this template, verifies the identity boundary and zero
  # residue, and only then enables the recurring schedule.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: participant-identity-reconciler
            app.kubernetes.io/component: identity-lifecycle
            app.kubernetes.io/part-of: partner-ai-launchpad
            app.kubernetes.io/managed-by: kustomize
        spec:
          serviceAccountName: launchpad-participant-identity-reconciler
          restartPolicy: Never
          containers:
            - name: reconciler
              image: backend:latest
              imagePullPolicy: IfNotPresent
              command: [python, -m, app.identity_reconciler_main]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: launchpad-db-secret
                      key: DATABASE_URL
                - name: KEYCLOAK_ADMIN_BASE_URL
                  value: http://keycloak.launchpad-stage.svc:8080
                - name: KEYCLOAK_REALM
                  value: launchpad-public
                - name: KEYCLOAK_RECONCILER_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: launchpad-identity-reconciler-keycloak
                      key: client-id
                - name: KEYCLOAK_RECONCILER_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: launchpad-identity-reconciler-keycloak
                      key: client-secret
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
