apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifecycle-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    spec:
      # Keep one lifecycle owner per worker node. If one node is unavailable,
      # its replacement remains Pending while the surviving process takes over
      # durable jobs; two owners must never collapse onto one failure domain.
      topologySpreadConstraints:
        - $patch: replace
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/managed-by: kustomize
              app.kubernetes.io/name: lifecycle-worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [lifecycle-worker]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: lifecycle-worker
          env:
            - name: SSL_CERT_FILE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: LIFECYCLE_JOB_LEASE_SECONDS
              value: "30"
            - name: LIFECYCLE_HEARTBEAT_INTERVAL_SECONDS
              value: "5"
            - name: LIFECYCLE_POLL_INTERVAL_SECONDS
              value: "1"
