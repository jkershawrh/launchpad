apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms-granite-2b
  namespace: fleet-llm-d
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: gnr2.fm2aihpcsed.com
      containers:
        - name: ovms
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
        - name: tls-proxy
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
