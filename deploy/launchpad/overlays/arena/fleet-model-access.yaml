apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-launchpad-backend-to-granite
  namespace: fleet-llm-d
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  podSelector:
    matchLabels:
      app: ovms-granite-2b
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: partner-ai-launchpad
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - backend
                  - lifecycle-worker
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: launchpad
      ports:
        - protocol: TCP
          port: 8080
