apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    launchpad.redhat.com/ha-blocker: in-memory-session-cache-must-be-externalized-before-replicas-exceed-one
spec:
  # A rolling replacement can overlap two process-local workshop workers.
  # Use Recreate until workshop execution has a distributed database lease.
  strategy:
    type: Recreate
  template:
    spec:
      # The backend is intentionally single-replica until its in-memory session
      # cache is externalized. Keep that control-plane singleton on Arena's
      # stable worker so a transient rhgnr1 outage cannot stall workshop cleanup.
      nodeSelector:
        kubernetes.io/hostname: gnr2.fm2aihpcsed.com
      containers:
        - name: backend
          # Workshop state, validation results, and concurrent Kubernetes
          # clients exceeded the base 512Mi limit at the second 25-seat order.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            # Scaled operator workshops can queue transient rollout pods while
            # RHOAI reconciles. Retry only transient readiness failures for up
            # to five minutes; hard failures still return immediately.
            - name: OPENSHIFT_VALIDATION_ATTEMPTS
              value: "61"
            - name: OPENSHIFT_VALIDATION_INTERVAL_SECONDS
              value: "5"
            - name: SSL_CERT_FILE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/launchpad-ca/ca-bundle.crt
          volumeMounts:
            - name: cluster-targets
              mountPath: /etc/launchpad
              readOnly: true
            - name: cluster-ca-bundle
              mountPath: /etc/launchpad-ca
              readOnly: true
      volumes:
        - name: cluster-targets
          configMap:
            name: launchpad-cluster-targets
        - name: cluster-ca-bundle
          configMap:
            name: launchpad-cluster-ca-bundle
            optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  template:
    spec:
      # Postgres is also a single-replica control-plane dependency. Its RWO
      # NFS claim can move between Arena workers, and the Recreate strategy in
      # the base prevents simultaneous mounts during this placement change.
      nodeSelector:
        kubernetes.io/hostname: gnr2.fm2aihpcsed.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: partner-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  # Arena currently has one schedulable worker. Keep the pilot admin service
  # available on gnr2 without blocking rollouts on a hard topology spread.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-access-gateway
spec:
  # Public access is disabled by default on Arena. The disposable pilot starts
  # one gateway replica explicitly; production HA belongs with stable ingress
  # and at least two schedulable worker nodes.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: public-access-gateway
