apiVersion: v1
kind: ConfigMap
metadata:
  name: launchpad-cluster-targets
data:
  clusters.yaml: |
    clusters:
      - cluster_id: arena
        display_name: Arena Primary
        api_url: https://kubernetes.default.svc
        ingress_domain: apps.arena.fm2aihpcsed.com
        console_url: https://console-openshift-console.apps.arena.fm2aihpcsed.com
        storage_class: launchpad-nfs-ephemeral
        local: true
        priority: 10
        public_access_enabled: true
        public_ingress_domain: labs.smg-helix.ai
        # Public Console/OAuth proxying is not part of the September pilot
        # release gate. Keep participant Console links fail-closed while the
        # named tunnel serves the training dashboard, Showroom and lab tools.
        public_console_url: ""
        public_oauth_url: ""
        capabilities: [cpu, openshift, operators, openshift-ai, rhoai, showroom, model_endpoint, embedding_endpoint, mlflow, openshift_logging, agentops_observability_stack, user_workload_monitoring, data_science_pipelines, control-plane]
        service_urls:
          mlflow: https://rh-ai.apps.arena.fm2aihpcsed.com/mlflow
          rhoai: https://rh-ai.apps.arena.fm2aihpcsed.com/
        image_references:
          showroom_git_cloner: image-registry.openshift-image-registry.svc:5000/partner-ai-launchpad/launchpad-showroom-git-cloner@sha256:9083067bc09ae0d6e4f48306739e080a194056e6baed57bdc3fe8c05c9effdf8
          showroom_terminal: image-registry.openshift-image-registry.svc:5000/partner-ai-launchpad/launchpad-showroom-terminal@sha256:5f0024af3b0aec55f96bb200a1192ac9790b82b76be692017345b6f9abcf023f
        model_endpoints:
          granite-2b-cpu: http://ovms-granite-2b.fleet-llm-d.svc:8080/v1
          granite-3.2-8b-tools: http://vllm-granite-3-2-8b-tools.fleet-llm-d.svc:8080/v1
          nomic-embed-text-v1.5: http://tei-nomic-embed.fleet-llm-d.svc:8080/v1
      - cluster_id: oberon
        display_name: Oberon Primary
        api_url: https://api.oberon.fm2aihpcsed.com:6443
        ingress_domain: apps.oberon.fm2aihpcsed.com
        console_url: https://console-openshift-console.apps.oberon.fm2aihpcsed.com
        storage_class: launchpad-nfs-ephemeral
        credential_secret: partner-ai-launchpad/launchpad-oberon-kubeconfig
        local: false
        priority: 50
        enabled: false
        public_access_enabled: false
        public_ingress_domain: ""
        public_console_url: ""
        public_oauth_url: ""
        image_references:
          showroom_git_cloner: quay.io/rhpds/git-cloner@sha256:2b036e2ed3b7cb8cd214361e599884ddc47aadf6adf2220700f4ee5dfae52f65
          showroom_terminal: quay.io/rhpds/openshift-showroom-terminal-ocp@sha256:e0301bebc02bd463c5fe9e8587dd9cbc7568d6fc1b3dd20182ec8b58e4e5583c
        capabilities: [cpu, gaudi, gaudi_direct, openshift, operators, openshift-ai, showroom, model_endpoint, vector_db, kafka, workbench]
        model_endpoints:
          granite-2b-cpu: https://ovms-granite-2b-fleet-llm-d.apps.oberon.fm2aihpcsed.com/v1
          smollm2-360m: https://inference.apps.oberon.fm2aihpcsed.com/v1
          smollm3-3b: https://inference.apps.oberon.fm2aihpcsed.com/v1
          qwen36-moe: https://inference.apps.oberon.fm2aihpcsed.com/v1
          llama31-8b-w8a8: https://inference.apps.oberon.fm2aihpcsed.com/v1
          granite-2b: https://inference.apps.oberon.fm2aihpcsed.com/v1
          gemma-4-e4b: https://inference.apps.oberon.fm2aihpcsed.com/v1
          gemma3-4b: https://inference.apps.oberon.fm2aihpcsed.com/v1
          granite-3b: https://inference.apps.oberon.fm2aihpcsed.com/v1
          llama32-1b: https://inference.apps.oberon.fm2aihpcsed.com/v1
          phi4-mini: https://inference.apps.oberon.fm2aihpcsed.com/v1
      - cluster_id: brutus
        display_name: Brutus CPU Execution
        api_url: https://api.brutus.fm2aihpcsed.com:6443
        ingress_domain: apps.brutus.fm2aihpcsed.com
        console_url: https://console-openshift-console.apps.brutus.fm2aihpcsed.com
        storage_class: launchpad-nfs-ephemeral
        credential_secret: partner-ai-launchpad/launchpad-brutus-kubeconfig
        local: false
        priority: 20
        # Enabled for explicitly targeted, supervised pilot orders. Public
        # traffic remains behind Arena's entitlement-aware single-host gateway;
        # Brutus application routes are never advertised directly.
        enabled: true
        public_access_enabled: true
        public_ingress_domain: labs.smg-helix.ai
        public_console_url: ""
        public_oauth_url: ""
        image_references:
          showroom_git_cloner: image-registry.openshift-image-registry.svc:5000/partner-ai-launchpad/launchpad-showroom-git-cloner@sha256:9083067bc09ae0d6e4f48306739e080a194056e6baed57bdc3fe8c05c9effdf8
          showroom_terminal: image-registry.openshift-image-registry.svc:5000/partner-ai-launchpad/launchpad-showroom-terminal@sha256:5f0024af3b0aec55f96bb200a1192ac9790b82b76be692017345b6f9abcf023f
        capabilities: [cpu, openshift, operators, showroom, model_endpoint]
        model_endpoints:
          granite-3.2-8b-tools: https://vllm-granite-3-2-8b-tools-fleet-llm-d.apps.arena.fm2aihpcsed.com/v1
      - cluster_id: flightpath
        display_name: Flightpath DR Standby
        api_url: https://api.flightpath.fm2aihpcsed.com:6443
        ingress_domain: apps.flightpath.fm2aihpcsed.com
        console_url: https://console-openshift-console.apps.flightpath.fm2aihpcsed.com
        storage_class: ocs-storagecluster-ceph-rbd
        credential_secret: partner-ai-launchpad/launchpad-flightpath-kubeconfig
        local: false
        priority: 90
        enabled: false
        # Passive control-plane recovery target; never selected by pilot placement.
        public_access_enabled: false
        capabilities: [cpu, openshift, operators, showroom, dr-standby]
