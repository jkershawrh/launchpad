apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: partner-ai-launchpad

resources:
  - ../../base
  - flightpath-clusters.yaml

patches:
  - path: patch-configmap.yaml
  - path: patch-postgres-pvc.yaml
  - path: patch-generated-secrets.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: batch
      version: v1
      kind: CronJob
    patch: |-
      - op: replace
        path: /spec/suspend
        value: true
