apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-workforce-canary-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: workforce-access-canary
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - {port: 4180, protocol: TCP}
