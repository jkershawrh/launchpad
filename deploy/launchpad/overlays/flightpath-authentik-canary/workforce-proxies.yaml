apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchpad-requester-authentik-canary
  labels:
    app.kubernetes.io/name: launchpad-requester-authentik-canary
    app.kubernetes.io/component: workforce-access-canary
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: launchpad-requester-authentik-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: launchpad-requester-authentik-canary
        app.kubernetes.io/component: workforce-access-canary
        app.kubernetes.io/part-of: partner-ai-launchpad
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy@sha256:786bed0f000c0f8a7b31619244ebab02406a8856a4faf3f5fb1df61fbd6c30ed
          args:
            - --provider=oidc
            - --http-address=0.0.0.0:4180
            - --upstream=http://partner-portal:8080
            - --redirect-url=https://launchpad-auth-candidate.apps.flightpath.fm2aihpcsed.com/oauth2/callback
            - --email-domain=*
            - --scope=openid profile email groups
            - --oidc-groups-claim=groups
            - --allowed-group=launchpad-requesters
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --set-authorization-header=true
            - --set-xauthrequest=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=5m
            - --cookie-expire=8h
            - --reverse-proxy=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://auth.smg-helix.ai/application/o/launchpad-workforce/
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: launchpad-authentik-workforce, key: client-id}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: launchpad-authentik-workforce, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: launchpad-authentik-workforce, key: requester-cookie-secret}
          ports:
            - {name: http, containerPort: 4180}
          readinessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 30}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: launchpad-requester-authentik-canary
  labels:
    app.kubernetes.io/name: launchpad-requester-authentik-canary
    app.kubernetes.io/component: workforce-access-canary
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  selector:
    app.kubernetes.io/name: launchpad-requester-authentik-canary
  ports:
    - {name: http, port: 4180, targetPort: http}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: launchpad-requester-authentik-canary
  labels:
    app.kubernetes.io/name: launchpad-requester-authentik-canary
    app.kubernetes.io/component: workforce-access-canary
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  host: launchpad-auth-candidate.apps.flightpath.fm2aihpcsed.com
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: launchpad-requester-authentik-canary
  port:
    targetPort: http
---
