apiVersion: v1
kind: Namespace
metadata:
  name: openshift-gitops
  labels:
    app.kubernetes.io/part-of: partner-ai-launchpad
    app.kubernetes.io/component: dr-gitops
---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  controller:
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-remote-cluster-config-reader
  namespace: partner-ai-launchpad
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - launchpad-arena-kubeconfig
      - launchpad-brutus-kubeconfig
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames:
      - launchpad-cluster-ca-bundle
      - launchpad-showroom-runtime
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-remote-cluster-config-reader
  namespace: partner-ai-launchpad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchpad-remote-cluster-config-reader
subjects:
  - kind: ServiceAccount
    name: launchpad-backend
    namespace: partner-ai-launchpad
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-application-manager
  namespace: openshift-gitops
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-application-manager
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchpad-application-manager
subjects:
  - kind: ServiceAccount
    name: launchpad-backend
    namespace: partner-ai-launchpad
