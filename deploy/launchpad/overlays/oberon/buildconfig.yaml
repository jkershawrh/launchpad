apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: launchpad-backend
  labels:
    app.kubernetes.io/name: launchpad-backend
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  source:
    type: Git
    git:
      uri: https://github.com/rhpds/launchpad.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: backend/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: launchpad-backend:latest
  triggers:
    - type: ConfigChange
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: launchpad-backend
  labels:
    app.kubernetes.io/name: launchpad-backend
    app.kubernetes.io/part-of: partner-ai-launchpad
---
