apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-stage
automountServiceAccountToken: false
imagePullSecrets:
  - name: launchpad-registry-pull
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: management, port: 9000, targetPort: management}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  # Bootstrap scales 0 -> 1 -> 2 after the database schema exists. This avoids
  # concurrent first-start initialization while retaining the final HA shape.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    spec:
      serviceAccountName: keycloak-stage
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      containers:
        - name: keycloak
          # The Flightpath pull robot is currently scoped to the established
          # launchpad-backend repository. Keep this stage artifact pinned by
          # digest there until a dedicated Keycloak repository grant exists.
          image: quay.io/redhat-gpte/launchpad-backend@sha256:34b82be667f576d16e7c95394c6d6b30fba30d3d2ea970d0b346b4a179c0b5ba
          imagePullPolicy: IfNotPresent
          args: [start, --optimized]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: jdbc:postgresql://postgres:5432/launchpad_stage}
            - {name: KC_DB_SCHEMA, value: keycloak}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: {name: launchpad-db-secret, key: POSTGRES_USER}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: launchpad-db-secret, key: POSTGRES_PASSWORD}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HOSTNAME, value: http://keycloak.launchpad-stage.svc:8080}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_CACHE, value: ispn}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: keycloak-stage-bootstrap, key: username}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-stage-bootstrap, key: password}
            - {name: LAUNCHPAD_ACCESS_VALIDATION_URL, value: http://backend:8000/api/v1/public-access/private/validate}
            - name: ACCESS_BROKER_KEY
              valueFrom:
                secretKeyRef: {name: keycloak-stage-bootstrap, key: broker-key}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
