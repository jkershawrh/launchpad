apiVersion: v1
kind: ConfigMap
metadata:
  name: launchpad-config
data:
  LAUNCHPAD_MODE: openshift
  LAUNCHPAD_CONTROL_PLANE_ID: flightpath-stage
  LAUNCHPAD_CONTROL_PLANE_ROLE: active
  LIFECYCLE_HA_ENABLED: "true"
  WORKSHOP_AUTO_RECOVERY: "false"
  SMART_PLACEMENT_ENABLED: "false"
  PUBLIC_ACCESS_ENABLED: "true"
  PUBLIC_LABS_SHARED_ORIGIN: https://stage.invalid
  PUBLIC_LABS_SHARED_PATH_MODE: "true"
  AUTH_ENABLED: "false"
  ORPHAN_CLEANUP_ENABLED: "false"
