apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-schema-20260920
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-schema
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: create-schema
          image: docker.io/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
          command: [/bin/sh, -ec]
          args:
            - >-
              psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"
              -v ON_ERROR_STOP=1
              -c 'CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION launchpad_stage'
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: launchpad-db-secret, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: launchpad-db-secret, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: launchpad-db-secret, key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
