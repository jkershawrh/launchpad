apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {port: 8000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    # Keycloak's embedded Infinispan/JGroups cache needs peer traffic for
    # replica health. Restrict it to identically labeled stage pods only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {port: 7800, protocol: TCP}
        - {port: 57800, protocol: TCP}
    # The public edge runs in the candidate namespace. Both the tunnel router
    # (browser endpoints) and oauth2-proxy (token/JWKS backchannel) must reach
    # Keycloak, while every other cross-namespace caller remains denied.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: launchpad-flightpath-candidate
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cloudflare-tunnel
                  - participant-identity-reconciler
                  - public-access-gateway
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: database-migrate
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-schema
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {port: 5432, protocol: TCP}
