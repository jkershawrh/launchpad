# The referenced Secrets are generated directly in the cluster and are never
# stored in Git. Build the image with keycloak-image-build.yaml before applying
# this resource.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata: {name: keycloak, namespace: keycloak}
spec:
  instances: 1
  image: image-registry.openshift-image-registry.svc:5000/keycloak/launchpad-keycloak@sha256:aa63ad89397a97be5b961e5c49d76406429af689ebbccb0610c7ab57f20a0dde
  startOptimized: true
  ingress: {enabled: false}
  http: {httpEnabled: true}
  proxy: {headers: xforwarded}
  hostname:
    strict: false
  db:
    vendor: postgres
    host: keycloak-postgres
    database: keycloak
    usernameSecret: {name: keycloak-db, key: username}
    passwordSecret: {name: keycloak-db, key: password}
  bootstrapAdmin:
    user: {secret: keycloak-bootstrap-admin}
  additionalOptions:
    - {name: spi-login-protocol-openid-connect-legacy-logout-redirect-uri, value: "true"}
  unsupported:
    podTemplate:
      spec:
        containers:
          - name: keycloak
            env:
              - name: LAUNCHPAD_ACCESS_VALIDATION_URL
                value: http://backend.partner-ai-launchpad.svc:8000/api/v1/public-access/private/validate
              - name: ACCESS_BROKER_KEY
                valueFrom:
                  secretKeyRef: {name: launchpad-access-broker, key: ACCESS_BROKER_KEY}
