apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad-certification-runner
  namespace: launchpad-flightpath-candidate
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-flightpath-certification-runner
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, services, secrets, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [default-ingress-cert]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [config.openshift.io]
    resources: [ingresses]
    resourceNames: [cluster]
    verbs: [get]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [edit]
    verbs: [bind]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: launchpad-flightpath-certification-runner
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: launchpad-flightpath-certification-runner
subjects:
  - kind: ServiceAccount
    name: launchpad-certification-runner
    namespace: launchpad-flightpath-candidate
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: launchpad-flightpath-certification-rolebinding-boundary
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
        scope: Namespaced
  validations:
    - expression: >-
        request.userInfo.username !=
        'system:serviceaccount:launchpad-flightpath-candidate:launchpad-certification-runner'
        || (request.namespace.startsWith('launchpad-')
          && (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name)
            == 'launchpad-certification-probe'
          && (request.operation == 'DELETE' ? oldObject.roleRef.kind : object.roleRef.kind)
            == 'ClusterRole'
          && (request.operation == 'DELETE' ? oldObject.roleRef.name : object.roleRef.name)
            == 'edit'
          && (request.operation == 'DELETE' ? oldObject.subjects : object.subjects).size() == 1
          && (request.operation == 'DELETE' ? oldObject.subjects[0].kind : object.subjects[0].kind)
            == 'ServiceAccount'
          && (request.operation == 'DELETE' ? oldObject.subjects[0].namespace : object.subjects[0].namespace)
            == 'launchpad-flightpath-candidate'
          && (request.operation == 'DELETE' ? oldObject.subjects[0].name : object.subjects[0].name)
            == 'launchpad-certification-runner')
      message: The certification runner may bind only the edit probe inside Launchpad seat namespaces.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: launchpad-flightpath-certification-rolebinding-boundary
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  policyName: launchpad-flightpath-certification-rolebinding-boundary
  validationActions: [Deny]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: launchpad-certification-evidence
  namespace: launchpad-flightpath-candidate
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: launchpad-certification-postgres-ingress
  namespace: launchpad-flightpath-candidate
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/managed-by: kustomize
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: launchpad-certification-runner
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: launchpad-certification-runner
  namespace: launchpad-flightpath-candidate
  labels:
    app.kubernetes.io/name: launchpad-certification-runner
    app.kubernetes.io/part-of: partner-ai-launchpad
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/rhpds/launchpad.git
      ref: c625eac37432632e1ec727676cd4d03f67da8de4
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: backend/CertificationContainerfile
  output:
    to:
      kind: DockerImage
      name: quay.io/rh-ee-jkershaw/launchpad-certification-runner:c625eac
    pushSecret:
      name: launchpad-registry-pull
  triggers: []
