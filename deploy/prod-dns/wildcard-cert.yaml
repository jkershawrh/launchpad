apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arena-wildcard
  namespace: openshift-ingress
spec:
  secretName: arena-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.apps.arena.fm2aihpcsed.com"
  duration: 2160h    # 90 days
  renewBefore: 360h  # renew 15 days before expiry
