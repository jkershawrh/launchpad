apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: launchpad-admin@fm2aihpcsed.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # DNS01 solver for wildcard certs.
      # Adjust the provider section for your DNS provider.
      # This example uses Cloudflare.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - fm2aihpcsed.com
