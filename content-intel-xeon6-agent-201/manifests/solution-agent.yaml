apiVersion: apps/v1
kind: Deployment
metadata:
  name: solution-agent
  labels:
    app: solution-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solution-agent
  template:
    metadata:
      labels:
        app: solution-agent
        launchpad.redhat.com/solution-stack: agent-201
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: prepare-solution-agent
          image: quay.io/redhat-gpte/triforce-solution-agent@sha256:60897d598014f040c9f515312233b5a22df80c93ba3342c16f681be027933d03
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp -R /app/. /workdir/
              sed -i \
                -e 's/_get_llm(max_tokens=512)/_get_llm(max_tokens=int(os.environ.get("REQUIREMENTS_MAX_TOKENS", "192")))/' \
                -e 's/_get_llm(max_tokens=2048)/_get_llm(max_tokens=int(os.environ.get("BRIEF_MAX_TOKENS", "512")))/' \
                /workdir/graph.py
              grep -F 'REQUIREMENTS_MAX_TOKENS' /workdir/graph.py
              grep -F 'BRIEF_MAX_TOKENS' /workdir/graph.py
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: solution-agent-app
              mountPath: /workdir
      containers:
        - name: solution-agent
          image: quay.io/redhat-gpte/triforce-solution-agent@sha256:60897d598014f040c9f515312233b5a22df80c93ba3342c16f681be027933d03
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8082
          env:
            - name: LITELLM_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: racmaas-connection
                  key: api-base
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-key
                  key: api-key
            - name: MCP_SERVER_URL
              value: http://solution-tools:8095
            - name: ADVISOR_MODEL
              value: granite-2b-cpu
            - name: SSL_CERT_FILE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/launchpad-ca/ca-bundle.crt
            - name: REQUIREMENTS_MAX_TOKENS
              value: "192"
            - name: BRIEF_MAX_TOKENS
              value: "512"
            - name: PROMPT_PATH
              value: /etc/advisor/system_prompt
          volumeMounts:
            - name: solution-agent-app
              mountPath: /app
            - name: prompt
              mountPath: /etc/advisor
            - name: model-ca-bundle
              mountPath: /etc/launchpad-ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: solution-tools
          image: quay.io/redhat-gpte/triforce-solution-tools@sha256:856874dc984eeb05ec0aeadb6f49265a58687eed17e5a92bc769875d3df44850
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8095
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: solution-agent-app
          emptyDir: {}
        - name: prompt
          configMap:
            name: advisor-prompt
        - name: model-ca-bundle
          configMap:
            name: launchpad-model-ca-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: solution-agent
spec:
  selector:
    app: solution-agent
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: solution-agent
  port:
    targetPort: 8082
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
