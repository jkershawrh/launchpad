    requirement: An established terminal WebSocket survives or transparently recovers from connector loss
    critical: false
    stage: RED
    reason: HTTP, OIDC, lab-entry, and Console continuity passed; an established WebSocket was not part of the connector fault run.
release_rule: >-
  No critical RED row is release-ready. The permanent-origin September pilot
  may proceed under supervision for the proven one-seat participant and Arena
  Console paths, but production or GA requires the 25-claim and 25-participant
  live gates, zero-residue order cleanup, worker-level resilience, durable
  Console certificate management, and three consecutive complete runs.
