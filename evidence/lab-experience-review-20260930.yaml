review_standard:
  journey_order:
    - show
    - learn
    - do
    - prove
  required_surfaces:
    - story
    - executable_lab
    - learner_verification
    - cleanup_or_reclaim_boundary
  conditional_proof:
    operators: declared operator tabs must be used and certified
    inference: effective model identity and a real completion must be proven when claimed
    source_truth: rehearsal, simulated, and live paths must be visibly distinct
portfolio_evidence:
  contract_validation:
    status: green-local
    evidence: 25 certification contracts validate against their onboarding definitions
  one_seat_planning:
    status: green-local
    evidence: all 24 unique contracted catalog identities produce an eligible one-seat plan; multi-agent also retains a historical Arena contract
  regression_suite:
    status: green-local
    evidence: 188 focused portfolio, publication-queue, journey, catalog, runtime-secret, operator, sandbox, content-package, and progression tests passed locally on 2026-09-30; this remains local evidence rather than immutable release evidence
  consistency_audit:
    status: green-local
    evidence:
      - 81 focused portfolio contract and evidence tests passed on 2026-09-30
      - all 25 non-deprecated identities are classified exactly once
      - 22 participant experiences have certification probe and lifecycle contracts
      - two compatibility aliases are explicitly duplicate and hidden from normal discovery
      - smoke-test remains a platform-validation probe, not a learner lab
      - catalog identity, onboarding links, certification links, and the Intel Agent 201 Showroom source pin were reconciled
  live_boundary:
    status: incomplete
    evidence: source candidates that changed after their last live evidence must be published, pinned, and recertified before their operator or inference status can be promoted to GREEN-live
  flightpath_shared_foundations:
    status: green-live
    observed_at: "2026-09-30"
    evidence:
