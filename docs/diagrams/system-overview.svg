<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 950" font-family="'Red Hat Display', 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="redhat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EE0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <linearGradient id="intel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0068B5"/>
      <stop offset="100%" stop-color="#004A8F"/>
    </linearGradient>
    <linearGradient id="stargate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1300" height="950" fill="#FAFAFA" rx="12"/>

  <!-- Title -->
  <text x="650" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#151515">Intel × Red Hat AI Partner Launchpad — System Architecture</text>

  <!-- User -->
  <rect x="250" y="60" width="200" height="50" rx="25" fill="#151515" filter="url(#shadow)"/>
  <text x="350" y="91" text-anchor="middle" font-size="14" font-weight="600" fill="white">Partner / Customer</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LAUNCHPAD BOX -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="40" y="130" width="720" height="510" rx="12" fill="white" stroke="#EE0000" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="40" y="130" width="720" height="34" rx="12" fill="url(#redhat)"/>
  <rect x="40" y="153" width="720" height="11" fill="url(#redhat)"/>
  <text x="400" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="white">LAUNCHPAD — Demo Platform</text>

  <!-- Frontend row -->
  <rect x="60" y="180" width="160" height="60" rx="8" fill="#FFF0F0" stroke="#EE0000" stroke-width="1"/>
  <text x="140" y="203" text-anchor="middle" font-size="11" font-weight="600" fill="#CC0000">Partner Portal</text>
  <text x="140" y="219" text-anchor="middle" font-size="9" fill="#6A6E73">React • Branding • Catalog</text>
  <text x="140" y="233" text-anchor="middle" font-size="9" fill="#6A6E73">25 demos • Launch</text>

  <rect x="230" y="180" width="160" height="60" rx="8" fill="#FFF0F0" stroke="#EE0000" stroke-width="1"/>
  <text x="310" y="203" text-anchor="middle" font-size="11" font-weight="600" fill="#CC0000">Admin Dashboard</text>
  <text x="310" y="219" text-anchor="middle" font-size="9" fill="#6A6E73">Sessions • Tenants</text>
  <text x="310" y="233" text-anchor="middle" font-size="9" fill="#6A6E73">Persistent • Reports</text>

  <rect x="400" y="180" width="160" height="60" rx="8" fill="#FFF0F0" stroke="#EE0000" stroke-width="1"/>
  <text x="480" y="203" text-anchor="middle" font-size="11" font-weight="600" fill="#CC0000">Demo Frontend</text>
  <text x="480" y="219" text-anchor="middle" font-size="9" fill="#6A6E73">10 demo pages</text>
  <text x="480" y="233" text-anchor="middle" font-size="9" fill="#6A6E73">Runtime page filtering</text>

  <rect x="570" y="180" width="175" height="60" rx="8" fill="#E8F4FD" stroke="#0068B5" stroke-width="1"/>
  <text x="657" y="203" text-anchor="middle" font-size="11" font-weight="600" fill="#004A8F">Inference Gateway</text>
  <text x="657" y="219" text-anchor="middle" font-size="9" fill="#6A6E73">Model routing policy</text>
  <text x="657" y="233" text-anchor="middle" font-size="9" fill="#6A6E73">Gaudi / Xeon / CPU</text>

  <!-- Backend -->
  <rect x="60" y="260" width="520" height="140" rx="8" fill="#F8F8F8" stroke="#D2D2D2" stroke-width="1.5"/>
  <text x="320" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#151515">Backend API (FastAPI)</text>

  <rect x="75" y="293" width="150" height="45" rx="6" fill="white" stroke="#D2D2D2"/>
  <text x="150" y="312" text-anchor="middle" font-size="10" font-weight="600" fill="#151515">Lifecycle Engine</text>
  <text x="150" y="327" text-anchor="middle" font-size="9" fill="#6A6E73">17-state machine</text>

  <rect x="235" y="293" width="150" height="45" rx="6" fill="white" stroke="#D2D2D2"/>
  <text x="310" y="312" text-anchor="middle" font-size="10" font-weight="600" fill="#151515">Provisioning</text>
  <text x="310" y="327" text-anchor="middle" font-size="9" fill="#6A6E73">Self-svc • Workshop</text>

  <rect x="395" y="293" width="170" height="45" rx="6" fill="white" stroke="#D2D2D2"/>
  <text x="480" y="312" text-anchor="middle" font-size="10" font-weight="600" fill="#151515">Security</text>
  <text x="480" y="327" text-anchor="middle" font-size="9" fill="#6A6E73">SSO • Limits • Creds</text>

  <rect x="75" y="348" width="490" height="40" rx="6" fill="#F0F0F0" stroke="#D2D2D2"/>
  <text x="320" y="367" text-anchor="middle" font-size="10" font-weight="600" fill="#151515">Adapters:  Mock  │  Local  │  OpenShift  │  RHDP  │  AAP</text>
  <text x="320" y="381" text-anchor="middle" font-size="9" fill="#6A6E73">420 tests • TDD red/green • CI green</text>

  <!-- PostgreSQL -->
  <rect x="600" y="290" width="145" height="50" rx="8" fill="#E8F0E8" stroke="#3E8635" stroke-width="1"/>
  <text x="672" y="311" text-anchor="middle" font-size="11" font-weight="600" fill="#2E6B2E">PostgreSQL</text>
  <text x="672" y="328" text-anchor="middle" font-size="9" fill="#6A6E73">Sessions • Plans</text>

  <!-- Bottom row: Showroom, AgnosticV, Helm -->
  <rect x="60" y="410" width="220" height="50" rx="8" fill="#FFF8E1" stroke="#F0AB00" stroke-width="1"/>
  <text x="170" y="431" text-anchor="middle" font-size="11" font-weight="600" fill="#996600">Showroom Content</text>
  <text x="170" y="448" text-anchor="middle" font-size="9" fill="#6A6E73">12 AsciiDoc pages</text>

  <rect x="295" y="410" width="200" height="50" rx="8" fill="#FFF8E1" stroke="#F0AB00" stroke-width="1"/>
  <text x="395" y="431" text-anchor="middle" font-size="11" font-weight="600" fill="#996600">AgnosticV Configs</text>
  <text x="395" y="448" text-anchor="middle" font-size="9" fill="#6A6E73">12 tenant + cluster</text>

  <rect x="510" y="410" width="235" height="50" rx="8" fill="#FFF8E1" stroke="#F0AB00" stroke-width="1"/>
  <text x="627" y="431" text-anchor="middle" font-size="11" font-weight="600" fill="#996600">Tenant Helm Chart</text>
  <text x="627" y="448" text-anchor="middle" font-size="9" fill="#6A6E73">Frontend • GW • PG • NetworkPolicy</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- STARGATE BOX -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="850" y="130" width="410" height="510" rx="12" fill="white" stroke="#6B21A8" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="850" y="130" width="410" height="34" rx="12" fill="url(#stargate)"/>
  <rect x="850" y="153" width="410" height="11" fill="url(#stargate)"/>
  <text x="1055" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="white">STARGATE — AI Operations</text>

  <rect x="870" y="180" width="370" height="50" rx="8" fill="#F5F0FF" stroke="#6B21A8" stroke-width="1"/>
  <text x="1055" y="201" text-anchor="middle" font-size="11" font-weight="600" fill="#4C1D95">LLM-Powered Cluster Monitoring</text>
  <text x="1055" y="217" text-anchor="middle" font-size="9" fill="#6A6E73">Namespace health • Pod status • Route accessibility</text>

  <rect x="870" y="240" width="370" height="50" rx="8" fill="#F5F0FF" stroke="#6B21A8" stroke-width="1"/>
  <text x="1055" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#4C1D95">Failure Classification (Rubrics)</text>
  <text x="1055" y="277" text-anchor="middle" font-size="9" fill="#6A6E73">Named failure classes • LLM analysis • Evidence bundles</text>

  <rect x="870" y="300" width="370" height="50" rx="8" fill="#F5F0FF" stroke="#6B21A8" stroke-width="1"/>
  <text x="1055" y="321" text-anchor="middle" font-size="11" font-weight="600" fill="#4C1D95">Risk-Gated Remediation</text>
  <text x="1055" y="337" text-anchor="middle" font-size="9" fill="#6A6E73">Low → auto  │  Medium → approval  │  High → blocked</text>

  <rect x="870" y="360" width="370" height="50" rx="8" fill="#F5F0FF" stroke="#6B21A8" stroke-width="1"/>
  <text x="1055" y="381" text-anchor="middle" font-size="11" font-weight="600" fill="#4C1D95">Launchpad Remediation Catalog</text>
  <text x="1055" y="397" text-anchor="middle" font-size="9" fill="#6A6E73">reclaim_session • release_placement • reclaim_workshop</text>

  <rect x="870" y="420" width="370" height="50" rx="8" fill="#F5F0FF" stroke="#6B21A8" stroke-width="1"/>
  <text x="1055" y="441" text-anchor="middle" font-size="11" font-weight="600" fill="#4C1D95">Audit + Evidence Trail</text>
  <text x="1055" y="457" text-anchor="middle" font-size="9" fill="#6A6E73">Every action recorded • Compliance ready</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- INTEGRATION ARROWS (between the two boxes, clear gap) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <line x1="760" y1="205" x2="850" y2="205" stroke="#6B21A8" stroke-width="2.5" stroke-dasharray="6,3"/>
  <rect x="773" y="188" width="65" height="22" rx="11" fill="#6B21A8"/>
  <text x="805" y="203" text-anchor="middle" font-size="8" font-weight="600" fill="white">PRE-FLIGHT</text>

  <line x1="760" y1="265" x2="850" y2="265" stroke="#6B21A8" stroke-width="2.5"/>
  <rect x="773" y="248" width="65" height="22" rx="11" fill="#6B21A8"/>
  <text x="805" y="263" text-anchor="middle" font-size="8" font-weight="600" fill="white">EVIDENCE</text>

  <line x1="760" y1="325" x2="850" y2="325" stroke="#C9190B" stroke-width="2.5"/>
  <rect x="770" y="308" width="72" height="22" rx="11" fill="#C9190B"/>
  <text x="806" y="323" text-anchor="middle" font-size="8" font-weight="600" fill="white">CATCH FAIL</text>

  <line x1="850" y1="385" x2="760" y2="385" stroke="#3E8635" stroke-width="2.5" stroke-dasharray="6,3"/>
  <rect x="773" y="370" width="65" height="22" rx="11" fill="#3E8635"/>
  <text x="805" y="385" text-anchor="middle" font-size="8" font-weight="600" fill="white">CALLBACK</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- EXTERNAL SERVICES (bottom row, well spaced) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="40" y="680" width="210" height="70" rx="8" fill="white" stroke="#D2D2D2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="706" text-anchor="middle" font-size="11" font-weight="600" fill="#151515">RHDP Sandbox API</text>
  <text x="145" y="722" text-anchor="middle" font-size="9" fill="#6A6E73">12 CNV clusters</text>
  <text x="145" y="736" text-anchor="middle" font-size="9" fill="#6A6E73">Namespace provisioning</text>

  <rect x="280" y="680" width="210" height="70" rx="8" fill="white" stroke="#D2D2D2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="706" text-anchor="middle" font-size="11" font-weight="600" fill="#151515">ArgoCD (GitOps)</text>
  <text x="385" y="722" text-anchor="middle" font-size="9" fill="#6A6E73">tenant/bootstrap/ Helm</text>
  <text x="385" y="736" text-anchor="middle" font-size="9" fill="#6A6E73">Per-demo deployment</text>

  <rect x="520" y="680" width="210" height="70" rx="8" fill="white" stroke="#D2D2D2" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="625" y="706" text-anchor="middle" font-size="11" font-weight="600" fill="#6A6E73">AAP Controller</text>
  <text x="625" y="722" text-anchor="middle" font-size="9" fill="#6A6E73">Client built, v4.5</text>
  <text x="625" y="736" text-anchor="middle" font-size="9" fill="#6A6E73">Not wired yet (Phase 2)</text>

  <rect x="760" y="680" width="250" height="70" rx="8" fill="white" stroke="#0068B5" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="706" text-anchor="middle" font-size="11" font-weight="600" fill="#004A8F">LiteMaaS (LiteLLM)</text>
  <text x="885" y="722" text-anchor="middle" font-size="9" fill="#6A6E73">5 models • Per-tenant virtual keys</text>
  <text x="885" y="736" text-anchor="middle" font-size="9" fill="#6A6E73">Granite • Llama • DeepSeek • Phi • Qwen</text>

  <rect x="1040" y="680" width="220" height="70" rx="8" fill="url(#intel)" filter="url(#shadow)"/>
  <text x="1150" y="706" text-anchor="middle" font-size="11" font-weight="700" fill="white">Intel Hardware</text>
  <text x="1150" y="722" text-anchor="middle" font-size="10" fill="#B0D4F1">Gaudi 3 — 24 cards</text>
  <text x="1150" y="736" text-anchor="middle" font-size="10" fill="#B0D4F1">Xeon 6 — CPU inference</text>

  <!-- Connection lines (vertical, no crossing) -->
  <line x1="145" y1="490" x2="145" y2="680" stroke="#D2D2D2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="385" y1="460" x2="385" y2="680" stroke="#D2D2D2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="625" y1="388" x2="625" y2="680" stroke="#D2D2D2" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="657" y1="240" x2="885" y2="680" stroke="#0068B5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="885" y1="750" x2="1150" y2="750" stroke="#0068B5" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="650" y="800" text-anchor="middle" font-size="11" fill="#6A6E73">422 tests • 28 local E2E • CI green • Branch protection • Secret scanning • Push protection</text>
  <text x="650" y="820" text-anchor="middle" font-size="10" fill="#6A6E73">Launchpad creates and destroys. StarGate observes and heals. Clear separation. Zero overlap.</text>

  <!-- Legend -->
  <rect x="40" y="850" width="1220" height="55" rx="8" fill="#F8F8F8" stroke="#D2D2D2"/>
  <text x="65" y="875" font-size="10" font-weight="600" fill="#151515">Integration:</text>
  <line x1="150" y1="871" x2="195" y2="871" stroke="#6B21A8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="200" y="875" font-size="9" fill="#6A6E73">Pre-flight / Callback</text>
  <line x1="340" y1="871" x2="385" y2="871" stroke="#6B21A8" stroke-width="2"/>
  <text x="390" y="875" font-size="9" fill="#6A6E73">Evidence</text>
  <line x1="460" y1="871" x2="505" y2="871" stroke="#C9190B" stroke-width="2"/>
  <text x="510" y="875" font-size="9" fill="#6A6E73">Failure catch</text>
  <line x1="600" y1="871" x2="645" y2="871" stroke="#3E8635" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="650" y="875" font-size="9" fill="#6A6E73">Success callback</text>

  <line x1="780" y1="871" x2="825" y2="871" stroke="#D2D2D2" stroke-width="1.5" stroke-dasharray="3,5"/>
  <text x="830" y="875" font-size="9" fill="#6A6E73">Phase 2 (client built, not wired)</text>

  <text x="65" y="895" font-size="10" font-weight="600" fill="#151515">Degradation:</text>
  <text x="165" y="895" font-size="9" fill="#6A6E73">StarGate down → Launchpad works alone</text>
  <text x="520" y="895" font-size="9" fill="#6A6E73">Launchpad down → StarGate monitors independently</text>
</svg>
