openapi: 3.1.0
info:
  title: Launchpad Artifact Destination Qualification
  version: 1.0.0
  description: >-
    Evidence contract for qualifying one immutable image on one execution
    cluster. Recording a receipt does not make it valid; every required check
    must pass the policy evaluator.
paths: {}
components:
  schemas:
    Check:
      type: object
      required: [status, evidence]
      properties:
        status: {type: string, enum: [passed, failed]}
        evidence:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
    DestinationQualification:
      type: object
      required:
        - schema_version
        - cluster_id
        - observed_at
        - image
        - architecture
        - checks
      properties:
        schema_version:
          const: launchpad.redhat.com/artifact-destination-qualification/v1
        cluster_id: {type: string, minLength: 1}
        observed_at: {type: string, format: date-time}
        image:
          type: string
          pattern: '^[^[:space:]@]+@sha256:[0-9a-f]{64}$'
        architecture: {type: string, minLength: 1}
        checks:
          type: object
          required:
            - credential
            - certificate
            - architecture
            - signature
            - exact_digest
            - cold_pull
            - cache_loss
          additionalProperties: false
          properties:
            credential: {$ref: '#/components/schemas/Check'}
            certificate: {$ref: '#/components/schemas/Check'}
            architecture: {$ref: '#/components/schemas/Check'}
            signature: {$ref: '#/components/schemas/Check'}
            exact_digest: {$ref: '#/components/schemas/Check'}
            cold_pull: {$ref: '#/components/schemas/Check'}
            cache_loss: {$ref: '#/components/schemas/Check'}
