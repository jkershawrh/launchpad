  - id: TEST-AUDIT-INTEGRITY-PENDING
    status: planned
    evidence: [docs/product-delivery-roadmap.md]
  - id: TEST-BREAKGLASS-PENDING
    status: planned
    evidence: [docs/product-delivery-roadmap.md]

unresolved_risks:
  - id: RISK-PUBLIC-BROWSER
    severity: high
    owner: identity-service-owner
    statement: Dedicated staging tunnel and full external browser abuse certification are not complete.
    decision_gate: public edge GREEN-live certification
    verification_plan: Run claim, rotation, expiry, resume, and connector-failure abuse journeys through a dedicated staging tunnel.
  - id: RISK-CLUSTER-CREDENTIAL-ROTATION
    severity: high
    owner: execution-fleet-owner
    statement: Per-cluster credential rotation and revocation have not been certified across the fleet.
    decision_gate: execution fleet production readiness
    verification_plan: Rotate each staging credential, prove old-token denial, and prove unaffected in-flight lifecycle recovery.
  - id: RISK-ARTIFACT-SIGNING
    severity: high
    owner: catalog-release-owner
    statement: Signing identity, SBOM, provenance verification, and destination cold-pull qualification remain open.
    decision_gate: catalog promotion beyond integration
    verification_plan: Promote one signed candidate with SBOM and provenance, then verify exact digest on cold nodes in every target cluster.
  - id: RISK-MODEL-TOOL-ABUSE
    severity: high
    owner: ai-service-owner
    statement: Prompt, RAG, MCP-tool, model-routing, and egress abuse tests are incomplete.
    decision_gate: governed model plane production readiness
    verification_plan: Execute adversarial prompt/tool suites with tenant isolation, policy denial, and audit evidence.
  - id: RISK-AUDIT-RETENTION
    severity: high
    owner: security-operations-owner
    statement: Audit retention, immutability, export, deletion, and incident evidence procedures are not certified.
    decision_gate: security and compliance production review
    verification_plan: Define retention and deletion policy, inject tamper/replay failures, and prove durable evidence recovery.
  - id: RISK-SUPPORT-BREAKGLASS
    severity: high
    owner: launchpad-security-owner
    statement: Named support roles, step-up, time-bounded break-glass access, and revocation evidence are not implemented.
    decision_gate: supported production service
    verification_plan: Implement approval-bound access and certify grant, use, audit, expiry, and emergency revocation.

release_policy:
  block_on_unresolved_severity: [critical, high]
  structural_validation_stage: GREEN-local
  production_requires_independent_review: true
