openapi: 3.1.0
info:
  title: Launchpad Event Ordering Schedule
  version: 1.1.0
  description: >-
    Offline, manifest-bound planning proof for serial workshop order windows.
    A passing schedule does not reserve seats, authorize capacity reuse, or
    replace live admission checks.
paths: {}
components:
  schemas:
    EventOrderWindow:
      type: object
      additionalProperties: false
      required: [cohort_id, lab_ref, not_before, not_after]
      properties:
        cohort_id: {type: string, minLength: 1}
        lab_ref: {type: string, minLength: 1}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
    EventOrderSchedule:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_id
        - manifest_digest
        - policy
        - approved_by
        - approved_at
        - windows
      properties:
        schema_version: {const: launchpad.intel.com/event-order-schedule/v1}
        event_id: {type: string, minLength: 1}
        manifest_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        policy: {const: serial_per_event}
        approved_by:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: {type: string, minLength: 1}
        approved_at: {type: string, format: date-time}
        windows:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventOrderWindow'}
    EventOrderScheduleDecision:
      type: object
      required:
        - status
        - eligible
        - event_id
        - manifest_digest
        - schedule_digest
        - workshop_count
        - seat_environments
        - failures
      properties:
        status: {type: string, enum: [RED, GREEN-local]}
        eligible: {type: boolean}
        event_id: {type: string}
        manifest_digest: {type: string}
        schedule_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        workshop_count: {type: integer, minimum: 1}
        seat_environments: {type: integer, minimum: 1}
        failures:
          type: array
          items: {type: string}
