openapi: 3.1.0
info:
  title: Launchpad Destination Pre-pull Evidence Verification
  version: 1.0.0
  description: >-
    Offline, local-only verifier layered on event-artifact-prepull-attestation/v1.
    It hashes bounded proof artifacts and checks a separately sourced, fresh,
    complete eligible-node snapshot. It neither performs pulls nor authorizes
    event admission.
paths: {}
components:
  schemas:
    EligibleNodeSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, cluster_ref, source_id, observed_at, complete, resource_version, node_ids]
      properties:
        schema_version: {const: launchpad.redhat.com/eligible-node-snapshot/v1}
        cluster_ref: {type: string, minLength: 1}
        source_id: {type: string, minLength: 1}
        observed_at: {type: string, format: date-time}
        complete: {const: true}
        resource_version: {type: string, minLength: 1}
        node_ids:
          type: array
          minItems: 1
          maxItems: 1024
          uniqueItems: true
          items: {type: string, minLength: 1}
      description: >-
        Supplied by an independently authenticated inventory adapter, not by
        the pre-pull producer or an order body. Source identity is pinned by
        trusted cluster configuration. Observed within five minutes of check,
        never future-dated, and within the immutable plan window.
    NodeProof:
      type: object
      additionalProperties: false
      required: [schema_version, plan_id, cluster_ref, image, node_id, producer_id, observed_at, mirror_source, cache_state, digest_verified, signature_verified, pull_authenticated]
      properties:
        schema_version: {const: launchpad.redhat.com/event-artifact-node-proof/v1}
        plan_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        cluster_ref: {type: string, minLength: 1}
        image: {type: string, pattern: '^[^\s@]+@sha256:[0-9a-f]{64}$'}
        node_id: {type: string, minLength: 1}
        producer_id: {type: string, minLength: 1}
        observed_at: {type: string, format: date-time}
        mirror_source: {type: string, minLength: 1}
        cache_state: {const: present}
        digest_verified: {const: true}
        signature_verified: {const: true}
        pull_authenticated: {const: true}
      description: >-
        UTF-8 JSON bytes, at most 65536 bytes, content-addressed by the exact
        node claim's evidence_sha256. Every field must match the authenticated
        claim and immutable plan. Duplicate JSON keys are rejected.
    VerificationStatus:
      type: object
      additionalProperties: false
      required: [schema_version, plan_id, status, eligible, verified_node_proofs, failures]
      properties:
        schema_version: {const: launchpad.redhat.com/event-artifact-prepull-evidence-status/v1}
        plan_id: {type: [string, 'null']}
        status: {enum: [GREEN-local, RED]}
        eligible: {type: boolean}
        verified_node_proofs: {type: integer, minimum: 0}
        failures:
          type: array
          items: {type: string}
