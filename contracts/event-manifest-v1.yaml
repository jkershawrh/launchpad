openapi: 3.1.0
info:
  title: Launchpad Event Manifest Contract
  version: 1.5.0
  description: >-
    Defines an event before capacity is reserved. Participant count, cohorts,
    labs per participant, retention, exposure, certified capacity, and human
    approval are explicit so that a participant count cannot be mistaken for
    the number of seat-environments.
paths:
  /api/v1/events/capacity-preview:
    post:
      operationId: previewEventCapacity
      summary: Calculate event capacity without creating workshops or seats.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventManifest'}
      responses:
        '200':
          description: Calculated demand and certified-capacity decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventCapacityPreview'}
        '409':
          description: No certified placement plan can satisfy the event.
  /api/v1/events:
    post:
      operationId: createApprovedEvent
      summary: Persist an approved manifest before capacity reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventManifest'}
      responses:
        '201':
          description: Approved event manifest and certified-capacity decision persisted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecord'}
        '400': {description: Manifest is incomplete or calculations disagree.}
        '409': {description: Approval or certified capacity is insufficient.}
components:
  schemas:
    EventManifest:
      type: object
      additionalProperties: false
      required:
        - event_id
        - name
        - owner
        - technical_approver
        - cohorts
        - labs
        - retention
        - exposure_policy
        - placement_policy
        - approval
      properties:
        event_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        technical_approver: {type: string, minLength: 1}
        exposure_policy: {type: string, enum: [internal, public_code]}
        placement_policy:
          type: string
          enum: [single_cluster_per_workshop]
        cohorts:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventCohort'}
        labs:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventLab'}
        retention: {$ref: '#/components/schemas/EventRetention'}
        approval: {$ref: '#/components/schemas/EventApproval'}
    EventCohort:
      type: object
      additionalProperties: false
      required: [cohort_id, participants, lab_refs]
      properties:
        cohort_id: {type: string, minLength: 1}
        participants: {type: integer, minimum: 1}
        starts_at: {type: string, format: date-time}
        lab_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
    EventLab:
      type: object
      additionalProperties: false
      required: [lab_ref, catalog_id, catalog_release]
      properties:
        lab_ref: {type: string, minLength: 1}
        catalog_id: {type: string, minLength: 1}
        catalog_release: {type: string, minLength: 1}
        required_capabilities:
          type: array
          uniqueItems: true
          items: {type: string}
        required_models:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
    EventRetention:
      type: object
      additionalProperties: false
      required: [hours, starts_from]
      properties:
        hours: {type: integer, minimum: 1}
        starts_from: {type: string, enum: [event_start, cohort_start, claim]}
    EventApproval:
      type: object
      additionalProperties: false
      required:
        - event_owner_approved
        - technical_approver_approved
        - approved_seat_environments
        - approved_retention_hours
      properties:
        event_owner_approved: {type: boolean}
        technical_approver_approved: {type: boolean}
        approved_seat_environments: {type: integer, minimum: 1}
        approved_retention_hours: {type: integer, minimum: 1}
        approved_at: {type: string, format: date-time}
    EventCapacityPreview:
      type: object
      additionalProperties: false
      required:
        - matrix_id
        - matrix_digest
        - fleet_snapshot_id
        - fleet_observed_at
        - participant_count
        - seat_environments
        - peak_concurrent_participants
        - peak_retained_environments
        - certified_capacity
        - dr_reserved_capacity
        - uncertified_capacity
        - capacity_shortfall
        - eligible
        - explanation
        - allocations
        - lab_capacity
      properties:
        matrix_id: {type: string, minLength: 1}
        matrix_digest: {type: string, minLength: 1}
        fleet_snapshot_id: {type: string, minLength: 1}
        fleet_observed_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: 'null'}
        participant_count: {type: integer, minimum: 1}
        seat_environments: {type: integer, minimum: 1}
        peak_concurrent_participants: {type: integer, minimum: 1}
        peak_retained_environments: {type: integer, minimum: 1}
        certified_capacity: {type: integer, minimum: 0}
        dr_reserved_capacity: {type: integer, minimum: 0}
        uncertified_capacity: {type: integer, minimum: 0}
        capacity_shortfall: {type: integer, minimum: 0}
        eligible: {type: boolean}
        explanation: {type: string, minLength: 1}
        allocations:
          type: array
          items: {$ref: '#/components/schemas/EventCapacityAllocation'}
        lab_capacity:
          type: array
          items: {$ref: '#/components/schemas/EventLabCapacityDecision'}
    EventCatalogCapacity:
      type: object
      additionalProperties: false
      required: [catalog_id, catalog_release, certified_seats, resources_per_seat]
      properties:
        catalog_id: {type: string, minLength: 1}
        catalog_release: {type: string, minLength: 1}
        certified_seats: {type: integer, minimum: 0}
        required_models:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        resources_per_seat: {$ref: '#/components/schemas/EventResourceVector'}
    EventClusterCapacity:
      type: object
      additionalProperties: false
      required:
        - cluster_id
        - enabled
        - priority
        - exposure_policies
        - capabilities
        - certified_seats
        - dr_reserved_seats
        - uncertified_seats
        - resource_capacity
        - catalogs
      properties:
        cluster_id: {type: string, minLength: 1}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0}
        exposure_policies:
          type: array
          uniqueItems: true
          items: {type: string, enum: [internal, public_code]}
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string}
        certified_models:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        certified_seats: {type: integer, minimum: 0}
        dr_reserved_seats: {type: integer, minimum: 0}
        uncertified_seats: {type: integer, minimum: 0}
        resource_capacity: {$ref: '#/components/schemas/EventResourceVector'}
        catalogs:
          type: array
          items: {$ref: '#/components/schemas/EventCatalogCapacity'}
    EventCapacitySupply:
      type: object
      additionalProperties: false
      required:
        - matrix_id
        - matrix_digest
        - fleet_snapshot_id
        - fleet_observed_at
        - clusters
      properties:
        matrix_id: {type: string, minLength: 1}
        matrix_digest: {type: string, minLength: 1}
        fleet_snapshot_id: {type: string, minLength: 1}
        fleet_observed_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: 'null'}
        clusters:
          type: array
          items: {$ref: '#/components/schemas/EventClusterCapacity'}
    EventResourceVector:
      type: object
      additionalProperties: false
      required: [seats, cpu_millicores, memory_mib, pods, storage_gib, routes, model_slots]
      properties:
        seats: {type: integer, minimum: 0}
        cpu_millicores: {type: integer, minimum: 0}
        memory_mib: {type: integer, minimum: 0}
        pods: {type: integer, minimum: 0}
        storage_gib: {type: integer, minimum: 0}
        routes: {type: integer, minimum: 0}
        model_slots: {type: integer, minimum: 0}
    EventCapacityMatrixDocument:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - matrix_id
        - approved_by
        - approved_at
        - evidence_refs
        - clusters
      properties:
        schema_version:
          type: string
          enum: [launchpad.intel.com/event-capacity/v1]
        matrix_id: {type: string, minLength: 1}
        approved_by:
          type: array
          minItems: 2
          uniqueItems: true
          items: {type: string, minLength: 1}
        approved_at: {type: string, format: date-time}
        evidence_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        clusters:
          type: array
          items: {$ref: '#/components/schemas/EventClusterCapacity'}
    EventCapacityAllocation:
      type: object
      additionalProperties: false
      required: [cohort_id, lab_ref, catalog_id, catalog_release, cluster_id, seats]
      properties:
        cohort_id: {type: string, minLength: 1}
        lab_ref: {type: string, minLength: 1}
        catalog_id: {type: string, minLength: 1}
        catalog_release: {type: string, minLength: 1}
        cluster_id: {type: string, minLength: 1}
        seats: {type: integer, minimum: 1}
    EventLabCapacityDecision:
      type: object
      additionalProperties: false
      required:
        - lab_ref
        - catalog_id
        - catalog_release
        - required_seats
        - allocated_seats
        - shortfall
      properties:
        lab_ref: {type: string, minLength: 1}
        catalog_id: {type: string, minLength: 1}
        catalog_release: {type: string, minLength: 1}
        required_seats: {type: integer, minimum: 1}
        allocated_seats: {type: integer, minimum: 0}
        shortfall: {type: integer, minimum: 0}
    EventRecord:
      type: object
      additionalProperties: false
      required: [manifest, capacity_preview, created_at]
      properties:
        manifest: {$ref: '#/components/schemas/EventManifest'}
        capacity_preview: {$ref: '#/components/schemas/EventCapacityPreview'}
        created_at: {type: string, format: date-time}
