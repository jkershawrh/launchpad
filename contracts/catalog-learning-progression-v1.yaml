api_version: launchpad.redhat.com/catalog-learning-progression/v1
levels:
  "001":
    name: Explore
    description: Orientation, demonstrations, and open exploration with no prerequisite.
  "101":
    name: Learn
    description: Learn one foundational capability through a guided outcome.
  "201":
    name: Build
    description: Assemble and validate a working AI solution.
  "301":
    name: Engineer
    description: Integrate systems, protocols, evidence, and failure controls.
  "401":
    name: Operate
    description: Operate, observe, govern, and recover production-style AI systems.
  "501":
    name: Scale
    description: Scale, upgrade, secure, recover, and certify a production architecture.
    publication_gate: certified
canonical_blueprint: red-hat-intel-agentic-v1
journey_roles:
  core: The recommended progression that incrementally builds the canonical blueprint.
  specialty: A bounded domain, platform, data, or reliability episode that branches from and may return to the core journey.
  reference: Retained implementation knowledge that is not part of the recommended learner path.
specialty_families:
  - domain
  - platform
  - data
  - inference
  - tooling
  - reliability
solution_families:
  platform_foundations: OpenShift, sandbox, and platform-building experiences.
  inference: Model serving, hardware placement, and inference optimization.
  generative_ai: Generative AI, retrieval, grounding, and content workflows.
  agentic_ai: Tool-using agents, multi-agent systems, and open agent protocols.
  operations_reliability: Observability, policy, resilience, scale, and certification.
  industry_solutions: Domain-specific applications of the shared architecture.
  platform_validation: Internal platform verification rather than a learner journey.
required_metadata:
  - learning_level
  - learning_stage
  - experience_type
  - prerequisites
  - recommended_next_items
  - journey_role
  - specialty_family
  - branches_from
  - returns_to
  - shared_blueprint
  - solution_family
compatibility:
  catalog_ids_are_stable: true
  runtime_release_versions_unchanged_by_taxonomy: true
  absent_metadata_behavior: unclassified
