api_version: launchpad.redhat.com/catalog-learning-progression/v1
levels:
  "001":
    name: Explore
    description: Orientation, demonstrations, and open exploration with no prerequisite.
  "101":
    name: Learn
    description: Learn one foundational capability through a guided outcome.
  "201":
    name: Build
    description: Assemble and validate a working AI solution.
  "301":
    name: Engineer
    description: Integrate systems, protocols, evidence, and failure controls.
  "401":
    name: Operate
    description: Operate, observe, govern, and recover production-style AI systems.
  "501":
    name: Scale
    description: Scale, upgrade, secure, recover, and certify a production architecture.
    publication_gate: certified
  "601":
    name: Qualify
    description: Prove governed autonomy and earn the right for an agentic system to act.
    publication_gate: certified
learning_tracks:
  agentic_ai:
    label: Agentic AI
    entries:
      "101": {title: Understand Agentic Workflows, lifecycle: planned}
      "201": {title: Build an AI Agent on Intel Xeon 6, lifecycle: draft, catalog_id: intel-xeon6-agent-201}
      "301": {title: Build Multi-Agent Systems, lifecycle: draft, catalog_id: multi-agent-quickstart}
      "401": {title: Operate Evidence-Backed Agents, lifecycle: draft, catalog_id: operate-agentic-blueprint}
      "501": {title: Scale and Certify Agentic Systems, lifecycle: draft, catalog_id: scale-agentic-blueprint}
      "601": {title: Earn the Right to Act, lifecycle: draft, catalog_id: agentic-ai-601}
  sovereign_ai:
    label: Sovereign AI
    entries:
      "101": {title: Understand Sovereign AI, lifecycle: draft, catalog_id: sovereign-ai-101}
      "201": {title: Build a Governed Sovereign Workload, lifecycle: draft, catalog_id: sovereign-ai-201}
      "301": {title: Govern Models, Data, and Agents, lifecycle: draft, catalog_id: sovereign-ai-301}
      "401": {title: Confidential AI with Intel TDX, lifecycle: draft, catalog_id: sovereign-ai-401}
      "501": {title: Prove and Certify Sovereign AI, lifecycle: draft, catalog_id: sovereign-ai-501}
  virtualization_ai:
    label: Virtualization + AI
    entries:
      "101": {title: Understand VM and AI Coexistence, lifecycle: draft, catalog_id: virtualization-ai-foundations-101}
      "201": {title: Connect a VM to AI, lifecycle: draft, catalog_id: virtualization-ai-201}
      "301": {title: Modernize VMs with AI, lifecycle: draft, catalog_id: virtualization-ai-301}
      "401": {title: Operate Hybrid VM and AI Workloads, lifecycle: active, catalog_id: virtualization-ai-401}
      "501": {title: Scale Governed AI Modernization, lifecycle: draft, catalog_id: virtualization-ai-501}
track_rules:
  missing_entry_behavior: not_offered
  planned_entries_are_orderable: false
  draft_entries_are_orderable: false
  active_entries_require_current_certification: true
  sales_enablement_is_a_separate_persona_axis: true
  sales_track_titles: pending_product_owner_definition
canonical_blueprint: red-hat-intel-agentic-v1
canonical_blueprints:
  agentic_ai: red-hat-intel-agentic-v1
  sovereign_ai: red-hat-intel-sovereign-ai-v1
  virtualization_ai: red-hat-intel-virtualization-ai-v1
journey_roles:
  core: The recommended progression that incrementally builds the canonical blueprint.
  specialty: A bounded domain, platform, data, or reliability episode that branches from and may return to the core journey.
  reference: Retained implementation knowledge that is not part of the recommended learner path.
specialty_families:
  - domain
  - platform
  - data
  - inference
  - tooling
  - reliability
solution_families:
  platform_foundations: OpenShift, sandbox, and platform-building experiences.
  inference: Model serving, hardware placement, and inference optimization.
  generative_ai: Generative AI, retrieval, grounding, and content workflows.
  agentic_ai: Tool-using agents, multi-agent systems, and open agent protocols.
  sovereign_ai: Governed, confidential, and jurisdiction-aware AI workloads.
  virtualization_ai: Virtual-machine and AI coexistence, modernization, and operations.
  operations_reliability: Observability, policy, resilience, scale, and certification.
  industry_solutions: Domain-specific applications of the shared architecture.
  platform_validation: Internal platform verification rather than a learner journey.
required_metadata:
  - learning_level
  - learning_stage
  - experience_type
  - prerequisites
  - recommended_next_items
  - journey_role
  - specialty_family
  - branches_from
  - returns_to
  - shared_blueprint
  - solution_family
compatibility:
  catalog_ids_are_stable: true
  runtime_release_versions_unchanged_by_taxonomy: true
  absent_metadata_behavior: unclassified
