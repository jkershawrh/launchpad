api_version: launchpad.redhat.com/agentic-scale-certification/v1
contract_id: red-hat-intel-agentic-scale-v1
blueprint_id: red-hat-intel-agentic-v1
catalog_item_id: scale-agentic-blueprint
purpose: >-
  Define the repeatable load, quality, policy, resilience, Intel Xeon, lifecycle,
  and evidence gates required to certify the agentic blueprint at scale.

truth_boundary:
  threshold_state: provisional_until_baseline_approved
  projected_results_are_not_live_results: true
  every_result_requires_source_state: true
  permitted_source_states: [live, rehearsal, offline, unavailable]
  certification_accepts_source_state: live
  threshold_changes_require:
    - contract_revision
    - rationale
    - reviewer
    - approval_timestamp

prerequisites:
  catalog_item: operate-agentic-blueprint
  required_state: certified
  required_contracts:
    - contracts/agentic-blueprint-v1.yaml
    - contracts/agentic-journey-telemetry-v1.yaml
    - contracts/agentic-scale-evaluation-set-v1.yaml

load_profiles:
  - id: baseline-one-seat
    seats: 1
    concurrent_journeys: 1
    minimum_completed_journeys: 10
    duration_minutes: 10
    required_consecutive_green_runs: 3
  - id: team-five-seat
    seats: 5
    concurrent_journeys: 5
    minimum_completed_journeys: 50
    duration_minutes: 15
    required_consecutive_green_runs: 3
  - id: event-twenty-five-seat
    seats: 25
    concurrent_journeys: 10
    minimum_completed_journeys: 250
    duration_minutes: 30
    required_consecutive_green_runs: 3

service_objectives:
  journey:
    minimum_success_rate_percent: 99
    maximum_p95_latency_ms: 90000
    maximum_error_rate_percent: 1
    maximum_uncorrelated_events: 0
  inference:
    maximum_p95_latency_ms: 30000
    maximum_timeout_rate_percent: 1
    maximum_queue_p95_ms: 5000
    token_measurement_required: true
  policy:
    required_evaluation_rate_percent: 100
    required_version_attribution_rate_percent: 100
    prohibited_action_execution_count: 0
  evidence:
    required_provenance_rate_percent: 100
    required_source_state_rate_percent: 100
    maximum_incomplete_evidence_decisions: 0
  lifecycle:
    maximum_ready_seconds: 900
    maximum_cleanup_seconds: 600
    zero_residue_required: true

quality_gate:
  evaluation_set:
    immutable_revision_required: true
    minimum_cases: 30
    domain_balance_required: true
    canonical_set: evaluation/agentic-scale-v1.yaml
  minimum_supported_decision_rate_percent: 95
  maximum_degradation_from_one_seat_percentage_points: 2
  deterministic_policy_agreement_percent: 100
  unsupported_claim_rate_percent: 0
  human_review_required_when_uncertain: true

intel_xeon_evidence:
  required_dimensions:
    - endpoint_identity
    - model_name
    - model_revision
    - cpu_model
    - cpu_allocation_cores
    - cpu_utilization_average_percent
    - cpu_utilization_peak_percent
    - inference_requests
    - input_tokens
    - output_tokens
    - inference_p50_ms
    - inference_p95_ms
    - queue_p95_ms
    - throughput_tokens_per_second
  provisional_capacity_guardrails:
    maximum_sustained_cpu_utilization_percent: 85
    maximum_peak_cpu_utilization_percent: 95
  attribution:
    journey_id_required: true
    session_id_required: true
    collection_timestamp_required: true
    approved_telemetry_source_required: true

resilience_scenarios:
  - id: agent-pod-loss
    fault: terminate_one_agent_replica
    expected_safe_state: bounded_retry_or_human_review
    maximum_recovery_seconds: 180
  - id: mcp-unavailable
    fault: make_one_evidence_source_unavailable
    expected_safe_state: no_supported_decision_without_required_evidence
    maximum_recovery_seconds: 180
  - id: inference-timeout
    fault: exceed_inference_timeout
    expected_safe_state: no_action_and_visible_failure
    maximum_recovery_seconds: 300
  - id: policy-denial
    fault: submit_prohibited_action
    expected_safe_state: deterministic_denial_and_audit_event
    maximum_recovery_seconds: 0
  - id: overload-backpressure
    fault: exceed_declared_concurrency
    expected_safe_state: bounded_queue_or_explicit_rate_limit
    maximum_recovery_seconds: 300
  - id: evidence-incomplete
    fault: omit_required_provenance
    expected_safe_state: inconclusive_or_human_review
    maximum_recovery_seconds: 0

evidence_package:
  required_identity:
    - contract_id
    - contract_revision
    - catalog_revision
    - workload_image_digest
    - content_revision
    - cluster_id
    - run_id
    - started_at
    - completed_at
  required_results:
    - load_profile
    - journey_metrics
    - inference_metrics
    - quality_results
    - policy_results
    - resilience_results
    - lifecycle_results
    - zero_residue_results
  integrity:
    sha256_manifest_required: true
    immutable_raw_evidence_required: true
    reviewer_identity_required: true
    approval_timestamp_required: true
    secrets_and_sensitive_prompts_prohibited: true

promotion:
  sequence: [1, 5, 25]
  no_skipped_stages: true
  each_stage_requires_matching_profile_green: true
  publication_gate: certified
