openapi: 3.1.0
info: {title: Launchpad Public Access Contract, version: 1.0.0}
paths:
  /api/v1/public-access/claim:
    post:
      operationId: claimPublicSeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, email, code]
              properties:
                order_id: {type: string}
                email: {type: string, format: email, description: Unverified identity label}
                code: {type: string, writeOnly: true, description: Sole participant secret}
      responses:
        '200': {description: Seat assigned or recovered}
        '403': {description: Uniform denial with no participant or capacity disclosure}
  /api/v1/public-access/private/validate:
    post:
      operationId: validateForKeycloakAuthenticator
      security: [{brokerKey: []}]
      responses:
        '200': {description: Stable subject, username, seat and expiry}
        '403': {description: Uniform denial}
        '503': {description: Namespace authorization could not be granted; claim was revoked}
  /api/v1/public-access/private/validate-by-code:
    post:
      operationId: validateForClusterConsole
      description: Resolve the unique active order from its high-entropy code when the OpenShift OAuth callback host does not identify a lab.
      security: [{brokerKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: {type: string, format: email, description: Unverified identity label}
                code: {type: string, writeOnly: true}
      responses:
        '200': {description: Stable order, subject, username, seat and expiry}
        '403': {description: Uniform denial}
        '503': {description: Namespace authorization could not be granted; claim was revoked}
  /api/v1/public-access/admin/orders/{order_id}/public-url:
    patch:
      operationId: updatePilotPublicOrigin
      description: Admin-only audited replacement for direct database edits when a temporary pilot hostname changes.
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_url]
              properties:
                public_url: {type: string, format: uri, description: Bare HTTPS origin}
      responses:
        '200': {description: Updated public-order summary}
        '400': {description: Invalid origin or missing policy}
  /api/v1/public-access/admin/orders/{order_id}/console:
    patch:
      operationId: setPublicConsoleCanary
      description: Admin-only per-order gate for a separately certified public OpenShift Console path.
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean, default: false}
      responses:
        '200': {description: Updated public-order summary}
        '404': {description: Public order does not exist}
components:
  securitySchemes:
    brokerKey: {type: apiKey, in: header, name: X-Access-Broker-Key}
