openapi: 3.1.0
info:
  title: Launchpad Event Capacity Reservation Contract
  version: 1.0.0
  description: >-
    Defines the durable aggregate capacity hold created after event approval
    and before any workshop, seat, namespace, route, or model key is created.
paths:
  /api/v1/events/{event_id}/reservations:
    post:
      summary: Reserve approved event capacity
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventReservationCreate'}
      responses:
        '201':
          description: Atomic reservation plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventReservationPlan'}
        '409': {description: Capacity or evidence conflict}
        '503': {description: Durable persistence unavailable}
  /api/v1/events/{event_id}/reservations/release:
    post:
      summary: Release capacity after verified cleanup
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventReservationReleaseRequest'}
      responses:
        '200':
          description: Idempotent cleanup-evidenced release
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventReservationReleaseResult'}
        '409': {description: Conflicting cleanup evidence}
        '503': {description: Durable persistence unavailable}
components:
  schemas:
    EventReservationCreate:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at: {type: string, format: date-time}
    EventReservationReleaseRequest:
      type: object
      additionalProperties: false
      required: [cleanup_completed, cleanup_evidence_id]
      properties:
        cleanup_completed: {type: boolean, const: true}
        cleanup_evidence_id: {type: string, minLength: 1}
    EventReservationReleaseResult:
      type: object
      additionalProperties: false
      required: [event_id, released_reservations, cleanup_evidence_id]
      properties:
        event_id: {type: string, minLength: 1}
        released_reservations: {type: integer, minimum: 0}
        cleanup_evidence_id: {type: string, minLength: 1}
    EventResourceVector:
      type: object
      additionalProperties: false
      required: [seats, cpu_millicores, memory_mib, pods, storage_gib, routes, model_slots]
      properties:
        seats: {type: integer, minimum: 0}
        cpu_millicores: {type: integer, minimum: 0}
        memory_mib: {type: integer, minimum: 0}
        pods: {type: integer, minimum: 0}
        storage_gib: {type: integer, minimum: 0}
        routes: {type: integer, minimum: 0}
        model_slots: {type: integer, minimum: 0}
    EventCapacityReservation:
      type: object
      additionalProperties: false
      required:
        - reservation_id
        - event_id
        - cohort_id
        - lab_ref
        - catalog_id
        - catalog_release
        - cluster_ref
        - matrix_id
        - matrix_digest
        - fleet_snapshot_id
        - resources
        - status
        - expires_at
        - created_at
      properties:
        reservation_id: {type: string, minLength: 1}
        event_id: {type: string, minLength: 1}
        cohort_id: {type: string, minLength: 1}
        lab_ref: {type: string, minLength: 1}
        catalog_id: {type: string, minLength: 1}
        catalog_release: {type: string, minLength: 1}
        cluster_ref: {type: string, minLength: 1}
        matrix_id: {type: string, minLength: 1}
        matrix_digest: {type: string, minLength: 1}
        fleet_snapshot_id: {type: string, minLength: 1}
        resources: {$ref: '#/components/schemas/EventResourceVector'}
        status: {type: string, enum: [held, released, expired]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        released_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: 'null'}
        cleanup_evidence_id:
          oneOf:
            - {type: string, minLength: 1}
            - {type: 'null'}
    EventReservationPlan:
      type: object
      additionalProperties: false
      required:
        - event_id
        - matrix_id
        - matrix_digest
        - fleet_snapshot_id
        - expires_at
        - reservations
      properties:
        event_id: {type: string, minLength: 1}
        matrix_id: {type: string, minLength: 1}
        matrix_digest: {type: string, minLength: 1}
        fleet_snapshot_id: {type: string, minLength: 1}
        expires_at: {type: string, format: date-time}
        reservations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventCapacityReservation'}
