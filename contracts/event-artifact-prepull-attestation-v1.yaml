openapi: 3.1.0
info:
  title: Launchpad Destination Pre-pull Attestation
  version: 1.0.0
  description: >-
    Local verification contract for one HMAC-authenticated, per-node claim for
    each immutable event plan cluster/image pair. A valid MAC proves possession
    of a configured producer key, not that a Kubernetes observation occurred.
paths: {}
components:
  schemas:
    NodeClaim:
      type: object
      additionalProperties: false
      required: [node_id, cache_state, digest_verified, signature_verified, pull_authenticated, evidence_sha256]
      properties:
        node_id: {type: string, minLength: 1}
        cache_state: {const: present}
        digest_verified: {const: true}
        signature_verified: {const: true}
        pull_authenticated: {const: true}
        evidence_sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    Attestation:
      type: object
      additionalProperties: false
      required: [schema_version, plan_id, cluster_ref, image, producer_id, observed_at, mirror_source, nodes, mac]
      properties:
        schema_version: {const: launchpad.redhat.com/event-artifact-prepull-attestation/v1}
        plan_id: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        cluster_ref: {type: string, minLength: 1}
        image: {type: string, pattern: '^[^\s@]+@sha256:[0-9a-f]{64}$'}
        producer_id: {type: string, minLength: 1}
        observed_at: {type: string, format: date-time}
        mirror_source: {type: string, minLength: 1}
        nodes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/NodeClaim'}
        mac:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            HMAC-SHA256 over UTF-8 JSON of the other fields, sorted keys,
            compact separators, ASCII escapes, and no NaN values. The key is
            supplied out-of-band and bound to one cluster/producer identity.
