openapi: 3.1.0
info:
  title: Launchpad Event Workshop Orchestration Contract
  version: 1.4.0
  description: >-
    Consumes every approved event reservation into one deterministic workshop
    and queues one idempotent, cluster-bound lifecycle job per workshop. The
    API never provisions inside the request. Public access remains pending
    until a separate post-readiness activation returns instructor codes.
paths:
  /api/v1/events/{event_id}/reclaim/finalize:
    post:
      summary: Verify zero residue and release reserved event capacity
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Immutable cleanup evidence and reservation release result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventCleanupEvidenceResult'}
        '404': {description: Approved event was not found}
        '409': {description: Zero-residue cleanup is not proven}
        '503': {description: Durable cleanup evidence persistence is unavailable}
  /api/v1/events/{event_id}/reclaim:
    post:
      summary: Disable event access and queue cluster-bound workshop cleanup
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '202':
          description: Every event workshop reclaim job is queued idempotently
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWorkshopReclaimResult'}
        '404': {description: Approved event was not found}
        '409': {description: Reservation or workshop bindings are incomplete}
        '503': {description: Durable persistence or public access is unavailable}
  /api/v1/events/{event_id}/status:
    get:
      summary: Reconcile event reservations, lifecycle jobs, seats, and access
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Read-only event lifecycle status without instructor codes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventStatusResult'}
        '404': {description: Approved event was not found}
        '503': {description: Durable persistence is unavailable}
  /api/v1/events/{event_id}/workshops/launch:
    post:
      summary: Queue every workshop in an approved reserved event
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventWorkshopLaunchRequest'}
      responses:
        '202':
          description: All deterministic workshop lifecycle jobs are queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWorkshopLaunchResult'}
        '400': {description: Catalog or workshop input is invalid}
        '404': {description: Approved event was not found}
        '409': {description: Reservation plan is incomplete, expired, released, or conflicting}
        '503': {description: Durable persistence is unavailable}
  /api/v1/events/{event_id}/workshops/{workshop_id}/public-access:
    post:
      summary: Activate one ready public workshop and return its code once
      parameters:
        - in: path
          name: event_id
          required: true
          schema: {type: string, minLength: 1}
        - in: path
          name: workshop_id
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '201':
          description: Public URL and one-time instructor code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWorkshopPublicAccessResult'}
        '404': {description: Approved event was not found}
        '409': {description: Workshop is not ready, not public, or already activated}
        '503': {description: Public access persistence or configuration is unavailable}
components:
  schemas:
    EventCleanupWorkshopEvidence:
      type: object
      additionalProperties: false
      required:
        - reservation_id
        - workshop_id
        - lifecycle_job_id
        - cluster_ref
        - seats
        - sessions
        - external_residue
        - access_residue
        - residue
        - access
      properties:
        reservation_id: {type: string, minLength: 1}
        workshop_id: {type: string, minLength: 1}
        lifecycle_job_id: {type: string, minLength: 1}
        cluster_ref: {type: string, minLength: 1}
        seats: {type: integer, minimum: 1}
        sessions: {type: integer, minimum: 0}
        external_residue: {type: integer, minimum: 0}
        access_residue: {type: integer, minimum: 0}
        residue:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        access:
          type: object
          additionalProperties: {type: integer, minimum: 0}
    EventCleanupSummary:
      type: object
      additionalProperties: false
      required:
        - workshops
        - seats
        - sessions
        - external_residue
        - access_residue
        - active_entitlements
        - identities_due_disable
      properties:
        workshops: {type: integer, minimum: 0}
        seats: {type: integer, minimum: 0}
        sessions: {type: integer, minimum: 0}
        external_residue: {type: integer, minimum: 0}
        access_residue: {type: integer, minimum: 0}
        active_entitlements: {type: integer, minimum: 0}
        identities_due_disable: {type: integer, minimum: 0}
    EventCleanupEvidenceResult:
      type: object
      additionalProperties: false
      required:
        - event_id
        - cleanup_verified
        - cleanup_evidence_id
        - released_reservations
        - summary
        - workshops
        - observed_at
      properties:
        event_id: {type: string, minLength: 1}
        cleanup_verified: {type: boolean, const: true}
        cleanup_evidence_id:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        released_reservations: {type: integer, minimum: 0}
        summary: {$ref: '#/components/schemas/EventCleanupSummary'}
        workshops:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventCleanupWorkshopEvidence'}
        observed_at: {type: string, format: date-time}
    EventWorkshopReclaimItem:
      type: object
      additionalProperties: false
      required:
        - reservation_id
        - workshop_id
        - lifecycle_job_id
        - cluster_ref
        - public_access_state
      properties:
        reservation_id: {type: string, minLength: 1}
        workshop_id: {type: string, minLength: 1}
        lifecycle_job_id: {type: string, minLength: 1}
        cluster_ref: {type: string, minLength: 1}
        public_access_state:
          type: string
          enum: [not_required, disabled]
    EventWorkshopReclaimResult:
      type: object
      additionalProperties: false
      required: [event_id, status, workshops]
      properties:
        event_id: {type: string, minLength: 1}
        status: {type: string, const: queued}
        workshops:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventWorkshopReclaimItem'}
    EventWorkshopStatusItem:
      type: object
      additionalProperties: false
      required:
        - reservation_id
        - cohort_id
        - lab_ref
        - catalog_id
        - catalog_release
        - cluster_ref
        - seats
        - reservation_status
        - ready_seats
        - failed_seats
        - reclaimed_seats
        - public_access_state
      properties:
        reservation_id: {type: string, minLength: 1}
        cohort_id: {type: string, minLength: 1}
        lab_ref: {type: string, minLength: 1}
        catalog_id: {type: string, minLength: 1}
        catalog_release: {type: string, minLength: 1}
        cluster_ref: {type: string, minLength: 1}
        seats: {type: integer, minimum: 1}
        reservation_status:
          type: string
          enum: [held, consumed, released, expired]
        workshop_id: {type: [string, 'null']}
        workshop_status: {type: [string, 'null']}
        lifecycle_job_id: {type: [string, 'null']}
        lifecycle_job_status: {type: [string, 'null']}
        ready_seats: {type: integer, minimum: 0}
        failed_seats: {type: integer, minimum: 0}
        reclaimed_seats: {type: integer, minimum: 0}
        public_access_state:
          type: string
          enum: [not_required, pending_activation, active, disabled]
        public_url: {type: [string, 'null'], format: uri}
    EventStatusSummary:
      type: object
      additionalProperties: false
      required:
        - reservations
        - workshops
        - lifecycle_jobs
        - seats
        - ready_seats
        - failed_seats
        - reclaimed_seats
        - public_workshops_active
      properties:
        reservations: {type: integer, minimum: 0}
        workshops: {type: integer, minimum: 0}
        lifecycle_jobs: {type: integer, minimum: 0}
        seats: {type: integer, minimum: 0}
        ready_seats: {type: integer, minimum: 0}
        failed_seats: {type: integer, minimum: 0}
        reclaimed_seats: {type: integer, minimum: 0}
        public_workshops_active: {type: integer, minimum: 0}
    EventStatusResult:
      type: object
      additionalProperties: false
      required:
        - event_id
        - state
        - reservation_complete
        - summary
        - workshops
        - observed_at
      properties:
        event_id: {type: string, minLength: 1}
        state:
          type: string
          enum:
            - approved
            - reserved
            - progressing
            - awaiting_public_access
            - ready
            - cleanup_evidence_pending
            - released
            - attention_required
        reservation_complete: {type: boolean}
        summary: {$ref: '#/components/schemas/EventStatusSummary'}
        workshops:
          type: array
          items: {$ref: '#/components/schemas/EventWorkshopStatusItem'}
        observed_at: {type: string, format: date-time}
    EventWorkshopLaunchRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id: {type: string, minLength: 1}
    EventWorkshopLaunchItem:
      type: object
      additionalProperties: false
      required:
        - reservation_id
        - cohort_id
        - lab_ref
        - workshop_id
        - lifecycle_job_id
        - cluster_ref
        - catalog_id
        - catalog_release
        - seats
      properties:
        reservation_id: {type: string, minLength: 1}
        cohort_id: {type: string, minLength: 1}
        lab_ref: {type: string, minLength: 1}
        workshop_id: {type: string, minLength: 1}
        lifecycle_job_id: {type: string, minLength: 1}
        cluster_ref: {type: string, minLength: 1}
        catalog_id: {type: string, minLength: 1}
        catalog_release: {type: string, minLength: 1}
        seats: {type: integer, minimum: 1}
    EventWorkshopLaunchResult:
      type: object
      additionalProperties: false
      required: [event_id, tenant_id, status, public_access_state, workshops]
      properties:
        event_id: {type: string, minLength: 1}
        tenant_id: {type: string, minLength: 1}
        status: {type: string, const: queued}
        public_access_state:
          type: string
          enum: [not_required, pending_activation]
        workshops:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/EventWorkshopLaunchItem'}
    EventWorkshopPublicAccessResult:
      type: object
      additionalProperties: false
      required:
        - event_id
        - workshop_id
        - public_url
        - one_time_access_code
        - expires_at
      properties:
        event_id: {type: string, minLength: 1}
        workshop_id: {type: string, minLength: 1}
        public_url: {type: string, format: uri}
        one_time_access_code: {type: string, minLength: 1, readOnly: true}
        expires_at: {type: string, format: date-time}
