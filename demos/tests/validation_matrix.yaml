# Validation Matrix for Intel-Red Hat Partner AI Demo Platform
# Defines pass/fail criteria for each stage gate

stage_0_test_infrastructure:
  framework:
    test_framework_loads:
      description: "Test framework module loads successfully"
      points: 10
      required: true
    make_test_runs:
      description: "Can execute make test-all without errors"
      points: 15
      required: true
    validation_matrix_parses:
      description: "Validation matrix YAML loads and parses"
      points: 10
      required: true

  rubrics:
    rubric_files_exist:
      description: "Rubric files are present in tests/rubrics/"
      points: 10
      required: true
    rubrics_well_defined:
      description: "Rubric files have proper structure with scoring criteria"
      points: 15
      required: true

  ci_pipeline:
    ci_config_present:
      description: "CI configuration file exists"
      points: 5
      required: false
    ci_runs_tests:
      description: "CI pipeline executes test suite"
      points: 5
      required: false

  ci_reliability:
    no_continue_on_error:
      description: "CI test stages do not use continue-on-error"
      points: 5
      required: true
    no_makefile_dash_prefix:
      description: "Makefile test targets do not use - prefix to ignore failures"
      points: 5
      required: true
    single_conftest:
      description: "project_root fixture defined only in conftest.py"
      points: 5
      required: true

# Stage 0 Passing Threshold: 90% of total points

stage_1_cpu_inference:
  container_build:
    build_success:
      description: "vLLM CPU container builds successfully"
      points: 15
      required: true
    build_time:
      description: "Build completes in < 5 minutes"
      points: 5
      required: false
    image_size:
      description: "Image size < 5GB"
      points: 5
      required: false
    vulnerabilities:
      description: "Security scan shows 0 critical, 0 high vulns"
      points: 10
      required: true

  container_runtime:
    starts_without_error:
      description: "Container starts successfully"
      points: 15
      required: true
    health_endpoint_200:
      description: "Health endpoint returns HTTP 200"
      points: 10
      required: true
    non_root_user:
      description: "Container runs as non-root user"
      points: 10
      required: true
    graceful_shutdown:
      description: "Container shuts down gracefully on SIGTERM"
      points: 5
      required: false

  local_inference:
    model_loads:
      description: "Test model loads successfully"
      points: 15
      required: true
    generates_output:
      description: "Inference generates text output"
      points: 15
      required: true
    ttft_acceptable:
      description: "Time-to-first-token < 2000ms for tiny model"
      points: 10
      required: false
    tokens_per_sec:
      description: "Generates > 10 tokens/sec"
      points: 10
      required: false
    concurrent_requests:
      description: "Handles 3 concurrent requests"
      points: 5
      required: false
    reliability:
      description: "10 consecutive successful inferences"
      points: 10
      required: true

  manifests:
    yaml_valid:
      description: "All manifest files are valid YAML"
      points: 10
      required: true
    kustomize_builds:
      description: "kustomize build succeeds"
      points: 10
      required: true
    oc_dry_run:
      description: "oc apply --dry-run=client passes"
      points: 15
      required: true
    has_namespace:
      description: "Namespace manifest present"
      points: 5
      required: true
    has_serving_runtime:
      description: "ServingRuntime manifest present"
      points: 5
      required: true
    has_inference_service:
      description: "InferenceService manifest present"
      points: 5
      required: true
    non_root_security_context:
      description: "Security context specifies non-root"
      points: 10
      required: true
    resource_limits_defined:
      description: "Resource limits defined for all containers"
      points: 5
      required: true

  container_security:
    inference_auth:
      description: "Inference servers have API key authentication"
      points: 10
      required: true
    error_sanitization:
      description: "500 errors do not leak raw exception messages"
      points: 5
      required: true
    unique_ids:
      description: "Completion IDs use uuid, not timestamp"
      points: 3
      required: false

  quickstart:
    readme_exists:
      description: "README.md exists in quickstart directory"
      points: 5
      required: true
    has_prerequisites:
      description: "README includes prerequisites section"
      points: 5
      required: true
    has_step_by_step:
      description: "README has numbered step-by-step instructions"
      points: 10
      required: true
    files_referenced_exist:
      description: "All files referenced in README actually exist"
      points: 10
      required: true
    expected_output_shown:
      description: "README shows expected output for commands"
      points: 5
      required: false

