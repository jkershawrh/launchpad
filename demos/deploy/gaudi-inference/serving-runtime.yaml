---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-gaudi-runtime
  namespace: intel-rh-gaudi-inference
  labels:
    app.kubernetes.io/name: vllm-gaudi-runtime
    platform: intel-gaudi
    accelerator: gaudi-gpu
  annotations:
    description: "vLLM inference runtime for Intel Gaudi accelerators"
    openshift.io/display-name: "vLLM Gaudi Runtime"
    platform.intel.com/accelerator: gaudi
spec:
  supportedModelFormats:
    - name: pytorch
      version: "2"
      autoSelect: true
    - name: vllm
      version: "1"
      autoSelect: true

  protocolVersions:
    - v2
    - v1

  containers:
    - name: kserve-container
      # V1: Local testing image
      # V2: Replace with actual Gaudi image from vault.habana.ai or quay.io
      image: "quay.io/intel-redhat/vllm-gaudi:latest"
      imagePullPolicy: IfNotPresent

      envFrom:
        - configMapRef:
            name: gaudi-inference-config

      env:
        - name: MODEL_NAME
          value: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
        - name: PORT
          value: "8000"
        - name: HF_HOME
          value: /opt/app-root/src/.cache
        - name: TRANSFORMERS_CACHE
          value: /opt/app-root/src/.cache
        - name: HABANA_VISIBLE_DEVICES
          value: "all"
        - name: HABANA_LOGS
          value: /opt/app-root/src/logs/habana
        - name: HABANA_USE_MOCK
          value: "true"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true

      ports:
        - name: http
          containerPort: 8000
          protocol: TCP

      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          # Request Gaudi GPU
          habana.ai/gaudi: "1"
        limits:
          cpu: "8"
          memory: "32Gi"
          # Limit Gaudi GPU
          habana.ai/gaudi: "1"

      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      startupProbe:
        httpGet:
          path: /health
          port: http
        failureThreshold: 60
        periodSeconds: 5

      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

      volumeMounts:
        - name: model-cache
          mountPath: /opt/app-root/src/.cache
        - name: tmp
          mountPath: /tmp

  volumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-cache
    - name: tmp
      emptyDir: {}

  nodeSelector:
    node-role.kubernetes.io/worker: ""
    intel.feature.node.kubernetes.io/gaudi: "true"

  tolerations:
    - key: "intel.com/gaudi"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
