---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: intel-rh-openvino-inference

resources:
  - namespace.yaml
  - serving-runtime.yaml
  - inference-service-embeddings.yaml
  - model-cache-pvc.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: intel-rh-ai-platform
  platform: intel-xeon6

commonAnnotations:
  platform.intel.com/runtime: openvino
  platform.intel.com/accelerator: amx-bf16
