apiVersion: v1
kind: Secret
metadata:
  name: gateway-config
  namespace: intel-rh-demo
type: Opaque
stringData:
  LITELLM_API_KEY: "CHANGE-ME"
  LITELLM_API_BASE: "https://litellm-prod.apps.maas.redhatworkshops.io"
  LOCAL_FALLBACK_ENABLED: "false"
  DATABASE_URL: "postgresql://gateway:CHANGE-ME@postgres:5432/inference_platform"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: intel-rh-demo
type: Opaque
stringData:
  POSTGRES_USER: gateway
  POSTGRES_PASSWORD: "CHANGE-ME"
  POSTGRES_DB: inference_platform
---
apiVersion: v1
kind: Secret
metadata:
  name: proxy-cookie-secret
  namespace: intel-rh-demo
type: Opaque
stringData:
  session_secret: "CHANGE-ME-BASE64-RANDOM"
