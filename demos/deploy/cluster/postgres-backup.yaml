apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: intel-rh-demo
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: docker.io/library/postgres:15-alpine
              command: ["/bin/sh", "-c"]
              args:
                - pg_dump -U gateway -h postgres inference_platform > /backup/dump-$(date +%Y%m%d-%H%M%S).sql
              envFrom:
                - secretRef:
                    name: postgres-credentials
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: intel-rh-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
