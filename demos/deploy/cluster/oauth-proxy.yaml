apiVersion: v1
kind: ServiceAccount
metadata:
  name: intel-rh-demo-proxy
  namespace: intel-rh-inference-gateway
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"inference-gateway"}}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-proxy
  namespace: intel-rh-inference-gateway
  labels:
    app: oauth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-proxy
  template:
    metadata:
      labels:
        app: oauth-proxy
    spec:
      serviceAccountName: intel-rh-demo-proxy
      containers:
        - name: oauth-proxy
          image: quay.io/openshift/origin-oauth-proxy:4.14
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=intel-rh-demo-proxy
            - --upstream=http://inference-gateway:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --pass-basic-auth=false
            - --pass-access-token=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
            - name: proxy-secrets
              mountPath: /etc/proxy/secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tls
          secret:
            secretName: oauth-proxy-tls
        - name: proxy-secrets
          secret:
            secretName: oauth-proxy-session
---
apiVersion: v1
kind: Service
metadata:
  name: oauth-proxy
  namespace: intel-rh-inference-gateway
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: oauth-proxy-tls
spec:
  selector:
    app: oauth-proxy
  ports:
    - port: 8443
      targetPort: 8443
      name: https
