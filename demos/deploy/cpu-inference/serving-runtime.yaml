---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu-runtime
  namespace: intel-rh-cpu-inference
  labels:
    app.kubernetes.io/name: vllm-cpu-runtime
    platform: intel-xeon6
  annotations:
    description: "vLLM CPU inference runtime for Intel Xeon6"
    openshift.io/display-name: "vLLM CPU Runtime (Xeon6)"
spec:
  supportedModelFormats:
    - name: pytorch
      version: "2"
      autoSelect: true
    - name: vllm
      version: "1"
      autoSelect: true

  protocolVersions:
    - v2
    - v1

  containers:
    - name: kserve-container
      image: "quay.io/intel-redhat/vllm-cpu:latest"
      imagePullPolicy: IfNotPresent

      envFrom:
        - configMapRef:
            name: inference-config

      env:
        - name: MODEL_NAME
          value: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
        - name: PORT
          value: "8000"
        - name: HF_HOME
          value: /opt/app-root/src/.cache
        - name: TRANSFORMERS_CACHE
          value: /opt/app-root/src/.cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true

      ports:
        - name: http
          containerPort: 8000
          protocol: TCP

      resources:
        requests:
          cpu: "2"
          memory: "6Gi"
        limits:
          cpu: "4"
          memory: "8Gi"

      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      startupProbe:
        httpGet:
          path: /health
          port: http
        failureThreshold: 60
        periodSeconds: 5

      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

      volumeMounts:
        - name: model-cache
          mountPath: /opt/app-root/src/.cache
        - name: tmp
          mountPath: /tmp

  volumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-cache
    - name: tmp
      emptyDir: {}

  nodeSelector:
    node-role.kubernetes.io/worker: ""
