---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: intel-rh-database
  labels:
    app.kubernetes.io/name: inference-database
    app.kubernetes.io/part-of: intel-rh-ai-platform
type: Opaque
# IMPORTANT: Change all CHANGE-ME-BEFORE-DEPLOY values before deploying to any environment
stringData:
  POSTGRES_USER: gateway
  POSTGRES_PASSWORD: CHANGE-ME-BEFORE-DEPLOY
  POSTGRES_DB: inference_platform
  DATABASE_URL: postgresql://gateway:CHANGE-ME-BEFORE-DEPLOY@postgres.intel-rh-database.svc.cluster.local:5432/inference_platform
