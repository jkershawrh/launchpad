apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: intel-rh-demo-build
  namespace: intel-rh-demo
spec:
  params:
    - name: git-url
      type: string
      default: "https://github.com/your-org/red_hat_intel_partner_demo.git"
    - name: git-revision
      type: string
      default: "main"
    - name: image-registry
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/intel-rh-demo"
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskSpec:
        workspaces:
          - name: output
        params:
          - name: url
          - name: revision
        steps:
          - name: clone
            image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel8:v1.22
            script: |
              git clone $(params.url) --branch $(params.revision) --single-branch --depth 1 $(workspaces.output.path)/repo
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: source

    - name: build-gateway
      runAfter: [clone]
      taskSpec:
        workspaces:
          - name: source
        params:
          - name: IMAGE
        steps:
          - name: build-and-push
            image: registry.redhat.io/rhel9/buildah:latest
            securityContext:
              privileged: true
            script: |
              cd $(workspaces.source.path)/repo
              buildah bud --storage-driver=vfs -f gateway/Containerfile -t $(params.IMAGE) gateway/
              buildah push --storage-driver=vfs --tls-verify=false $(params.IMAGE)
      params:
        - name: IMAGE
          value: $(params.image-registry)/inference-gateway:latest
      workspaces:
        - name: source
          workspace: source

    - name: build-frontend
      runAfter: [clone]
      taskSpec:
        workspaces:
          - name: source
        params:
          - name: IMAGE
        steps:
          - name: build-and-push
            image: registry.redhat.io/rhel9/buildah:latest
            securityContext:
              privileged: true
            script: |
              cd $(workspaces.source.path)/repo
              buildah bud --storage-driver=vfs -f frontend/Containerfile -t $(params.IMAGE) frontend/
              buildah push --storage-driver=vfs --tls-verify=false $(params.IMAGE)
      params:
        - name: IMAGE
          value: $(params.image-registry)/inference-frontend:latest
      workspaces:
        - name: source
          workspace: source

    - name: deploy
      runAfter: [build-gateway, build-frontend]
      taskSpec:
        steps:
          - name: rollout
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              oc rollout restart deployment/gateway -n intel-rh-demo
              oc rollout restart deployment/frontend -n intel-rh-demo
              echo "Waiting for gateway..."
              oc rollout status deployment/gateway -n intel-rh-demo --timeout=120s
              echo "Waiting for frontend..."
              oc rollout status deployment/frontend -n intel-rh-demo --timeout=60s
              echo "Deploy complete."
