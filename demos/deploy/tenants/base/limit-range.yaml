apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: intel-rh-partner-TENANT_SLUG
  labels:
    tenant: TENANT_SLUG
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "4"
        memory: "16Gi"
