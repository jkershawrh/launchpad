<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Red Hat Text, sans-serif">
  <rect width="800" height="400" fill="#f0f0f0" rx="8"/>
  <text x="400" y="28" fill="#1a1a2e" font-size="16" font-weight="700" text-anchor="middle">2U Rack Server — Intel Xeon 6 Platform</text>
  <!-- Rack frame -->
  <rect x="80" y="50" width="640" height="240" fill="#333" rx="6" stroke="#555" stroke-width="2"/>
  <!-- Server chassis -->
  <rect x="100" y="70" width="600" height="80" fill="#2d3436" rx="4" stroke="#666"/>
  <!-- Front panel -->
  <rect x="110" y="80" width="20" height="20" fill="#1a1a2e" rx="2"/><circle cx="120" cy="90" r="3" fill="#2ecc71"/>
  <rect x="110" y="110" width="20" height="20" fill="#1a1a2e" rx="2"/><circle cx="120" cy="120" r="3" fill="#3498db"/>
  <!-- Drive bays -->
  <g fill="#444" stroke="#555">
    <rect x="145" y="78" width="55" height="55" rx="2"/><text x="150" y="110" fill="#888" font-size="7">NVMe 0</text>
    <rect x="205" y="78" width="55" height="55" rx="2"/><text x="210" y="110" fill="#888" font-size="7">NVMe 1</text>
    <rect x="265" y="78" width="55" height="55" rx="2"/><text x="270" y="110" fill="#888" font-size="7">Bay 2</text>
    <rect x="325" y="78" width="55" height="55" rx="2"/><text x="330" y="110" fill="#888" font-size="7">Bay 3</text>
  </g>
  <!-- CPU/Memory section -->
  <rect x="400" y="78" width="180" height="55" fill="#1a1a2e" rx="3"/>
  <text x="490" y="98" fill="#3498db" font-size="11" font-weight="700" text-anchor="middle">2x Intel Xeon 6</text>
  <text x="490" y="112" fill="#8892b0" font-size="9" text-anchor="middle">AMX Enabled</text>
  <text x="490" y="125" fill="#666" font-size="8" text-anchor="middle">256GB DDR5 (8x32GB)</text>
  <!-- PSU -->
  <rect x="600" y="78" width="90" height="55" fill="#444" rx="3" stroke="#666"/>
  <text x="645" y="100" fill="#2ecc71" font-size="9" text-anchor="middle">PSU 1</text>
  <text x="645" y="115" fill="#2ecc71" font-size="8" text-anchor="middle">● OK</text>
  <text x="645" y="128" fill="#888" font-size="7" text-anchor="middle">1200W</text>
  <!-- Second server (Gaudi node) -->
  <rect x="100" y="165" width="600" height="80" fill="#2d3436" rx="4" stroke="#e67e22"/>
  <rect x="110" y="175" width="20" height="20" fill="#1a1a2e" rx="2"/><circle cx="120" cy="185" r="3" fill="#e67e22"/>
  <rect x="110" y="205" width="20" height="20" fill="#1a1a2e" rx="2"/><circle cx="120" cy="215" r="3" fill="#e67e22"/>
  <g fill="#444" stroke="#555">
    <rect x="145" y="173" width="55" height="55" rx="2"/><text x="150" y="205" fill="#888" font-size="7">NVMe 0</text>
    <rect x="205" y="173" width="55" height="55" rx="2"/><text x="210" y="205" fill="#888" font-size="7">NVMe 1</text>
  </g>
  <rect x="275" y="173" width="305" height="55" fill="#1a1a2e" rx="3" stroke="#e67e22" stroke-width="1"/>
  <text x="428" y="193" fill="#e67e22" font-size="11" font-weight="700" text-anchor="middle">2x Intel Xeon 6 + 8x Intel Gaudi 2</text>
  <text x="428" y="207" fill="#8892b0" font-size="9" text-anchor="middle">768GB HBM2E Total • PCIe Gen4</text>
  <text x="428" y="220" fill="#666" font-size="8" text-anchor="middle">AI Inference Optimized</text>
  <rect x="600" y="173" width="90" height="55" fill="#444" rx="3" stroke="#666"/>
  <text x="645" y="195" fill="#e67e22" font-size="9" text-anchor="middle">PSU 1+2</text>
  <text x="645" y="210" fill="#e67e22" font-size="8" text-anchor="middle">● OK</text>
  <text x="645" y="223" fill="#888" font-size="7" text-anchor="middle">3000W</text>
  <!-- Labels -->
  <text x="90" y="145" fill="#3498db" font-size="10" font-weight="600">CPU Worker Node</text>
  <text x="90" y="260" fill="#e67e22" font-size="10" font-weight="600">Gaudi Worker Node</text>
  <!-- Specs bar -->
  <rect x="80" y="305" width="640" height="75" fill="#fff" rx="6" stroke="#ddd"/>
  <text x="100" y="330" fill="#1a1a2e" font-size="12" font-weight="700">Intel-Red Hat OpenShift AI Inference Cluster</text>
  <text x="100" y="350" fill="#555" font-size="10">CPU Nodes: 3x workers (Xeon 6, AMX, 256GB DDR5) — handles 70% of inference at 1/10th GPU cost</text>
  <text x="100" y="368" fill="#555" font-size="10">GPU Nodes: 1x worker (Xeon 6 + 8x Gaudi 2, 768GB HBM) — handles heavy generation at 100+ tok/s</text>
</svg>
