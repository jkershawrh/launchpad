<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Red Hat Text, sans-serif">
  <rect width="800" height="500" fill="#f8f9fa" rx="8"/>
  <text x="400" y="30" fill="#1a1a2e" font-size="16" font-weight="700" text-anchor="middle">Intel-Red Hat AI Inference Platform — Routing Architecture</text>
  <!-- Client -->
  <rect x="320" y="50" width="160" height="40" fill="#1a1a2e" rx="6"/>
  <text x="400" y="75" fill="#fff" font-size="12" text-anchor="middle">Client Request</text>
  <!-- Arrow down -->
  <line x1="400" y1="90" x2="400" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#666"/></marker></defs>
  <!-- Route + OAuth -->
  <rect x="280" y="120" width="240" height="35" fill="#ee0000" rx="6"/>
  <text x="400" y="142" fill="#fff" font-size="11" text-anchor="middle">OpenShift Route + OAuth Proxy</text>
  <!-- Arrow down -->
  <line x1="400" y1="155" x2="400" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Gateway -->
  <rect x="280" y="185" width="240" height="45" fill="#1a1a2e" rx="6" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="205" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Inference Gateway</text>
  <text x="400" y="220" fill="#8892b0" font-size="9" text-anchor="middle">Task Type → Token Count → Priority → Lane</text>
  <!-- Three arrows -->
  <line x1="320" y1="230" x2="130" y2="280" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="230" x2="400" y2="280" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="230" x2="670" y2="280" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Eco Lane -->
  <rect x="30" y="280" width="200" height="110" fill="#d5f5e3" rx="8" stroke="#2ecc71" stroke-width="2"/>
  <rect x="30" y="280" width="200" height="4" fill="#2ecc71" rx="2"/>
  <text x="130" y="305" fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle">Eco Lane</text>
  <text x="130" y="325" fill="#27ae60" font-size="11" text-anchor="middle">Intel Xeon 6</text>
  <text x="130" y="345" fill="#555" font-size="10" text-anchor="middle">Granite Tiny</text>
  <text x="130" y="362" fill="#555" font-size="9" text-anchor="middle">Classification, Small Tasks</text>
  <text x="130" y="378" fill="#888" font-size="9" text-anchor="middle">≤ 4K tokens | $0.0004/1K</text>
  <!-- Performance Lane -->
  <rect x="300" y="280" width="200" height="110" fill="#d6eaf8" rx="8" stroke="#3498db" stroke-width="2"/>
  <rect x="300" y="280" width="200" height="4" fill="#3498db" rx="2"/>
  <text x="400" y="305" fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle">Performance Lane</text>
  <text x="400" y="325" fill="#2980b9" font-size="11" text-anchor="middle">Intel Xeon 6 + AMX</text>
  <text x="400" y="345" fill="#555" font-size="10" text-anchor="middle">CodeLlama 7B</text>
  <text x="400" y="362" fill="#555" font-size="9" text-anchor="middle">Embeddings, Reranking, Summaries</text>
  <text x="400" y="378" fill="#888" font-size="9" text-anchor="middle">≤ 16K tokens | $0.0004/1K</text>
  <!-- Overdrive Lane -->
  <rect x="570" y="280" width="200" height="110" fill="#fdebd0" rx="8" stroke="#e67e22" stroke-width="2"/>
  <rect x="570" y="280" width="200" height="4" fill="#e67e22" rx="2"/>
  <text x="670" y="305" fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle">Overdrive Lane</text>
  <text x="670" y="325" fill="#d35400" font-size="11" text-anchor="middle">Intel Gaudi</text>
  <text x="670" y="345" fill="#555" font-size="10" text-anchor="middle">Llama Scout 17B</text>
  <text x="670" y="362" fill="#555" font-size="9" text-anchor="middle">Generation, RCA, Batch Reports</text>
  <text x="670" y="378" fill="#888" font-size="9" text-anchor="middle">≤ 64K tokens | $0.001/1K</text>
  <!-- Fallback arrows -->
  <path d="M 570,340 C 550,340 530,340 500,340" stroke="#e74c3c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="520" y="335" fill="#e74c3c" font-size="8">fallback</text>
  <path d="M 300,340 C 280,340 260,340 230,340" stroke="#e74c3c" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="250" y="335" fill="#e74c3c" font-size="8">fallback</text>
  <!-- Bottom bar -->
  <rect x="30" y="420" width="740" height="60" fill="#1a1a2e" rx="6"/>
  <text x="50" y="445" fill="#8892b0" font-size="10">PostgreSQL</text>
  <text x="180" y="445" fill="#8892b0" font-size="10">Prometheus + Grafana</text>
  <text x="370" y="445" fill="#8892b0" font-size="10">React Dashboard + OAuth</text>
  <text x="570" y="445" fill="#8892b0" font-size="10">LiteLLM Proxy</text>
  <text x="50" y="465" fill="#555" font-size="9">Decision persistence</text>
  <text x="180" y="465" fill="#555" font-size="9">Observability</text>
  <text x="370" y="465" fill="#555" font-size="9">Demo frontend</text>
  <text x="570" y="465" fill="#555" font-size="9">Model backends</text>
</svg>
