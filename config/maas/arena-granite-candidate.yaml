apiVersion: v1
kind: Namespace
metadata:
  name: launchpad-maas-candidates
  labels:
    istio-injection: enabled
    launchpad.redhat.com/maas-route: allowed
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybrid-fraud-candidate
  namespace: launchpad-maas-candidates
  labels:
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: granite-3-2-8b-tools-candidate
  namespace: launchpad-maas-candidates
  labels:
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
spec:
  provider: openai
  endpoint: vllm-granite-3-2-8b-tools-fleet-llm-d.apps.arena.fm2aihpcsed.com
  auth:
    type: apikey
    secretRef:
      name: granite-candidate-upstream-credential
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: granite-3-2-8b-tools-candidate
  namespace: launchpad-maas-candidates
  labels:
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
spec:
  modelName: granite-3-2-8b-tools-candidate
  externalProviderRefs:
    - ref:
        name: granite-3-2-8b-tools-candidate
      targetModel: granite-3.2-8b-tools
      apiFormat: openai-chat
      path: /v1/chat/completions
      weight: 1
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: granite-3-2-8b-tools-candidate
  namespace: launchpad-maas-candidates
  annotations:
    openshift.io/display-name: Granite 3.2 8B Tools - Hybrid Fraud Candidate
    openshift.io/description: Candidate-only MaaS publication reusing the existing Arena Granite service.
    opendatahub.io/genai-use-case: chat
    opendatahub.io/context-window: "4096"
    opendatahub.io/model-capabilities: '["text-generation","tool-calling"]'
  labels:
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
spec:
  modelRef:
    kind: ExternalModel
    name: granite-3-2-8b-tools-candidate
  tenantRef: models-as-a-service
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: granite-candidate-arena-ingress-trust
  namespace: openshift-ingress
  labels:
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
spec:
  host: vllm-granite-3-2-8b-tools-fleet-llm-d.apps.arena.fm2aihpcsed.com
  exportTo:
    - .
  trafficPolicy:
    tls:
      mode: SIMPLE
      sni: vllm-granite-3-2-8b-tools-fleet-llm-d.apps.arena.fm2aihpcsed.com
      credentialName: granite-candidate-arena-ingress-ca
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: hybrid-fraud-candidate
  namespace: models-as-a-service
  labels:
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
spec:
  owner:
    users:
      - system:serviceaccount:launchpad-maas-candidates:hybrid-fraud-candidate
  priority: 10
  modelRefs:
    - name: granite-3-2-8b-tools-candidate
      namespace: launchpad-maas-candidates
      tokenRateLimits:
        - limit: 120000
          window: 1h
      billingRate:
        perToken: "0"
  tokenMetadata:
    organizationId: launchpad
    costCenter: catalog-intake
    labels:
      catalog_item_id: hybrid-fraud-detection
      lifecycle: candidate
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: hybrid-fraud-candidate
  namespace: models-as-a-service
  labels:
    launchpad.redhat.com/scope: candidate
    launchpad.redhat.com/release-eligible: "false"
spec:
  subjects:
    users:
      - system:serviceaccount:launchpad-maas-candidates:hybrid-fraud-candidate
  modelRefs:
    - name: granite-3-2-8b-tools-candidate
      namespace: launchpad-maas-candidates
  meteringMetadata:
    organizationId: launchpad
    costCenter: catalog-intake
    labels:
      catalog_item_id: hybrid-fraud-detection
      lifecycle: candidate
